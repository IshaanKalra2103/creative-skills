<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Printed Rooms</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f3ebdd;overscroll-behavior:none}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
  #stage.drag{cursor:grabbing}
</style>
</head><body>
<canvas id="stage" aria-label="an isometric risograph illustration"></canvas>
<script>
'use strict';
/* =====================================================================
   ENGINE — the print look, the pen, the camera. Scenes live at the bottom.
   ===================================================================== */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;

/* ---------- seeded randomness: same keys -> same numbers, every frame ---------- */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry(a){return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function stream(...keys){let h=0x9E3779B9;for(const k of keys){h=Math.imul(h^hashStr(String(k)),0x85EBCA6B);h^=h>>>13}const r=mulberry(h>>>0);r();r();return r}
const rand=(R,a,b)=>a+R()*(b-a);
const randi=(R,a,b)=>Math.floor(rand(R,a,b+1));
const pick=(R,arr)=>arr[Math.floor(R()*arr.length)];
function hash2(x,y,s){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041);h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296}
function noise(x,y,s=0){const xi=Math.floor(x),yi=Math.floor(y),u=x-xi,v=y-yi,a=u*u*(3-2*u),b=v*v*(3-2*v);
  return lerp(lerp(hash2(xi,yi,s),hash2(xi+1,yi,s),a),lerp(hash2(xi,yi+1,s),hash2(xi+1,yi+1,s),a),b)*2-1}

/* ---------- polyline helpers ---------- */
function resample(P,step){
  const out=[P[0].slice()];let need=step;
  for(let n=1;n<P.length;n++){let x0=P[n-1][0],y0=P[n-1][1];const x1=P[n][0],y1=P[n][1];let d=Math.hypot(x1-x0,y1-y0);
    while(d>=need&&d>0){const t=need/d;x0+=(x1-x0)*t;y0+=(y1-y0)*t;out.push([x0,y0]);d-=need;need=step}need-=d}
  const L=P[P.length-1],E=out[out.length-1];if(Math.hypot(L[0]-E[0],L[1]-E[1])>step*.25)out.push(L.slice());
  return out}
function smooth(P,closed=false,it=2){let p=P;
  for(let k=0;k<it;k++){const q=[],n=p.length;if(!closed)q.push(p[0]);
    for(let i=0;i<(closed?n:n-1);i++){const a=p[i],b=p[(i+1)%n];q.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75])}
    if(!closed)q.push(p[n-1]);p=q}
  return p}

/* ---------- isometric projection: i runs right-down, j runs left-down, z up ---------- */
const TW=64,TH=32,TZ=32;
const iso=(i,j,z=0)=>[(i-j)*TW/2,(i+j)*TH/2-z*TZ];

/* ---------- inks (real Riso drum colours) ---------- */
const PAPER=[243,235,221];
const INKS={
  blue:[61,85,136],     // Federal Blue — linework, shadows, night
  coral:[241,80,96],    // Bright Red — warm objects, skin at low tone
  yellow:[255,232,0],   // Yellow — light, glow, highlights
  teal:[0,131,138],     // Teal — plants, water, glass
};
const ANGLE={blue:15,coral:75,yellow:0,teal:45};   // halftone screen angles (moiré is the point)
const MISREG=1.1;                                   // plate misregistration in world px
const css=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const PAPER_CSS=css(PAPER);

/* ---------- halftone screens ---------- */
const SS=4,CELL=2.3,TILE_N=8,LEVELS=16;   // CELL = dot pitch in world px
const tiles=new Map();
function halftoneTile(ink,level){
  const key=ink+'|'+level;let cv=tiles.get(key);if(cv)return cv;
  const cell=CELL*SS,size=cell*TILE_N,tone=level/LEVELS,salt=hashStr(ink)%9973;
  cv=document.createElement('canvas');cv.width=cv.height=size;
  const c=cv.getContext('2d');c.fillStyle=css(INKS[ink]);
  if(level>=LEVELS)c.fillRect(0,0,size,size);
  else if(tone<=.5){                                  // growing dots
    for(let y=0;y<TILE_N;y++)for(let x=0;x<TILE_N;x++){
      const r=cell*Math.sqrt(tone/Math.PI)*(.9+hash2(x,y,salt+level)*.18);
      const jx=(hash2(x,y,salt)-.5)*.08*cell,jy=(hash2(y,x,salt)-.5)*.08*cell;
      c.beginPath();c.arc((x+.5)*cell+jx,(y+.5)*cell+jy,r,0,TAU);c.fill()}
  }else{                                              // solid with shrinking holes
    c.fillRect(0,0,size,size);c.globalCompositeOperation='destination-out';
    for(let y=0;y<=TILE_N;y++)for(let x=0;x<=TILE_N;x++){
      const r=cell*Math.sqrt((1-tone)/Math.PI)*(.9+hash2(x%TILE_N,y%TILE_N,salt+level)*.18);
      c.beginPath();c.arc(x*cell,y*cell,r,0,TAU);c.fill()}
  }
  c.globalCompositeOperation='destination-out';       // worn-drum specks
  const R=stream('speck',ink,level),n=size*size/260;
  for(let k=0;k<n;k++){const s=rand(R,1,3.4);c.globalAlpha=rand(R,.25,.9);c.fillRect(R()*size,R()*size,s,s)}
  tiles.set(key,cv);return cv}
const screens=new WeakMap();
function screen(ctx,ink,tone,dx,dy){
  let bank=screens.get(ctx);if(!bank)screens.set(ctx,bank=new Map());
  const level=clamp(Math.round(tone*LEVELS),1,LEVELS),key=`${ink}|${level}|${dx.toFixed(2)}|${dy.toFixed(2)}`;
  let pat=bank.get(key);if(pat)return pat;
  pat=ctx.createPattern(halftoneTile(ink,level),'repeat');
  pat.setTransform(new DOMMatrix().translateSelf(dx,dy).rotateSelf(ANGLE[ink]||0).scaleSelf(1/SS));
  bank.set(key,pat);return pat}

/* ---------- paper grain ---------- */
let grainPattern=null;
function grain(ctx){
  if(grainPattern)return grainPattern;
  const cv=document.createElement('canvas');cv.width=cv.height=384;const c=cv.getContext('2d'),R=stream('grain');
  for(let k=0;k<2600;k++){c.fillStyle=css(INKS.blue,rand(R,.03,.11));const s=rand(R,.6,1.8);c.fillRect(R()*384,R()*384,s,s)}
  for(let k=0;k<120;k++){c.strokeStyle=css(pick(R,[INKS.coral,INKS.blue]),rand(R,.04,.09));c.lineWidth=.6;const x=R()*384,y=R()*384,a=R()*TAU,l=rand(R,4,12);
    c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+Math.cos(a+.6)*l*.5,y+Math.sin(a+.6)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);c.stroke()}
  return grainPattern=ctx.createPattern(cv,'repeat')}

/* =====================================================================
   THE PEN — every mark goes through here. Points are screen-space [x,y]
   arrays; pen.p(i,j,z) turns room coordinates into them.
   ===================================================================== */
function makePen(ctx,opt={}){
  const ox=opt.ox||0,oy=opt.oy||0,boil=opt.boil||0,variant=boil%3;
  const plate={};for(const k in INKS){const J=stream('plate',k,variant);plate[k]=[rand(J,-1,1)*MISREG,rand(J,-1,1)*MISREG]}
  const pen={ctx,boil,ox,oy};
  const p=pen.p=(i,j,z=0)=>{const q=iso(i,j,z);return [q[0]+ox,q[1]+oy]};
  const trace=(P,dx=0,dy=0)=>{ctx.beginPath();for(let n=0;n<P.length;n++){const x=P[n][0]+dx,y=P[n][1]+dy;n?ctx.lineTo(x,y):ctx.moveTo(x,y)}};
  const withInk=(ink,tone,fn)=>{if(!INKS[ink])ink='blue';const [dx,dy]=plate[ink];
    ctx.globalCompositeOperation='multiply';fn(screen(ctx,ink,tone,dx,dy),dx,dy);ctx.globalCompositeOperation='source-over'};

  /* --- fills --- */
  pen.knock=(P,a=1)=>{if(P.length<3)return;trace(P);ctx.closePath();ctx.fillStyle=a===1?PAPER_CSS:css(PAPER,a);ctx.fill()};
  pen.tint=(P,ink,tone=1)=>{if(tone<=0||P.length<3)return;withInk(ink,tone,(st,dx,dy)=>{trace(P,dx,dy);ctx.closePath();ctx.fillStyle=st;ctx.fill()})};
  pen.fill=(P,ink,tone=1)=>{pen.knock(P);if(ink&&ink!=='paper')pen.tint(P,ink,tone)};

  /* --- the hand-drawn line --- */
  pen.line=(P,ink='blue',w=1.3,o={})=>{
    if(!P||P.length<2)return;
    const src=o.closed?[...P,P[0]]:P;
    let Q=resample(src,Math.max(2.5,w*1.5));if(Q.length<2)return;
    const amp=o.amp??(.35+w*.15);
    if(amp>0){
      const seed=(hash2(Math.round(src[0][0]*3),Math.round(src[0][1]*3),boil*7+1)*1e6)|0;let s=0;
      Q=Q.map((q,n)=>{if(n)s+=Math.hypot(q[0]-Q[n-1][0],q[1]-Q[n-1][1]);
        return [q[0]+noise(s*.045,.5,seed)*amp+(hash2(n,seed,1)-.5)*amp*.3,q[1]+noise(s*.045,7.5,seed)*amp+(hash2(seed,n,2)-.5)*amp*.3]});
      if(o.closed)Q[Q.length-1]=Q[0].slice();
    }
    withInk(ink,o.tone??1,(st,dx,dy)=>{ctx.strokeStyle=st;ctx.lineWidth=w;ctx.lineCap=o.cap||'round';ctx.lineJoin='round';
      if(o.dash)ctx.setLineDash(o.dash);trace(Q,dx,dy);ctx.stroke();if(o.dash)ctx.setLineDash([])});
  };
  pen.shape=(P,fill,o={})=>{if(fill)pen.fill(P,fill[0],fill[1]);if(o.line!==false)pen.line(P,o.line||'blue',o.w??1.2,{closed:true,amp:o.amp,tone:o.lineTone})};
  pen.dot=(x,y,r,ink='blue',tone=1)=>pen.tint(pen.circle(x,y,r,10),ink,tone);

  /* --- geometry (all return point arrays) --- */
  pen.floorQuad=(i,j,w,d,z=0)=>[p(i,j,z),p(i+w,j,z),p(i+w,j+d,z),p(i,j+d,z)];
  pen.wallQuad=(wall,u,z,w,h,off=.02)=>{const W=(a,zz)=>wall==='i'?p(u+a,off,zz):p(off,u+a,zz);return [W(0,z),W(w,z),W(w,z+h),W(0,z+h)]};
  pen.ellipse=(ci,cj,z,ri,rj=ri,n=28)=>Array.from({length:n},(_,k)=>{const a=k/n*TAU;return p(ci+Math.cos(a)*ri,cj+Math.sin(a)*rj,z)});
  pen.circle=(x,y,r,n=18)=>Array.from({length:n},(_,k)=>[x+Math.cos(k/n*TAU)*r,y+Math.sin(k/n*TAU)*r]);
  pen.blob=(x,y,rx,ry,key='blob',lump=.22,n=9)=>{const R=stream('blob',key),P=[];
    for(let k=0;k<n;k++){const a=k/n*TAU+rand(R,-.2,.2),m=1+rand(R,-lump,lump);P.push([x+Math.cos(a)*rx*m,y+Math.sin(a)*ry*m])}
    return smooth(P,true,3)};
  pen.leaf=(a,b,wid)=>{const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L*wid,ny=dx/L*wid;
    return smooth([a,[mx+nx,my+ny],b,[mx-nx,my-ny]],true,2)};

  /* --- solids --- */
  pen.box=(i,j,z,w,d,h,o={})=>{
    const ink=o.ink||'coral',tone=o.tone??.5;
    if(o.shadow!==false)pen.tint(pen.floorQuad(i+.12,j+.18,w,d,z),'blue',.3);
    const top=pen.floorQuad(i,j,w,d,z+h);
    const faceJ=[p(i,j+d,z),p(i+w,j+d,z),p(i+w,j+d,z+h),p(i,j+d,z+h)];   // lower-left face
    const faceI=[p(i+w,j,z),p(i+w,j+d,z),p(i+w,j+d,z+h),p(i+w,j,z+h)];   // lower-right face
    pen.fill(faceJ,o.leftInk||ink,o.left??clamp(tone+.3,0,1));
    pen.fill(faceI,o.rightInk||ink,o.right??clamp(tone+.15,0,1));
    pen.fill(top,o.topInk||ink,o.top??tone);
    if(o.line!==false){const lw=o.w??1.1;for(const F of[faceJ,faceI,top])pen.line(F,'blue',lw,{closed:true})}
    return {top,faceI,faceJ}};

  /* --- the room shell --- */
  pen.shell=(r)=>{
    const {w,d,h}=r,st=r.style||{},T=.25;
    const [fi,ft]=st.floor||['blue',.65],[wi,wt]=st.wall||['coral',.3],[wi2,wt2]=st.wall2||[wi,Math.min(1,wt+.12)];
    const sideJ=[p(-T,d,0),p(w,d,0),p(w,d,-.5),p(-T,d,-.5)],sideI=[p(w,-T,0),p(w,d,0),p(w,d,-.5),p(w,-T,-.5)];
    pen.shape(sideJ,[fi,Math.min(1,ft+.25)]);pen.shape(sideI,[fi,Math.min(1,ft+.12)]);
    pen.shape(pen.floorQuad(-T,-T,w+T,d+T,0),[fi,ft],{w:1.4});
    if(st.planks!==false)for(let a=st.plank||.8;a<d;a+=st.plank||.8)pen.line([p(0,a,0),p(w,a,0)],'blue',.6,{tone:.9,amp:.25});
    if(h>0){
      pen.shape(pen.wallQuad('j',0,0,d,h,0),[wi2,wt2]);
      pen.shape(pen.wallQuad('i',0,0,w,h,0),[wi,wt]);
      pen.shape([p(w,-T,0),p(w,0,0),p(w,0,h),p(w,-T,h)],[wi,Math.min(1,wt+.3)]);
      pen.shape([p(-T,d,0),p(0,d,0),p(0,d,h),p(-T,d,h)],[wi2,Math.min(1,wt2+.3)]);
      pen.shape([p(-T,-T,h),p(w,-T,h),p(w,0,h),p(0,0,h),p(0,d,h),p(-T,d,h)],['paper',0]);
      pen.line([p(0,d,.12),p(0,0,.12),p(w,0,.12)],'blue',.8,{tone:.8});
    }};

  /* --- furniture & props --- */
  pen.table=(i,j,w,d,h=.75,o={})=>{const ink=o.ink||'coral',tone=o.tone??.55,L=.12;
    pen.tint(pen.floorQuad(i+.2,j+.25,w,d,0),'blue',.3);
    for(const [a,b] of [[i,j],[i+w-L,j],[i,j+d-L],[i+w-L,j+d-L]])pen.box(a,b,0,L,L,h-.1,{ink,tone:tone+.2,shadow:false,w:.8});
    pen.box(i-.05,j-.05,h-.1,w+.1,d+.1,.1,{ink,tone,shadow:false});
    return p(i+w/2,j+d/2,h)};
  pen.chair=(i,j,o={})=>{const ink=o.ink||'yellow',tone=o.tone??.7,L=.07;
    pen.tint(pen.floorQuad(i+.1,j+.15,.5,.5,0),'blue',.3);
    for(const [a,b] of [[i,j],[i+.5-L,j],[i,j+.5-L],[i+.5-L,j+.5-L]])pen.box(a,b,0,L,L,.4,{ink:'blue',tone:.8,shadow:false,w:.6});
    if(o.back==='j')pen.box(i,j,.45,.5,.07,.55,{ink,tone,shadow:false,w:.9});
    else pen.box(i,j,.45,.07,.5,.55,{ink,tone,shadow:false,w:.9});
    pen.box(i,j,.4,.5,.5,.06,{ink,tone,shadow:false,w:.9})};
  pen.rug=(i,j,w,d,o={})=>{const ink=o.ink||'teal',tone=o.tone??.45;
    pen.shape(pen.floorQuad(i,j,w,d,.01),[ink,tone],{w:1});
    pen.line(pen.floorQuad(i+.3,j+.3,w-.6,d-.6,.01),o.border||'coral',1.1,{closed:true,tone:.8});
    for(let a=.1;a<d;a+=.18){pen.line([p(i,j+a,0),p(i-.2,j+a,0)],ink,.6,{amp:.1});pen.line([p(i+w,j+a,0),p(i+w+.2,j+a,0)],ink,.6,{amp:.1})}};
  pen.bookcase=(wall,u,wid,hgt,o={})=>{
    const R=stream('shelf',wall,u),rows=o.rows||4,dep=o.depth||.45,ink=o.ink||'coral';
    const [bi,bj,bw,bd]=wall==='i'?[u,0,wid,dep]:[0,u,dep,wid];
    pen.box(bi,bj,0,bw,bd,hgt,{ink,tone:.65});
    const F=(a,z)=>wall==='i'?p(u+a,dep,z):p(dep,u+a,z);
    const rowH=(hgt-.2)/rows;
    for(let r=0;r<rows;r++){const z0=.12+r*rowH,z1=z0+rowH-.08;
      pen.fill([F(.08,z0),F(wid-.08,z0),F(wid-.08,z1),F(.08,z1)],'blue',.85);
      let a=.1;
      while(a<wid-.18){const bw_=rand(R,.07,.14),bh=(z1-z0)*rand(R,.62,.95);
        if(R()<.07){a+=rand(R,.12,.3);continue}
        const q=[F(a,z0),F(a+bw_,z0),F(a+bw_,z0+bh),F(a,z0+bh)];
        pen.fill(q,pick(R,['coral','yellow','teal','paper','coral','teal']),rand(R,.45,.95));
        pen.line(q,'blue',.55,{closed:true,amp:.1});a+=bw_+.012}
      pen.line([F(0,z0),F(wid,z0)],'blue',1.3)}};
  pen.window=(wall,u,z,wid,hgt,o={})=>{
    const q=pen.wallQuad(wall,u,z,wid,hgt),W=(a,zz)=>wall==='i'?p(u+a,.02,zz):p(.02,u+a,zz);
    pen.fill(q,o.sky||'teal',.22);pen.tint(pen.wallQuad(wall,u,z,wid,hgt*.4),'yellow',.3);
    pen.line(q,'blue',1.8,{closed:true});
    pen.line([W(wid/2,z),W(wid/2,z+hgt)],'blue',1.1);pen.line([W(0,z+hgt*.55),W(wid,z+hgt*.55)],'blue',1.1);
    pen.line([W(-.12,z-.03),W(wid+.12,z-.03)],'blue',2.4);
    if(o.patch!==false)pen.sunPatch(wall,u,z,wid,hgt,o)};
  pen.sunPatch=(wall,u,z,wid,hgt,o={})=>{const k=o.reach??1.1,s=o.shear??.45,F=(a,b)=>wall==='i'?p(a,b,.01):p(b,a,.01);
    const q=[F(u+z*s,z*k),F(u+wid+z*s,z*k),F(u+wid+(z+hgt)*s,(z+hgt)*k),F(u+(z+hgt)*s,(z+hgt)*k)];
    pen.light(q,o.light??.5)};
  // light can't come from multiply alone: lift the paper first, then print yellow on top
  pen.light=(P,strength=.5,ink='yellow')=>{pen.knock(P,.35*strength+.1);pen.tint(P,ink,.25+.35*strength)};
  pen.glow=(i,j,z,r,ink='yellow',strength=.6)=>{for(let k=0;k<4;k++){const E=pen.ellipse(i,j,z,r*(1-k*.22));pen.knock(E,.18*strength);pen.tint(E,ink,strength*(k+1)/4)}};
  pen.lamp=(i,j,o={})=>{const h=o.h??1.8,t=o.t||0,on=o.on!==false,fl=.85+.15*noise(t*5,0,hashStr(`${i},${j}`)%999);
    if(on)pen.glow(i,j,0,1.7,'yellow',.55*fl);
    pen.fill(pen.ellipse(i,j,0,.22),'blue',.7);
    pen.line([p(i,j,0),p(i,j,h)],'blue',1.5,{amp:.2});
    const [sx,sy]=p(i,j,h);
    if(on)pen.light([[sx-7,sy+5],[sx+7,sy+5],[sx+30,sy+h*TZ],[sx-30,sy+h*TZ]],.25*fl);
    pen.shape([[sx-8,sy+5],[sx+8,sy+5],[sx+4,sy-6],[sx-4,sy-6]],[o.ink||'teal',.8])};
  pen.plant=(i,j,z=0,o={})=>{const R=stream('plant',i,j),s=o.size||1,ink=o.ink||'teal',t=o.t||0;
    pen.box(i-.2*s,j-.2*s,z,.4*s,.4*s,.38*s,{ink:o.pot||'coral',tone:.55});
    const [x,y]=p(i,j,z+.38*s),n=o.leaves||8;
    for(let k=0;k<n;k++){const a=-Math.PI/2+rand(R,-1.2,1.2),len=rand(R,14,28)*s,sway=Math.sin(t*1.4+k)*1.2;
      pen.shape(pen.leaf([x,y],[x+Math.cos(a)*len+sway,y+Math.sin(a)*len],rand(R,3.5,6.5)*s),[ink,rand(R,.55,.95)],{w:.8})}};
  pen.books=(i,j,z,n,o={})=>{const R=stream('books',i,j);let zz=z;
    for(let k=0;k<n;k++){const th=rand(R,.08,.14),dx=rand(R,-.06,.06);
      pen.box(i+dx,j+dx*.5,zz,.5,.36,th,{ink:pick(R,['coral','teal','yellow','blue']),tone:rand(R,.4,.8),shadow:k===0,w:.8,top:0});zz+=th}};
  pen.steam=(x,y,t,o={})=>{for(let k=0;k<(o.n||2);k++){const P=[],ph=t*1.6+k*1.7;
    for(let s=0;s<=10;s++){const u=s/10;P.push([x+(k-.5)*4+Math.sin(ph*3+u*5)*2.5*u,y-u*(o.h||18)])}
    pen.line(P,o.ink||'blue',.8,{tone:.55*(1-((t*.8+k*.5)%1)*.5),amp:.2})}};
  pen.sparkle=(x,y,r,ink='yellow',t=0)=>{const a0=t*1.5,k=.6+.4*Math.sin(t*4+x);
    for(let q=0;q<4;q++){const a=a0+q*Math.PI/4,rr=r*k*(q%2?.55:1);pen.line([[x-Math.cos(a)*rr,y-Math.sin(a)*rr],[x+Math.cos(a)*rr,y+Math.sin(a)*rr]],ink,1.1,{amp:0})}};

  /* --- people --- */
  pen.person=(i,j,z=0,o={})=>{
    const t=o.t||0,s=o.scale||1,f=o.facing===-1?-1:1,pose=o.pose||'stand';
    const shirt=o.shirt||'teal',pants=o.pants||'blue',hair=o.hair||'blue',skin=o.skin||['coral',.22];
    const [bx,by]=p(i,j,z),ph=t*TAU*(o.speed||.5)+(o.phase||0);
    const X=v=>bx+v*s*f,Y=v=>by+v*s;
    if(!o.noShadow)pen.tint(pen.ellipse(i,j,z,.3,.3,14),'blue',.3);
    const sit=pose==='sit'||pose==='read',hip=sit?-14:-23,bob=Math.sin(ph*2)*.6,sh=hip-17+bob,lw=3.2*s;
    if(sit){for(const k of[-2.5,2.5])pen.line([[X(k-2),Y(hip)],[X(k+8),Y(hip+1)],[X(k+8),Y(-1)]],pants,lw,{amp:.15})}
    else{const sw=pose==='walk'?Math.sin(ph)*5:0;
      pen.line([[X(-2.5),Y(hip)],[X(-2.5+sw),Y(-1)]],pants,lw,{amp:.15});pen.line([[X(2.5),Y(hip)],[X(2.5-sw),Y(-1)]],pants,lw,{amp:.15})}
    const arm=(sx,hx,hy)=>pen.line([[X(sx),Y(sh+2.5)],[X((sx+hx)/2+(hx>sx?-1:1)),Y((sh+hy)/2+3)],[X(hx),Y(hy)]],shirt,2.6*s,{amp:.15,tone:.9});
    if(pose==='walk'){arm(-4,-4-Math.sin(ph)*5,hip-1)}
    pen.shape(smooth([[X(-6),Y(hip+1)],[X(6),Y(hip+1)],[X(5),Y(sh)],[X(-5),Y(sh)]],true,2),[shirt,.75],{w:1.1*s});
    if(pose==='read'){arm(-4,7,hip-5);arm(4,9,hip-6);
      pen.shape([[X(4),Y(hip-12)],[X(12),Y(hip-10)],[X(12),Y(hip-3)],[X(4),Y(hip-5)]],['paper',0],{w:.9})}
    else if(pose==='reach'){arm(-4,-6,hip);arm(4,13,sh-3+Math.sin(ph)*2)}
    else if(pose==='wave'){arm(-4,-6,hip);arm(4,10,sh-12+Math.sin(ph*3)*3)}
    else if(pose==='walk'){arm(4,4+Math.sin(ph)*5,hip-1)}
    else{arm(-4,-7,hip);arm(4,7,hip)}
    const hx=X(.5),hy=Y(sh-7),r=5.5*s,head=pen.circle(hx,hy,r,16);
    pen.fill(head,skin[0],skin[1]);
    const cap=[];for(let k=0;k<=10;k++){const a=Math.PI+k/10*Math.PI;cap.push([hx+Math.cos(a)*r*1.08-f*.8,hy+Math.sin(a)*r*1.1])}
    cap.push([hx-f*r*.9,hy+r*.7]);
    pen.tint(cap,hair,.9);pen.line(head,'blue',1,{closed:true,amp:.2});
    if(pose!=='read')pen.dot(hx+f*2.6*s,hy+.8,.8,'blue');
    return {head:[hx,hy],hand:[X(pose==='reach'?13:9),Y(pose==='reach'?sh-3:hip-6)]}};

  return pen;
}

/* =====================================================================
   RUNTIME — layout, camera, 12fps boil, input, export
   ===================================================================== */
const ROOMS=[];
function room(def){ROOMS.push({w:10,d:10,h:3,col:0,row:0,...def})}
const stage=document.getElementById('stage'),ctx=stage.getContext('2d',{alpha:false});
const qs=new URLSearchParams(location.search);
const FPS=12,BOIL_EVERY=4,GAP=2.5,MIN_Z=.15,MAX_Z=6;
let W=1,H=1,dpr=1,started=performance.now(),lastFrame=-1,lastCam='';
const cam={x:0,y:0,zoom:1};let vel={x:0,y:0},tween=null,idleSince=performance.now(),tourIndex=-1;

function layout(){
  const SLOT=Math.max(...ROOMS.map(r=>Math.max(r.w,r.d)))+GAP;   // grid pitch in tiles
  for(const r of ROOMS){r.oi=r.col*SLOT;r.oj=r.row*SLOT;[r.ox,r.oy]=iso(r.oi,r.oj);
    const pts=[];for(const a of[-.5,r.w+.3])for(const b of[-.5,r.d+.3])for(const z of[-1,r.h+.6])pts.push(iso(r.oi+a,r.oj+b,z));
    r.bounds=[Math.min(...pts.map(q=>q[0])),Math.min(...pts.map(q=>q[1])),Math.max(...pts.map(q=>q[0])),Math.max(...pts.map(q=>q[1]))];}
  ROOMS.sort((a,b)=>(a.oi+a.oj)-(b.oi+b.oj));
}
const framing=b=>({x:(b[0]+b[2])/2,y:(b[1]+b[3])/2,zoom:clamp(Math.min(W/(b[2]-b[0]),H/(b[3]-b[1]))*.92,MIN_Z,MAX_Z)});
function fitAll(){const b=ROOMS.reduce((a,r)=>[Math.min(a[0],r.bounds[0]),Math.min(a[1],r.bounds[1]),Math.max(a[2],r.bounds[2]),Math.max(a[3],r.bounds[3])],[1e9,1e9,-1e9,-1e9]);return framing(b)}
function flyTo(target,ms=1100){tween={from:{...cam},to:target,start:performance.now(),ms}}
const toWorld=(sx,sy)=>({x:(sx-W/2)/cam.zoom+cam.x,y:(sy-H/2)/cam.zoom+cam.y});
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(2,devicePixelRatio||1);stage.width=Math.round(W*dpr);stage.height=Math.round(H*dpr);lastCam=''}

function draw(frameNo){
  const t=frameNo/FPS,boil=Math.floor(frameNo/BOIL_EVERY),z=cam.zoom;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=PAPER_CSS;ctx.fillRect(0,0,stage.width,stage.height);
  ctx.setTransform(dpr*z,0,0,dpr*z,dpr*(W/2-cam.x*z),dpr*(H/2-cam.y*z));
  const a=toWorld(0,0),b=toWorld(W,H);
  for(const r of ROOMS){
    if(r.bounds[2]<a.x||r.bounds[0]>b.x||r.bounds[3]<a.y||r.bounds[1]>b.y)continue;
    const pen=makePen(ctx,{ox:r.ox,oy:r.oy,boil});
    try{if(r.shell!==false)pen.shell(r);r.draw&&r.draw(pen,t,stream(r.id))}catch(e){console.error('room '+r.id,e)}
    ctx.globalCompositeOperation='source-over';ctx.setLineDash([]);
  }
  ctx.globalCompositeOperation='multiply';ctx.fillStyle=grain(ctx);ctx.fillRect(a.x,a.y,b.x-a.x,b.y-a.y);ctx.globalCompositeOperation='source-over';
}

function frame(now){
  requestAnimationFrame(frame);
  if(innerWidth!==W||innerHeight!==H)resize();
  if(tween){const u=clamp((now-tween.start)/tween.ms,0,1),e=ease(u);
    cam.x=lerp(tween.from.x,tween.to.x,e);cam.y=lerp(tween.from.y,tween.to.y,e);cam.zoom=lerp(tween.from.zoom,tween.to.zoom,e)*(1-Math.sin(u*Math.PI)*.12);
    if(u>=1)tween=null}
  else if(!pointers.size){cam.x+=vel.x*16;cam.y+=vel.y*16;vel.x*=.92;vel.y*=.92}
  if(!qs.has('still')&&ROOMS.length>1&&now-idleSince>20000&&!tween){tourIndex=(tourIndex+1)%ROOMS.length;flyTo(framing(ROOMS[tourIndex].bounds),3200);idleSince=now-8000}
  const f=qs.has('frame')?+qs.get('frame'):Math.floor((now-started)/1000*FPS);
  const key=`${cam.x.toFixed(2)},${cam.y.toFixed(2)},${cam.zoom.toFixed(4)},${W},${H}`;
  if(f!==lastFrame||key!==lastCam){draw(f);lastFrame=f;lastCam=key}
}

const pointers=new Map();let drag=null,pinch=null;
const touch=()=>{idleSince=performance.now();tween=null};
stage.addEventListener('pointerdown',e=>{touch();stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});vel={x:0,y:0};
  drag={x:e.clientX,y:e.clientY,t:performance.now()};
  if(pointers.size===2){const [p1,p2]=[...pointers.values()];pinch={d:Math.hypot(p1.x-p2.x,p1.y-p2.y),zoom:cam.zoom,anchor:toWorld((p1.x+p2.x)/2,(p1.y+p2.y)/2)}}
  stage.classList.add('drag')});
stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;touch();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size>=2&&pinch){const [p1,p2]=[...pointers.values()],mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
    cam.zoom=clamp(pinch.zoom*Math.hypot(p1.x-p2.x,p1.y-p2.y)/Math.max(1,pinch.d),MIN_Z,MAX_Z);cam.x=pinch.anchor.x-(mx-W/2)/cam.zoom;cam.y=pinch.anchor.y-(my-H/2)/cam.zoom;return}
  if(!drag)return;const now=performance.now(),dx=e.clientX-drag.x,dy=e.clientY-drag.y,dt=Math.max(8,now-drag.t);
  cam.x-=dx/cam.zoom;cam.y-=dy/cam.zoom;vel={x:lerp(vel.x,-dx/cam.zoom/dt,.6),y:lerp(vel.y,-dy/cam.zoom/dt,.6)};drag={x:e.clientX,y:e.clientY,t:now}});
const up=e=>{pointers.delete(e.pointerId);pinch=null;if(pointers.size)return;if(!drag||performance.now()-drag.t>90)vel={x:0,y:0};drag=null;stage.classList.remove('drag')};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();touch();vel={x:0,y:0};const a=toWorld(e.clientX,e.clientY);
  cam.zoom=clamp(cam.zoom*Math.exp(-clamp(e.deltaY,-300,300)*.0015),MIN_Z,MAX_Z);cam.x=a.x-(e.clientX-W/2)/cam.zoom;cam.y=a.y-(e.clientY-H/2)/cam.zoom},{passive:false});
stage.addEventListener('dblclick',e=>{const w=toWorld(e.clientX,e.clientY),r=ROOMS.find(r=>w.x>=r.bounds[0]&&w.x<=r.bounds[2]&&w.y>=r.bounds[1]&&w.y<=r.bounds[3]);
  if(r){touch();tourIndex=ROOMS.indexOf(r);flyTo(framing(r.bounds))}});
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toLowerCase(),step=120/cam.zoom;touch();
  if(k==='arrowleft'||k==='a')cam.x-=step;else if(k==='arrowright'||k==='d')cam.x+=step;
  else if(k==='arrowup'||k==='w')cam.y-=step;else if(k==='arrowdown'||k==='s')cam.y+=step;
  else if(k==='+'||k==='=')cam.zoom=clamp(cam.zoom*1.2,MIN_Z,MAX_Z);else if(k==='-')cam.zoom=clamp(cam.zoom/1.2,MIN_Z,MAX_Z);
  else if(k==='0')flyTo(fitAll(),900);
  else if(k==='p')stage.toBlob(b=>{const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=(document.title||'print')+'.png';l.click()});
  else return;e.preventDefault()});

function start(){
  layout();resize();
  const r=ROOMS.find(r=>r.id===qs.get('room'));
  Object.assign(cam,r?framing(r.bounds):fitAll());
  if(qs.has('zoom'))cam.zoom=+qs.get('zoom');
  requestAnimationFrame(frame);
}

/* =====================================================================
   SCENE — a late-night listening room
   ===================================================================== */
room({id:'listening',col:0,row:0,w:7,d:7,h:3.2,
  style:{floor:['coral',.55],wall:['blue',.55],wall2:['blue',.7],plank:.7},
  draw(pen,t,R){
    const p=pen.p;
    const onJ=(u,z)=>p(.02,u,z), onI=(u,z)=>p(u,.02,z);
    const wallDisc=(on,cu,cz,r,n=22)=>Array.from({length:n},(_,k)=>{const a=k/n*TAU;return on(cu+Math.cos(a)*r,cz+Math.sin(a)*r*1.1)});

    // ---- back-left wall: night window, moon, stars, poster
    pen.window('j',.7,1.1,2.3,1.5,{sky:'blue',patch:false});
    pen.fill(wallDisc(onJ,2.45,2.25,.18),'yellow',.6);
    for(let k=0;k<9;k++){const u=rand(R,.85,2.85),z=rand(R,1.8,2.5),tw=.5+.5*Math.sin(t*3+k*2);
      pen.dot(...onJ(u,z),.7+tw*.8,'yellow',.9)}
    {const q=pen.wallQuad('j',3.7,1.2,1.5,1.2);pen.shape(q,['coral',.8],{w:1.3});
      pen.shape(wallDisc(onJ,4.45,1.8,.42),['blue',.95],{w:.8});pen.fill(wallDisc(onJ,4.45,1.8,.12,12),'yellow',.9);
      pen.line([onJ(3.85,1.32),onJ(5.05,1.32)],'paper',1.4,{amp:.2})}

    // ---- back-right wall: record shelves, poster
    pen.bookcase('i',.4,2.7,2.3,{rows:4,ink:'coral'});
    {const q=pen.wallQuad('i',3.6,1.3,1.3,1.4);pen.shape(q,['yellow',.75],{w:1.3});
      pen.shape([onI(3.7,1.45),onI(4.1,2.2),onI(4.35,1.8),onI(4.55,2.4),onI(4.8,1.45)],['teal',.85],{w:.9});
      pen.dot(...onI(4.5,2.5),4,'coral')}

    // ---- string lights along the top of both walls
    const bulbs=[];
    for(let k=0;k<=14;k++){const u=k/14*6.8,sag=Math.abs(Math.sin(u/6.8*Math.PI*3))*.25;bulbs.push(onI(u,2.95-sag))}
    for(let k=1;k<=14;k++){const u=k/14*6.8,sag=Math.abs(Math.sin(u/6.8*Math.PI*3))*.25;bulbs.unshift(onJ(u,2.95-sag))}
    pen.line(bulbs,'blue',.8,{amp:.3});
    bulbs.forEach(([x,y],k)=>{const on=.55+.45*Math.sin(t*2.2+k*1.3);
      pen.knock(pen.circle(x,y+4,7,12),.25*on);pen.tint(pen.circle(x,y+4,5,12),'yellow',.25*on);
      pen.shape(pen.circle(x,y+3,2.2,8),['yellow',.95],{w:.6})});

    // ---- flat floor things
    pen.shape(pen.ellipse(3.9,3.9,.01,2,1.7,36),['yellow',.45],{w:1.2});
    pen.line(pen.ellipse(3.9,3.9,.01,1.6,1.35,36),'coral',1,{closed:true,tone:.8});
    pen.line(pen.ellipse(3.9,3.9,.01,1.2,1,30),'teal',.9,{closed:true,tone:.7});

    // ---- standing things, back to front (i+j)
    pen.lamp(.7,4.4,{t,h:1.9,ink:'coral'});
    const speaker=(i,j,h)=>{const b=pen.box(i,j,0,.6,.5,h,{ink:'teal',tone:.7});
      for(const [cz,r] of[[h*.7,.13],[h*.33,.2]]){const ring=Array.from({length:18},(_,k)=>{const a=k/18*TAU;return p(i+.3+Math.cos(a)*r,j+.5,cz+Math.sin(a)*r*1.1)});
        pen.shape(ring,['blue',.95],{w:.8});const pulse=1+.25*Math.max(0,Math.sin(t*TAU*1.6));
        pen.fill(Array.from({length:12},(_,k)=>{const a=k/12*TAU;return p(i+.3+Math.cos(a)*r*.35*pulse,j+.5,cz+Math.sin(a)*r*.38*pulse)}),'coral',.8)}};
    speaker(4.3,.55,1.15);
    // turntable on a low table
    pen.table(1.9,2,1.9,1.1,.7,{ink:'yellow',tone:.65});
    pen.box(2.1,2.15,.7,1.3,.8,.14,{ink:'blue',tone:.75,shadow:false});
    {const ci=2.7,cj=2.55,z=.85,spin=t*TAU*.55;
      pen.shape(pen.ellipse(ci,cj,z,.36,.36,26),['blue',1],{w:.8});
      pen.line(pen.ellipse(ci,cj,z,.26,.26,22),'paper',.4,{closed:true,tone:.6,amp:0});
      pen.fill(pen.ellipse(ci,cj,z,.1,.1,12),'coral',.9);
      pen.line([p(ci+Math.cos(spin)*.12,cj+Math.sin(spin)*.12,z),p(ci+Math.cos(spin)*.32,cj+Math.sin(spin)*.32,z)],'paper',1,{amp:0});
      pen.line([p(3.3,2.25,z),p(3.3,2.3,z+.25),p(2.95,2.75,z+.05)],'paper',1.3,{amp:.1});
      pen.dot(...p(3.3,2.25,z+.02),2,'coral');
      // notes floating up
      for(let k=0;k<3;k++){const u=(t*.35+k/3)%1,[x,y]=p(ci,cj,z+.3+u*1.8),dx=Math.sin(u*6+k)*10+k*8-8,tone=u<.8?1:(1-u)*5;
        pen.dot(x+dx,y,2.6,'coral',tone);pen.line([[x+dx+2.3,y],[x+dx+2.3,y-9],[x+dx+6,y-7]],'coral',1,{amp:0,tone})}}
    // beanbag + listener
    pen.shape(pen.blob(...p(5.5,3.2,.3),22,14,'bean',.12),['coral',.75],{w:1.2});
    pen.person(5.3,3.1,0,{pose:'read',t,shirt:'teal',hair:'coral',noShadow:true});
    speaker(6.1,2.7,1);
    pen.plant(6.4,.8,0,{t,size:1.5,pot:'yellow'});
    // dancer
    pen.person(3.9,4.6,0,{pose:'wave',t,speed:.8,shirt:'yellow',pants:'blue',hair:'blue',scale:1.05});
    // record crate
    pen.box(.9,5.6,0,1,.7,.5,{ink:'yellow',tone:.6});
    for(let k=0;k<6;k++){const a=.12+k*.14;pen.shape([p(.95+a,5.7,.45),p(.95+a,6.2,.45),p(.95+a+.03,6.2,.9),p(.95+a+.03,5.7,.9)],[pick(R,['coral','teal','blue']),rand(R,.6,.95)],{w:.6})}
    // cat curled on the rug
    {const [x,y]=p(2.6,5.4,0);pen.tint(pen.ellipse(2.6,5.4,0,.35,.3),'blue',.3);
      pen.shape(pen.blob(x,y-6,15,8,'cat',.08),['blue',.9],{w:1});
      pen.shape([[x+8,y-11],[x+11,y-19],[x+14,y-11]],['blue',.9],{w:.9});pen.shape([[x+14,y-11],[x+17,y-18],[x+19,y-9]],['blue',.9],{w:.9});
      pen.line([[x-14,y-4],[x-20,y-8+Math.sin(t*2)*3],[x-18,y-14+Math.sin(t*2)*3]],'blue',2.2,{amp:.2});
      pen.dot(x+15,y-10,1,'yellow')}
    // loose records
    for(const [i,j] of[[5.3,6.1],[6,5.5]]){pen.shape(pen.ellipse(i,j,.01,.38,.38,22),['blue',1],{w:.8});pen.fill(pen.ellipse(i,j,.01,.12,.12,12),'yellow',.9)}
    // floor cushion with tea, tall plant in the corner
    pen.box(4.2,5.9,0,.8,.8,.18,{ink:'teal',tone:.6});
    {const [x,y]=p(4.6,6.3,.18);pen.shape(smooth([[x-4,y],[x+4,y],[x+4,y-8],[x-4,y-8]],true,1),['paper',0],{w:.9});pen.steam(x,y-10,t)}
    pen.plant(.5,6.5,0,{t,size:1.8,leaves:11,pot:'coral'});
    pen.sparkle(...p(.7,4.4,2.3),5,'yellow',t);
  }});

start();
</script>
