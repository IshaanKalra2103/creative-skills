<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EDIT Title No. 1 — Interactive Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@500;700&display=block" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23e0202a%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="engine/style.css">
<script type="importmap">{"imports":{
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
}}</script>
</head>
<body>
<main class="stage">
  <div class="cover-wrap"><div class="cover" id="cover"></div></div>
</main>
<script>
// Everything about this cover lives here; engine/ is shared and should not be edited per cover.
// Coordinates are MODEL space (what engine/probe.html reports), metres, y up. See references/config.md.
window.COVER = {
  model: 'assets/model.glb',
  hero: {
    name: 'EDIT the hero',                 // used in the hint line ("click the hero")
    scale: 1, position: [0, 0, 0], rotation: [0, 0, 0],   // placement in the set (degrees)
    emitter: null,                         // EDIT [x,y,z] where powers fire from (a raised hand); or emitterBone: 'mixamorigRightHand'
    head: null,                            // EDIT [x,y,z] head centre, for the sense squiggles; or headBone
    pose: null,                            // rigged model: {clip: 'Punch', time: 0.4} freezes a frame; play: true animates on twos
    decals: [],                            // [{kind: 'glow'|'walk-signal', center, normal, size: [w,h], color}]
    hotspots: [],                          // [{box: [[min],[max]], match: 'unsaturated'|'all', action: 'walk'|'sense'|'sfx'|'power', words, label}]
    words: ['POW!'],                       // SFX when the hero is clicked and there's no sense mode
  },
  camera: {az: -0.5, el: -0.35, roll: -0.2, fov: 37},   // dist/target omitted = auto-fit; tune after the first screenshot
  set: {kind: 'city', sky: 'storm', ground: -6.5},      // 'city' | 'sky' | 'burst' (+ burst: {colors: [a, b], rays: 28})
  power: {kind: 'beam', words: ['ZZZAK!', 'KZZT!'], sound: 'zap', color: '#7fe8ff'},  // 'web' | 'beam' | 'none'
  sense: {label: 'Hero-sense', key: 'S', duotone: ['#0d0008', '#f2142e']},          // or null
  masthead: {
    title: 'EDIT TITLE',
    kicker: 'EDIT KICKER LINE',
    credits: 'INKS BY SOBEL · COLORS BY WEBGL · SCULPT BY EDIT',
    pattern: 'halftone',                   // 'web' | 'halftone' | 'stripes' | 'none'
    face: ['#ff4a3d', '#e0202a', '#9e0f1d'], extrude: '#1c2a6b',
  },
  dress: {issue: '1', month: 'SEPT', price: '$3.99', caption: ['EDIT CAPTION', 'LINE TWO!']},
};
</script>
<script type="module" src="engine/main.js"></script>
</body>
</html>
