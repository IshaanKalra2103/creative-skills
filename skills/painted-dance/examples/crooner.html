<canvas id="c"></canvas>
<script>
'use strict';
/* ============================================================
   PAINTED RICKROLL — a one-minute brush-stroke dance film.
   Everything (paint, figure, lights, score) is generated in code.
   ============================================================ */

// ---------- timing ----------
const params = new URLSearchParams(location.search);
// ?bpm= and ?offset= line the choreography up with a track you supply yourself (see USER TRACK below).
const BPM = +params.get('bpm') || 112, OFFSET = +params.get('offset') || 0, BEAT = 60 / BPM, BAR = BEAT * 4, BARS = 28, DUR = BARS * BAR; // 60.0 s at 112 BPM
const W = 1920, H = 1080, FLOOR = 800, GROUND = 950, REST = 604;
const TAIL = 1.8; // seconds of hold after the music

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const lerp2 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeInOut = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOutBack = t => { const c = 2.2; t = clamp(t) - 1; return 1 + (c + 1) * t * t * t + c * t * t; };
const add = (a, v, s = 1) => [a[0] + v[0] * s, a[1] + v[1] * s];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const unit = v => { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; };
const perp = v => [-v[1], v[0]];
function hash(a, b) {
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(seed, x) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return lerp(hash(seed, i), hash(seed, i + 1), u) * 2 - 1;
}
function rng(s) {
  return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const sw = x => { const s = Math.sin(x); return Math.sign(s) * Math.pow(Math.abs(s), .65); }; // snappy sway
const dip = b => { const c = Math.cos(Math.PI * b); return Math.pow(c * c, 2); };          // 1 on every beat

// ---------- colour ----------
const _rgb = new Map(), _sh = new Map();
function hexRgb(h) { let v = _rgb.get(h); if (!v) { const n = parseInt(h.slice(1), 16); v = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; _rgb.set(h, v); } return v; }
function shade(hex, a) {
  const k = hex + a; let v = _sh.get(k); if (v) return v;
  const c = hexRgb(hex), t = a > 0 ? 255 : 0, f = Math.abs(a);
  v = `rgb(${Math.round(c[0] + (t - c[0]) * f)},${Math.round(c[1] + (t - c[1]) * f)},${Math.round(c[2] + (t - c[2]) * f)})`;
  _sh.set(k, v); return v;
}

// ============================================================
//  BRUSH ENGINE
// ============================================================
let BOIL = 0;          // 12 Hz drawing index: marks re-draw on twos
let FLAT = null;       // when set, everything is drawn flat in this colour (shadows)
let OPS = 0, REVEAL = Infinity; // paint-in counter for the intro

function nextReveal() { const k = OPS++; return clamp(REVEAL - k); }

function spline(pts, step) {
  if (pts.length < 2) return pts.slice();
  const out = [], P = [pts[0], ...pts, pts[pts.length - 1]];
  for (let i = 1; i < P.length - 2; i++) {
    const p0 = P[i - 1], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2];
    const n = Math.max(1, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / step));
    for (let j = 0; j < n; j++) {
      const t = j / n, t2 = t * t, t3 = t2 * t;
      out.push([
        .5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        .5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]);
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}

/* A loaded brush: tapered ribbon + bristle streaks + dry-brush gaps.
   o: w, color, seed, tin, tout, jit, wob, bristles, dry, alpha, reveal, still, fig, flat, hi, lo, step */
function brush(g, pts, o) {
  let rev = o.reveal == null ? 1 : o.reveal;
  if (o.fig) rev *= nextReveal();
  if (rev <= .001) return;
  const S = spline(pts, o.step || 7), n = S.length; if (n < 2) return;
  const L = new Float32Array(n);
  for (let i = 1; i < n; i++) L[i] = L[i - 1] + Math.hypot(S[i][0] - S[i - 1][0], S[i][1] - S[i - 1][1]);
  const tot = L[n - 1]; if (tot < .5) return;
  const seed = o.seed | 0, bs = o.still ? seed : seed + BOIL * 131, w = o.w;
  const jit = o.jit == null ? 1.2 : o.jit, wob = o.wob == null ? .2 : o.wob;
  const tin = o.tin == null ? .1 : o.tin, tout = o.tout == null ? .35 : o.tout, lim = rev * tot;
  const X = [], Y = [], NX = [], NY = [], WD = [], U = [];
  let m = 0;
  for (let i = 0; i < n; i++) {
    let px, py, u;
    if (L[i] <= lim) { px = S[i][0]; py = S[i][1]; u = L[i]; }
    else { const f = (lim - L[i - 1]) / (L[i] - L[i - 1] || 1); px = lerp(S[i - 1][0], S[i][0], f); py = lerp(S[i - 1][1], S[i][1], f); u = lim; }
    X[m] = px; Y[m] = py; U[m] = u; m++;
    if (L[i] > lim) break;
  }
  if (m < 2) return;
  for (let i = 0; i < m; i++) {
    const a = Math.min(i + 1, m - 1), c = Math.max(i - 1, 0);
    let tx = X[a] - X[c], ty = Y[a] - Y[c]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    const u = U[i] / tot;
    const ta = tin > 0 ? Math.min(1, u / tin) : 1, tz = tout > 0 ? Math.min(1, (1 - u) / tout) : 1;
    const taper = Math.pow(ta, .55) * Math.pow(Math.max(tz, 0), .7);
    const wd = w * (.12 + .88 * taper) * (1 + wob * vnoise(bs, U[i] / 55));
    const j = jit * vnoise(bs + 17, U[i] / 45);
    NX[i] = -ty; NY[i] = tx; X[i] += NX[i] * j; Y[i] += NY[i] * j; WD[i] = Math.max(.4, wd / 2);
  }
  const alpha = FLAT ? 1 : (o.alpha == null ? 1 : o.alpha);
  g.globalAlpha = alpha; g.fillStyle = FLAT || o.fill || o.color;
  g.beginPath(); g.moveTo(X[0] + NX[0] * WD[0], Y[0] + NY[0] * WD[0]);
  for (let i = 1; i < m; i++) g.lineTo(X[i] + NX[i] * WD[i], Y[i] + NY[i] * WD[i]);
  for (let i = m - 1; i >= 0; i--) g.lineTo(X[i] - NX[i] * WD[i], Y[i] - NY[i] * WD[i]);
  g.closePath(); g.fill();
  if (FLAT || o.flat) { g.globalAlpha = 1; return; }
  const nb = o.bristles == null ? Math.max(2, Math.min(12, Math.round(w / 7))) : o.bristles;
  const hi = shade(o.color, o.hi == null ? .22 : o.hi), lo = shade(o.color, -(o.lo == null ? .25 : o.lo));
  const dry = o.dry == null ? .35 : o.dry;
  for (let k = 0; k < nb; k++) {
    const r1 = hash(seed, k * 3 + 1), r2 = hash(seed, k * 3 + 2), r3 = hash(seed, k * 3 + 3);
    const off = (r1 * 2 - 1) * .85;
    g.strokeStyle = r2 < .5 ? hi : lo;
    g.lineWidth = Math.max(.7, w * (.03 + .07 * r3));
    g.globalAlpha = alpha * (.3 + .4 * r2);
    const u0 = r3 * .12 * tot, u1 = tot * (.72 + .28 * r1);
    g.beginPath(); let pen = false;
    for (let i = 0; i < m; i++) {
      if (U[i] < u0 || U[i] > u1) { pen = false; continue; }
      const th = 1 - 2 * dry * (.3 + U[i] / tot);
      if (vnoise(seed + k * 7, U[i] / 25) > th) { pen = false; continue; }
      const x = X[i] + NX[i] * WD[i] * off, y = Y[i] + NY[i] * WD[i] * off;
      if (!pen) { g.moveTo(x, y); pen = true; } else g.lineTo(x, y);
    }
    g.stroke();
  }
  g.globalAlpha = 1;
}

/* A painted area: rough-cut polygon + clipped brush texture following o.texAng. */
function blob(g, poly, o) {
  let rev = 1;
  if (o.fig) rev = nextReveal();
  if (rev <= .001) return;
  const bs = o.still ? o.seed : o.seed + BOIL * 131, r = o.rough == null ? 3 : o.rough;
  g.beginPath();
  let first = true, x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let e = 0; e < poly.length; e++) {
    const a = poly[e], b = poly[(e + 1) % poly.length];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, ns = Math.max(1, Math.ceil(len / 28));
    const nx = -(b[1] - a[1]) / len, ny = (b[0] - a[0]) / len;
    for (let j = 0; j < ns; j++) {
      const t = j / ns, d = r * vnoise(bs + e * 31, j * .9);
      const x = lerp(a[0], b[0], t) + nx * d, y = lerp(a[1], b[1], t) + ny * d;
      if (first) { g.moveTo(x, y); first = false; } else g.lineTo(x, y);
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  g.closePath();
  g.globalAlpha = (FLAT ? 1 : (o.alpha == null ? 1 : o.alpha)) * rev;
  g.fillStyle = FLAT || o.color; g.fill();
  if (FLAT || !o.tex) { g.globalAlpha = 1; return; }
  g.save(); g.clip();
  const ang = o.texAng == null ? Math.PI / 2 : o.texAng, d = [Math.cos(ang), Math.sin(ang)], p = perp(d);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, R = Math.hypot(x1 - x0, y1 - y0) / 2 + 10;
  const span = Math.abs(p[0]) * (x1 - x0) + Math.abs(p[1]) * (y1 - y0);
  for (let k = 0; k < o.tex; k++) {
    const f = (k + .5) / o.tex - .5, jo = vnoise(bs + 900 + k, 0) * 6;
    const c = [cx + p[0] * (f * span + jo), cy + p[1] * (f * span + jo)];
    brush(g, [add(c, d, -R), add(add(c, d, 0), p, 8 * vnoise(o.seed + k, 3)), add(c, d, R)],
      { w: span / o.tex * 1.1, color: o.color, fill: k % 2 ? shade(o.color, .1) : shade(o.color, -.08), hi: .16, lo: .16,
        seed: o.seed * 7 + k, alpha: .45 * rev, tin: .05, tout: .1, still: o.still, bristles: 6, dry: .5 });
  }
  g.restore(); g.globalAlpha = 1;
}
function ink(g, pts, w, seed, extra) {
  brush(g, pts, Object.assign({ w, color: COL.ink, seed, tin: .15, tout: .4, bristles: 2, dry: .55, jit: 1, fig: 1, wob: .35 }, extra || {}));
}
function circlePts(c, rx, ry, n = 14, rot = 0) {
  const out = [];
  for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2 + rot; out.push([c[0] + Math.cos(a) * rx, c[1] + Math.sin(a) * ry]); }
  return out;
}

// ============================================================
//  PALETTES / SECTIONS
// ============================================================
const COL = {
  coat: '#c9a066', coatD: '#9c7443', coatL: '#e4c690', lining: '#6e4b2c', belt: '#a47744',
  trou: '#2b2833', shoe: '#131118', shirt: '#1e1b27', skin: '#f1c3a0', skinD: '#d58f74',
  hair: '#c7521f', hairL: '#f2964c', hairD: '#7e2e0e', ink: '#1c1326', mic: '#24212c', grille: '#d5d8e0', lip: '#5b1622'
};
const SECT = [
  { b: 0,  ground: '#1b1733', floor: '#110e22', pal: ['#ff4f8b', '#f39a3d', '#7b5cff'], light: 320, sh: ['#3a1c6e', '#0d4b5a'] },
  { b: 16, ground: '#f1e6d0', floor: '#d9c6a3', pal: ['#ef5b44', '#2a9d8f', '#f2b134', '#2b3f86', '#e98aa6'], light: 520, sh: ['#4a2a86', '#136b6b'] },
  { b: 48, ground: '#f7a23e', floor: '#d9772a', pal: ['#7b2d8e', '#e8467c', '#fff1c9', '#1f2a6b'], light: 620, sh: ['#5a1c78', '#1f2a6b'] },
  { b: 64, ground: '#ff4f8b', floor: '#c3326a', pal: ['#1f3cff', '#ffe14d', '#35e0b0', '#7b2dd6', '#ffffff'], light: 820, sh: ['#2a1a8a', '#6b0f4a'] },
  { b: 96, ground: '#2433a0', floor: '#151c63', pal: ['#ff4f8b', '#ffe14d', '#35e0b0', '#ffffff'], light: 820, sh: ['#0b0f3a', '#3b0a3e'] },
];
const secIdx = b => { let i = SECT.length - 1; while (i > 0 && b < SECT[i].b) i--; return i; };

// ============================================================
//  MUSIC DATA (shared by the synth and the lip-sync)
// ============================================================
const CHORD = { Dm: [62, 65, 69], Bb: [58, 62, 65], F: [60, 65, 69], C: [60, 64, 67], Gm: [58, 62, 67], Am: [60, 64, 69] };
const ROOT = { Dm: 38, Bb: 34, F: 29, C: 36, Gm: 31, Am: 33 };
const PROG = ['Dm','Bb','F','C', 'Dm','Bb','F','C', 'Dm','Bb','F','C', 'Gm','Am','Bb','C',
              'F','C','Dm','Bb', 'F','C','Dm','Bb', 'Bb','C','Dm','F'];
const MEL = {
  V: [[[.5,69,.5],[1,72,.5],[1.5,74,1],[2.5,72,.5],[3,74,.5],[3.5,76,.5]],
      [[.5,74,.5],[1,72,.5],[1.5,70,.5],[2,69,1.5]],
      [[.5,69,.5],[1,72,.5],[1.5,77,1],[2.5,76,.5],[3,74,.5],[3.5,72,.5]]],
  V1end: [[.5,74,.5],[1,72,.5],[1.5,67,.5],[2,67,1.5]],
  V2end: [[.5,74,.5],[1,76,.5],[1.5,77,.5],[2,76,1.5]],
  PRE: [[[0,70,1],[1,70,.5],[1.5,72,.5],[2,74,1.5]],
        [[0,72,1],[1,72,.5],[1.5,74,.5],[2,76,1.5]],
        [[0,74,1],[1,74,.5],[1.5,76,.5],[2,77,1.5]],
        [[0,79,.5],[.5,77,.5],[1,76,.5],[1.5,74,.5],[2,76,1.3]]],
  CH: [[[0,72,.5],[.5,77,.5],[1,77,.5],[1.5,76,.5],[2,77,1],[3,79,.5],[3.5,77,.5]],
       [[0,76,.5],[.5,72,1],[1.5,72,.5],[2,74,.5],[2.5,76,1.5]],
       [[0,74,.5],[.5,77,.5],[1,77,.5],[1.5,76,.5],[2,77,1],[3,81,.5],[3.5,79,.5]]],
  C1end: [[0,77,.5],[.5,74,1],[1.5,72,.5],[2,74,.5],[2.5,77,1.5]],
  C2end: [[0,77,.5],[.5,79,.5],[1,81,1],[2,79,.5],[2.5,77,.9]],
  TAG: [[[0,77,.5],[.5,76,.5],[1,74,.5],[1.5,72,1],[2.5,74,.5],[3,72,1]],
        [[0,70,.5],[.5,72,.5],[1,74,.5],[1.5,76,.5],[2,79,2]]],
  STOP: [[0,74,.6],[1.5,74,.6],[3,76,.8]],
  END: [[0,77,2.2]],
};
const LEAD = (() => {
  const out = [], put = (bar, notes) => notes.forEach(([bt, m, d]) => out.push({ t: (bar * 4 + bt) * BEAT, d: d * BEAT, m }));
  [0, 1, 2].forEach(i => { put(4 + i, MEL.V[i]); put(8 + i, MEL.V[i]); });
  put(7, MEL.V1end); put(11, MEL.V2end);
  MEL.PRE.forEach((n, i) => put(12 + i, n));
  [0, 1, 2].forEach(i => { put(16 + i, MEL.CH[i]); put(20 + i, MEL.CH[i]); });
  put(19, MEL.C1end); put(23, MEL.C2end);
  put(24, MEL.TAG[0]); put(25, MEL.TAG[1]); put(26, MEL.STOP); put(27, MEL.END);
  return out.sort((a, b) => a.t - b.t);
})();
function singAt(t) {
  let v = 0;
  for (const n of LEAD) {
    if (t < n.t - .02) break;
    const u = t - n.t;
    if (u < n.d + .07) {
      const e = u < n.d ? .5 + .5 * Math.exp(-u * 7) + .06 * Math.sin(u * 34) : Math.max(0, 1 - (u - n.d) / .07) * .5;
      v = Math.max(v, e);
    }
  }
  return v;
}

// ============================================================
//  CHOREOGRAPHY — every move is a pure function of beat time
// ============================================================
const DEF = { hx: 960, hy: REST, lean: 0, tilt: 0, head: 0, nod: 0, hA: [40, 180], hB: [-40, 180],
  fL: [-66, 0], fR: [66, 0], micMouth: 0, spin: 1, flare: 0, wink: 0, pointB: 0 };
const P = o => Object.assign({}, DEF, o);
function lerpPose(a, b, t) {
  const o = {};
  for (const k in b) { const x = a[k], y = b[k]; o[k] = Array.isArray(y) ? lerp2(x, y, t) : lerp(x, y, t); }
  return o;
}

// intro: nodding, finger snaps on 2 & 4 while he is painted in
function idle(b) {
  const s = sw(Math.PI * b) * .35, d = dip(b), snap = Math.exp(-(((b + 1) % 2 + 2) % 2) * 6);
  return P({ hx: 960 + 14 * s, hy: REST + 10 * d, lean: -.03 * s, tilt: .04 * s, head: .07 * Math.sin(Math.PI * (b - .2)),
    nod: 8 * dip(b - .12), hA: [34, 190], hB: [-50 + 14 * snap, 150 - 46 * snap] });
}
// verse: the sway — weight to one hip per beat, forearms pumping in counterpoint
function groove(b) {
  const s = sw(Math.PI * b), d = dip(b), p = Math.sin(Math.PI * b);
  return P({ hx: 960 + 42 * s, hy: REST + 26 * d, lean: -.06 * s, tilt: .08 * s, head: .1 * Math.sin(Math.PI * (b - .22)),
    nod: 10 * dip(b - .12), hA: [78 - 26 * s, 150 - 58 * p], hB: [-78 - 26 * s, 150 + 58 * p],
    fL: [-68 + 16 * Math.max(0, s), 18 * Math.max(0, s) ** 2], fR: [68 - 16 * Math.max(0, -s), 18 * Math.max(0, -s) ** 2] });
}
// pre-chorus: mic to the mouth, free arm points out on 1 and 3
function pointer(b) {
  const s = sw(Math.PI * b) * .7, d = dip(b);
  const q = (((b % 2) + 2) % 2) / 2, e = smooth(q / .12) * (1 - smooth((q - .55) / .4));
  return P({ hx: 960 + 30 * s, hy: REST + 28 * d, lean: .1 * e - .04 * s, tilt: .06 * s, head: -.06 + .12 * e,
    nod: 10 * dip(b - .1), hA: [70, 120], micMouth: 1, hB: lerp2([-70, 150], [215, -70], e), pointB: e,
    fL: [-68 + 12 * Math.max(0, s), 14 * Math.max(0, s) ** 2], fR: [68 - 12 * Math.max(0, -s), 14 * Math.max(0, -s) ** 2] });
}
// chorus: the big one — hips side to side, both arms swinging against them
function astley(b) {
  const s = sw(Math.PI * b), d = dip(b), rel = b - 64, ph = Math.floor(rel / 8) % 2, w8 = ((rel % 8) + 8) % 8;
  const sx = -100 * s, sy = -30 * Math.abs(s);
  const mm = ph === 0 ? smooth(w8 / .5) * (1 - smooth((w8 - 7.3) / .6)) : 0;
  return P({ hx: 960 + 60 * s, hy: REST + 32 * d, lean: -.08 * s, tilt: .1 * s, head: .13 * Math.sin(Math.PI * (b - .25)),
    nod: 13 * dip(b - .1), hA: [70 + sx, 140 + sy], hB: [-70 + sx, 140 + sy], micMouth: mm,
    fL: [-72 + 24 * Math.max(0, s), 26 * Math.max(0, s) ** 2], fR: [72 - 24 * Math.max(0, -s), 26 * Math.max(0, -s) ** 2] });
}
// finale: three stop-hits, then the wink
const FIN = [
  { t: 0,   hx: 1010, hy: REST + 14, lean: -.14, tilt: .12, head: -.15, hA: [40, 180], hB: [70, -215], fL: [-95, 0], fR: [70, 20], pointB: 1 },
  { t: 1.5, hx: 960,  hy: REST + 30, lean: 0,    tilt: 0,   head: .05,  hA: [-215, -50], hB: [215, -50], fL: [-120, 0], fR: [120, 0] },
  { t: 3,   hx: 935,  hy: REST + 8,  lean: .07,  tilt: -.08, head: .1,  hA: [70, 120], micMouth: 1, hB: [-30, 205], fL: [-70, 0], fR: [100, 8] },
];
function finale(b) {

// The mic cable is a whip: each point sits where the mic end *was* a moment ago.

}

const cv = document.getElementById('c'), ctx = cv.getContext('2d');

function render(t) {

    const voices = [['sawtooth', 1, 0, 1], ['square', 1, 7, .7]]; if (bright) voices.push(['sawtooth', 2, -5, .35]);
    voices.forEach(([ty, mul, dt, lv]) => { const o = osc(ty, f * mul, t, end); o.detune.value = dt; lg.connect(o.detune); const og = gain(lv); o.connect(og); og.connect(lp); });
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .025); g.gain.linearRampToValueAtTime(v * .8, t + .2);
    g.gain.setValueAtTime(v * .8, Math.max(t + .21, t + d - .03)); g.gain.linearRampToValueAtTime(0, t + d + .07);
    lp.connect(pk); pk.connect(g); g.connect(music); send(g, dlIn, .35); send(g, revIn, .25);
  }

  for (let bar = b0; bar < b1; bar++) {
    const T0 = bar * BAR - OFF, c = PROG[bar], notes = CHORD[c], r = ROOT[c], B = i => T0 + i * BEAT;
    const chorus = bar >= 16 && bar < 26, pre = bar >= 12 && bar < 16;
    if (bar < 26) {
      if (bar >= 1) for (let i = 0; i < 4; i++) kick(B(i), bar < 2 ? .8 : 1);
      if (bar >= 2) { snare(B(1)); snare(B(3)); }
      if (bar >= 12) { clap(B(1)); clap(B(3)); }
      for (let i = 0; i < 8; i++) { if (i % 2) hat(B(i * .5), bar < 2 ? .1 + bar * .06 : .26, chorus); else if (bar >= 4) hat(B(i * .5), .1, false); }
      if (pre || chorus) for (let i = 0; i < 16; i++) if (i % 4 === 1 || i % 4 === 3) hat(B(i * .25), .07, false);
      if (bar >= 1) for (let i = 0; i < 8; i++) bass(B(i * .5), i % 2 ? r + 12 : r, BEAT * .42, bar === 1 ? .3 : .42);
      if (bar >= 2) (pre ? [0, 1, 2, 3] : [0, 1.5, 2.5, 3.5]).forEach(s => stab(B(s), notes, BEAT * .42, chorus ? .075 : .06, chorus ? 3800 : 2600));
      if (bar < 2) pad(T0, notes, BAR, .045, bar ? 900 : 300, bar ? 2200 : 900);
      if (chorus) pad(T0, notes, BAR, .03, 1400, 1400);
      if (bar >= 2) for (let i = 0; i < 8; i++) if (i % 2 || chorus || bar < 4) bell(B(i * .5), notes[i % 3] + 12, bar < 4 ? .07 : .09);
    }
    if (bar === 0) bell(B(3.5), 81, .08);
    if (bar === 3) { for (let i = 8; i < 16; i++) snare(B(i * .25), .25 + .05 * (i - 8), false); riser(B(0) - BAR, B(4), .22); }
    if (bar === 11) [180, 150, 120, 95].forEach((f, i) => tom(B(3 + i * .25), f));
    if (bar === 15) { for (let i = 8; i < 16; i++) snare(B(i * .25), .25 + .06 * (i - 8), false); riser(B(0) - BAR, B(4), .28); }
    if (bar === 23) [200, 180, 150, 130, 110, 90].forEach((f, i) => tom(B(2.5 + i * .25), f, .8));
    if (bar === 4 || bar === 16 || bar === 20 || bar === 24) crash(B(0), bar === 16 ? .6 : .45);
    if (bar === 26) {
      [[0, 'Dm'], [1.5, 'Bb'], [3, 'C']].forEach(([s, ch]) => {
        kick(B(s)); snare(B(s), .9); crash(B(s), .35); stab(B(s), CHORD[ch], .38, .1, 4200);
        stab(B(s), CHORD[ch].map(n => n + 12), .38, .05, 5000); bass(B(s), ROOT[ch], .4, .5); bass(B(s), ROOT[ch] + 12, .4, .3);
      });
    }
    if (bar === 27) {
      kick(B(0)); crash(B(0), .7); pad(B(0), CHORD.F, BEAT * 4.3, .07, 2500, 900); stab(B(0), CHORD.F, .7, .1, 4000);
      bass(B(0), 29, BEAT * 3, .45); bass(B(0), 41, BEAT * 3, .3);
      [65, 69, 72, 77, 81, 84, 89, 93].forEach((m, i) => bell(B(i * .25), m, .07));
    }
  }
  for (const n of LEAD) if (n.t >= OFF - 1e-6 && n.t < b1 * BAR - 1e-6) lead(n.t - OFF, n.m, n.d, .16, n.t >= 16 * BAR);
  return ac.startRendering();
}
const CHUNK = 4;
function scoreChunks() {
  const out = [];
  for (let b = 0; b < BARS; b += CHUNK) out.push({ at: b * BAR, p: null, b0: b, b1: Math.min(BARS, b + CHUNK) });
  return out;
}
async function renderScore() { // whole mix in one buffer (QA / export)
  const SR = 44100, ch = scoreChunks(), full = new AudioBuffer({ numberOfChannels: 2, length: Math.ceil((DUR + 3) * SR), sampleRate: SR });
  for (const c of ch) {
    const b = await renderChunk(c.b0, c.b1), o = Math.round(c.at * SR);
    for (let k = 0; k < 2; k++) { const src = b.getChannelData(k), dst = full.getChannelData(k);
      for (let i = 0; i < src.length && o + i < dst.length; i++) dst[o + i] += src[i]; }
  }
  return full;
}

// ============================================================
//  PLAYBACK — no UI chrome; the canvas is the only surface
// ============================================================
let state = 'idle', actx = null, sources = [], t0 = 0, CHUNKS = null, ready = false;

// Render all chunks in the background, one after another, as soon as the page opens.
function prepareScore() {
  CHUNKS = scoreChunks();
  let chain = Promise.resolve();
  for (const c of CHUNKS) { chain = chain.then(() => renderChunk(c.b0, c.b1)); c.p = chain; }
  CHUNKS[0].p.then(() => { ready = true; if (state === 'idle') poster(); });
}
function poster() {
  render(34.3);
  const g = ctx; g.save(); g.setTransform(K, 0, 0, K, 0, 0);
  g.fillStyle = 'rgba(20,12,30,.55)'; g.fillRect(0, 0, W, H);
  g.lineCap = g.lineJoin = 'round';
  const c = [960, 500];
  brush(g, [[c[0] - 70, c[1] - 110], [c[0] - 74, c[1]], [c[0] - 70, c[1] + 110]], { w: 30, color: '#ffe14d', seed: 1, still: 1 });
  brush(g, [[c[0] - 70, c[1] - 110], [c[0] + 30, c[1] - 50], [c[0] + 110, c[1]]], { w: 30, color: '#ffe14d', seed: 2, still: 1 });
  brush(g, [[c[0] + 110, c[1]], [c[0] + 20, c[1] + 55], [c[0] - 70, c[1] + 110]], { w: 30, color: '#ffe14d', seed: 3, still: 1 });
  g.font = '44px "Marker Felt", "Chalkboard SE", "Comic Sans MS", cursive'; g.textAlign = 'center'; g.fillStyle = '#fff4e0';
  g.fillText(ready ? 'click anywhere  ·  sound on' : 'tuning the synths…', 960, 700);
  if (NOTE) { g.font = '28px "Marker Felt", "Chalkboard SE", cursive'; g.fillStyle = '#ffb3c8'; g.fillText(NOTE, 960, 760); }
  g.restore();
}

async function start() {
  if (state === 'play') { await actx.suspend(); state = 'paused'; return; }
  if (state === 'paused') { await actx.resume(); state = 'play'; return; }
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  await actx.resume();
  if (!ready && !userBuf) { poster(); await CHUNKS[0].p; }
  sources.forEach(s => { try { s.stop(); } catch (e) {} }); sources = [];
  if (pendingRaw) { const raw = pendingRaw; pendingRaw = null; return loadUserTrack(raw); }
  if (userBuf) { playUserTrack(); state = 'play'; return; }
  const my = t0 = actx.currentTime + .1; state = 'play';
  for (const c of CHUNKS) c.p.then(buf => {
    if (t0 !== my) return;                        // a restart happened meanwhile
    const src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination);
    const when = t0 + c.at, late = actx.currentTime - when;
    if (late > 0) src.start(actx.currentTime, late); else src.start(when);
    sources.push(src);
  });
}

function useBuiltInScore() {
  pendingRaw = null; userBuf = null; LIVE_SING = null; ready = false; prepareScore();
  NOTE = 'track failed to load — playing the built-in score';
  if (state !== 'idle') { state = 'idle'; CHUNKS[0].p.then(() => start()); } else poster();
}
let NOTE = '';

// ---------- USER TRACK ----------
// Drop an audio file on the canvas (or pass ?audio=file.mp3) to dance to your own music instead of the
// built-in score. Bar 0 starts at ?offset= seconds into the file; the mouth follows the track's vocal band.
let pendingRaw = null, userBuf = null, analyser = null, fbins = null, LIVE_SING = null;
async function loadUserTrack(arrayBuf) {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  try { userBuf = await actx.decodeAudioData(arrayBuf); }
  catch (e) { console.warn('could not decode the track, using the built-in score', e); return useBuiltInScore(); }
  analyser = actx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = .5;
  fbins = new Uint8Array(analyser.frequencyBinCount);
  const lo = Math.floor(300 / (actx.sampleRate / 1024)), hi = Math.ceil(2500 / (actx.sampleRate / 1024));
  // a full mix keeps the vocal band loud, so open the mouth on *changes* against a slow average
  let slow = 0, fast = 0;
  LIVE_SING = () => {
    analyser.getByteFrequencyData(fbins);
    let e = 0; for (let i = lo; i < hi; i++) e += fbins[i]; e /= (hi - lo);
    fast = fast * .5 + e * .5; slow = slow ? slow * .97 + e * .03 : e;
    return clamp((fast - slow * .92) / (slow * .25 + 4));
  };
  ready = true; state = 'idle'; start();
}
function playUserTrack() {
  const src = actx.createBufferSource(), g = actx.createGain();
  src.buffer = userBuf; src.connect(g); g.connect(analyser); analyser.connect(actx.destination);
  t0 = actx.currentTime + .1;
  const skip = Math.max(0, OFFSET), end = t0 + DUR + 1.5;
  src.start(t0 - Math.min(0, OFFSET), skip);
  g.gain.setValueAtTime(1, end - 1.5); g.gain.linearRampToValueAtTime(0, end); src.stop(end + .05);
  sources.push(src);
}
cv.addEventListener('dragover', e => e.preventDefault());
cv.addEventListener('drop', async e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) loadUserTrack(await f.arrayBuffer()); });

function loop() {
  if (state === 'play') {
    const t = actx.currentTime - t0 - (actx.outputLatency || 0);
    render(t);
    if (t > DUR + TAIL) {
      state = 'done';
      const g = ctx; g.save(); g.setTransform(K, 0, 0, K, 0, 0);
      g.font = '30px "Marker Felt", "Chalkboard SE", cursive'; g.textAlign = 'right'; g.fillStyle = 'rgba(255,244,224,.8)';
      g.fillText('click to play again', 1880, 60); g.restore();
    }
  }
  requestAnimationFrame(loop);
}

resize(); makeGrain();
addEventListener('resize', () => { resize(); makeGrain(); if (state !== 'play') { if (params.has('t')) render(+params.get('t')); else poster(); } });
if (params.has('t')) {
  render(+params.get('t'));
} else {
  if (params.has('audio')) fetch(params.get('audio'))
    .then(r => { if (!r.ok) throw new Error(r.status + ' ' + r.url); return r.arrayBuffer(); })
    .then(b => { pendingRaw = b; ready = true; poster(); })
    .catch(e => { console.warn('track not found, using the built-in score', e); useBuiltInScore(); });
  else prepareScore();
  poster();
  cv.addEventListener('click', () => { if (state === 'done') state = 'idle'; start(); });
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); if (state === 'done') state = 'idle'; start(); } });
  requestAnimationFrame(loop);
}
</script>
