<!doctype html>
<html lang="en">
<head>

<title>Bull Abstraction</title>
<style>
  html,body{margin:0;height:100%;background:#e8e6e1;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="engine.js"></script>
<script>
// ===================== SUBJECT — edit below =====================
// A grazing bull, facing left. Unit box x 0..200, y 8..120.
defineSheet({
  title: 'Bull Abstraction',
  polys: [[[62,14],[80,8],[100,12],[130,20],[160,24],[182,26],[190,34],[188,52],[182,64],[178,80],[182,92],[184,112],[177,114],[172,96],[168,84],[164,72],
    [158,74],[156,94],[158,112],[151,113],[147,94],[146,76],[120,72],[96,74],[86,76],[86,94],[88,112],[81,113],[77,96],[74,84],[70,84],[68,98],[70,112],
    [63,113],[60,96],[56,80],[48,72],[40,78],[32,84],[24,94],[14,98],[8,94],[8,86],[12,74],[20,62],[30,46],[44,26]]],
  strokes: [
    { pts: [[18,66],[7,60],[3,50],[6,44]], w: 1.2 },          // horns
    { pts: [[24,60],[18,50],[20,40],[26,36]], w: 1.2 },
    { pts: [[186,30],[196,46],[194,70],[198,82]], w: .8 },    // tail
  ],
  anchor: [16, 84],                                          // the head
  shade(x, y) {
    let s = (y - 20) / 75;                                   // darker toward the belly
    s += .4 * Math.exp(-((x - 70) ** 2 + (y - 55) ** 2) / 600);    // shoulder
    s += .45 * Math.exp(-((x - 20) ** 2 + (y - 84) ** 2) / 220);   // head
    s -= .4 * Math.exp(-((x - 150) ** 2 + (y - 34) ** 2) / 900);   // light hind quarter
    s -= .25 * Math.exp(-((x - 85) ** 2 + (y - 18) ** 2) / 300);   // light hump
    return s + .2 * Math.sin(x * .09) * Math.cos(y * .11);         // a little variation
  },
});
</script>
</body>
</html>
