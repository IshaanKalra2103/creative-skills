<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cero 3D Lookdev</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=Roboto+Slab:wght@900&display=block">
<style>html,body{margin:0;background:#fff;overflow:hidden}#cell{position:relative;width:1920px;height:1080px;transform-origin:0 0}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script src="assets/car-glb.js"></script>
<script src="assets/rubik-typeface.js"></script>
<script src="assets/assets3d.js"></script>
</head>
<body>
<div id="cell"></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
await Promise.all(['900 100px "Roboto Slab"', '800 40px Inter', '900 40px Inter', '700 40px Inter'].map(f => document.fonts.load(f)));
const A = window.Assets3D(THREE, { RoomEnvironment, GLTFLoader, MeshoptDecoder, FontLoader, TextGeometry, RoundedBoxGeometry });
await A.loadCar();
const cell = document.getElementById('cell');
cell.style.transform = `scale(${innerWidth / 1920})`;
const st = new A.Stage(cell); st.setPixelRatio(innerWidth / 1920 * devicePixelRatio);
const R = st.root, add = (o, x, y, s = 1, z = 0) => { A.place(o, x, y, z); o.scale.multiplyScalar(s); R.add(o); return o; };
const view = new URLSearchParams(location.search).get('v') || 'all';
if (view === 'all') {
  const p1 = A.makePack(); add(p1.group, 190, 300, 0.8);
  const p2 = A.makePack(); add(p2.group, 470, 300, 0.8); p2.group.rotation.y = -0.7; p2.money.visible = true; p2.top.position.y += 90; p2.top.position.x += 40; p2.top.rotation.z = -0.35;
  const car = A.makeCar(560); add(car, 900, 250);
  const w = A.makeWatch(); add(w, 1330, 270, 1); w.rotation.set(-0.5, 0.6, 0.5);
  const b = A.makeBall(90); add(b, 1650, 250);
  add(A.makeBill(170, .3), 1540, 470).rotation.set(0.4, 0.3, 0.2);
  add(A.makeStack(160, 18), 1790, 470).rotation.set(-0.5, 0.4, -0.3);
  ['bnb', 'poly', 'op', 'eth', 'sol', 'sq', 'bow', 'none'].forEach((g, i) => { const c = A.orangeCoin(g, 150); add(c, 110 + i * 170, 640); c.rotation.set(0.3 * (i % 3) - 0.2, 0.35 * ((i + 1) % 3) - 0.3, 0); });
  ['cat', 'leaf', 'pglass', 'stonk'].forEach((k, i) => { const c = A.tokenCoin(k, 200); add(c, 180 + i * 260, 900); c.rotation.set(0.25, -0.35 + 0.2 * i, 0.05); });
  const mp = A.makeMegapotText('$1,100,000', 150); add(mp.group, 1500, 880); mp.group.scale.x *= 0.76; mp.group.rotation.y = 0.37;
}
if (view === 'car') {
  const holder = A.makeCar(900); const car = holder.children[0]; car.rotation.set(0, Math.PI / 2, 0);
  add(holder, 560, 300);
  add(A.makeCar(820), 1400, 360); { const s2 = A.makeCar(700); s2.children[0].rotation.set(0, 0, 0); add(s2, 1500, 820); } add(A.makeWatch(), 700, 800, 1.6).rotation.set(-0.4, 0.7, 0.6); add(A.makePack().group, 1300, 800, 0.9).rotation.set(-0.1, 0.5, 0.05);
  const info = [];
  holder.updateMatrixWorld(true);
  car.traverse(o => { if (o.isMesh) { const b = new THREE.Box3().setFromObject(o); info.push(`${o.name}|${o.material.name}|${b.min.x.toFixed(0)},${b.min.y.toFixed(0)},${b.min.z.toFixed(0)}|${b.max.x.toFixed(0)},${b.max.y.toFixed(0)},${b.max.z.toFixed(0)}`); } });
  window.__info = info.join('\n');
}
st.render();
window.__ready = true;
</script>
</body>
</html>
