<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Rebuild</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  body { display: grid; place-items: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #hud {
    position: fixed; right: 12px; bottom: 12px; display: flex; gap: 6px;
    font: 11px/1 ui-monospace, Menlo, monospace; opacity: 0; transition: opacity .2s;
  }
  body:hover #hud, #hud:focus-within { opacity: 1; }
  #hud button {
    font: inherit; color: #111; background: #ffffffb0; border: 0; border-radius: 4px;
    padding: 6px 8px; cursor: pointer;
  }
  #hud button:hover { background: #fff; }
  #hud button[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <button id="sound" title="sound (m)" hidden>sound off</button>
  <button id="play" title="pause (space), step (← →)">pause</button>
</div>
<script src="data.js" charset="utf-8"></script>
<script>
(() => {
  const D = window.PIXEL, W = D.w, H = D.h, T = D.frames.length;
  document.title = D.title;
  document.body.style.background = D.backdrop;

  // palette index <-> character; must match ALPHA in scripts/extract.py
  const ALPHA = [];
  for (const [a, b] of [[33, 127], [161, 0x2B0]])
    for (let c = a; c < b; c++) { const ch = String.fromCharCode(c); if (!"\"\\~.`'\xad".includes(ch)) ALPHA.push(ch); }
  const lut = new Map(ALPHA.map((ch, i) => [ch, i]));

  // palette -> packed ABGR for a Uint32 view over ImageData
  const pal = D.palette.map(h => {
    const n = parseInt(h.slice(1), 16);
    return (0xff000000 | ((n & 0xff) << 16) | (n & 0xff00) | (n >> 16)) >>> 0;
  });

  // static background: run-length string, "<ch>~<count>." marks long runs
  const bg = new Uint32Array(W * H);
  for (let i = 0, p = 0, s = D.bg; i < s.length;) {
    const ch = s[i++];
    let n = 1;
    if (s[i] === "~") { const e = s.indexOf(".", i); n = +s.slice(i + 1, e); i = e + 1; }
    bg.fill(pal[lut.get(ch)], p, p + n); p += n;
  }

  // sprites: each cel is w*h characters, space = transparent
  const cels = D.cels.map(([w, h, s]) => {
    const px = new Uint32Array(w * h);
    for (let k = 0; k < s.length; k++) if (s[k] !== " ") px[k] = pal[lut.get(s[k])];
    return { w, h, px };
  });

  const cv = document.getElementById("c"), g = cv.getContext("2d");
  cv.width = W; cv.height = H;
  const img = g.createImageData(W, H), buf = new Uint32Array(img.data.buffer);

  function draw(f) {
    buf.set(bg);
    for (const [id, x, y] of D.frames[f]) {
      const { w, h, px } = cels[id];
      for (let j = 0; j < h; j++) {
        const row = (y + j) * W + x;
        for (let i = 0; i < w; i++) { const c = px[j * w + i]; if (c) buf[row + i] = c; }
      }
    }
    g.putImageData(img, 0, 0);
  }

  // whole device pixels per art pixel, as large as fits
  function fit() {
    const dpr = window.devicePixelRatio || 1;
    const s = Math.max(1, Math.floor(Math.min(innerWidth * dpr / W, innerHeight * dpr / H)));
    cv.style.width = (W * s / dpr) + "px"; cv.style.height = (H * s / dpr) + "px";
  }
  addEventListener("resize", fit); fit();

  // playback: each frame holds for D.durs[f] ms, the whole thing loops
  const start = D.durs.map((_, i) => D.durs.slice(0, i).reduce((a, b) => a + b, 0));
  let frame = 0, acc = 0, playing = true, last = performance.now();
  const audio = D.audio ? new Audio(D.audio) : null;
  if (audio) audio.loop = true;
  let soundOn = false;

  function tick(now) {
    const dt = Math.min(1000, Math.max(0, now - last)); last = now;
    if (playing) {
      acc += dt;
      let moved = false;
      while (acc >= D.durs[frame]) { acc -= D.durs[frame]; frame = (frame + 1) % T; moved = true; }
      if (moved) draw(frame);
      // keep the soundtrack locked to the picture
      const t = (start[frame] + acc) / 1000;
      if (soundOn && Math.abs(audio.currentTime - t) > 0.15) audio.currentTime = t;
    }
    requestAnimationFrame(tick);
  }
  draw(0); requestAnimationFrame(tick);

  const playBtn = document.getElementById("play"), soundBtn = document.getElementById("sound");
  soundBtn.hidden = !audio;
  function setPlaying(p) {
    playing = p; playBtn.textContent = p ? "pause" : "play";
    if (soundOn) p ? audio.play() : audio.pause();
  }
  function setSound(on) {
    if (!audio) return;
    soundOn = on; soundBtn.textContent = on ? "sound on" : "sound off";
    if (on && playing) { audio.currentTime = (start[frame] + acc) / 1000; audio.play().catch(() => setSound(false)); }
    else audio.pause();
  }
  function seek(f) { setPlaying(false); frame = ((f % T) + T) % T; acc = 0; draw(frame); }
  playBtn.onclick = () => setPlaying(!playing);
  soundBtn.onclick = () => setSound(!soundOn);
  addEventListener("keydown", e => {
    if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
    else if (e.key === "ArrowRight") seek(frame + 1);
    else if (e.key === "ArrowLeft") seek(frame - 1);
    else if (e.key === "m") setSound(!soundOn);
  });

  // ?f=42 opens paused on frame 42; window.pixel.seek(n) from the console or a test
  const q = new URLSearchParams(location.search).get("f");
  if (q !== null) seek(+q);
  window.pixel = { seek, get frame() { return frame; }, frames: T };
})();
</script>
</body>
</html>
