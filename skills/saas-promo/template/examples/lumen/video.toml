# lumen: an original example (a fictional AI-notes app) showing what changes between films:
# a violet palette, a different flow, durations in beats on a 124 bpm grid, and an original
# synthesized track cut to the scenes (tools/bgm.py). Every screen is HTML in screens/,
# rendered with tools/screens/render.py.
#
#   uv run tools/bgm.py examples/lumen/video.toml          # -> audio/bgm.wav (then name it in [video] audio)
#   tools/promo.sh examples/lumen/video.toml render -o lumen.mp4

[video]
title = "Lumen: write less, know more"
audio = { file = "bgm.mp3", gain = 0.0 }   # tools/bgm.py writes audio/bgm.wav; this is that track as MP3 (fframes reads wav, mp3, flac, ogg; not m4a)
bpm = 124

[palette]
preset = "violet"
accent = "#8b5cf6"

[look]
font = "Inter Display"
weight = 400
dots = 0.03
pace = 0.95

[[scene]]
kind = "title"
beats = 4
bg = ["sky", "dawn"]
words = ["Meet", "Lumen"]
size = 120
second_at = 0.42

[[scene]]
kind = "window"
beats = 5
bg = "window"
backtitle = ["Meet", "Lumen"]
window_size = [994, 585]
layer_size = [994, 585]
page = "#fbfaff"
prompt_layer = "window_prompt.png"
prompt_rect = [338, 252, 834, 344]
layers = [
  { image = "window_hero.png", at = 0.32, fade = 0.2 },
  { image = "window_side.png", at = 0.22, fade = 0.06 },
  { image = "window_nav.png", at = 0.36, fade = 0.1 },
  { image = "window_h1.png", at = 0.46, fade = 0.06, rise = 7 },
  { image = "window_h2.png", at = 0.54, fade = 0.06, rise = 7 },
  { image = "window_sub.png", at = 0.64, fade = 0.06, rise = 7 },
  { image = "window_icons.png", at = 0.6, fade = 0.07, rise = 8, cols = { n = 4, x = 482, w = 130, y = 372, h = 86, step = 0.05 } },
  { image = "window_start.png", at = 0.7, fade = 0.08, rise = 7 },
]

[[scene]]
kind = "caption"
beats = 3
bg = "sweep"
move = "settle"
drop = true
lines = ["Your notes, [organized]", "before you [ask]"]

[[scene]]
kind = "prompt"
beats = 8
bg = ["prompt", "prompt2"]
text = "Summarize my week of meetings"
placeholder = "Ask Lumen anything..."
controls = ["Notes", "Deep"]

[[scene]]
kind = "screen"
beats = 7
bg = "prompt2"
chrome = "screen_chrome.png"
size = [1128, 714]
viewport = [310, 43, 818, 671]
content = "screen_doc.png"
content_bg = "#ffffff"
scroll = { to = 640, down_at = 0.7, back_at = 1.4 }

[[scene]]
kind = "tiles"
beats = 4
bg = "free"
headline = "Free for [your first month]"
tiles = [
  { big = "$0", label = "per month", sub = "Starter" },
  { big = "$8", label = "per month", sub = "Pro", on = true },
  { big = "$16", label = "per seat", sub = "Team", on = true },
  { big = "∞", label = "custom", sub = "Enterprise" },
  { big = "24/7", label = "support", sub = "All plans" },
]

[[scene]]
kind = "caption"
beats = 4
bg = "low"
move = "drop"
lines = ["[30 templates]", "ready on day one"]

[[scene]]
kind = "wall"
beats = 6
bg = "sweep"
dots = 0.0
letterbox = true
drop = true
cards = ["card_c1.png", "card_c2.png", "card_c3.png", "card_c4.png", "card_c5.png", "card_c6.png"]
center = ["card_k1.png", "card_k2.png", "card_k3.png"]
wipe = ["#f472b6", "#6d28d9"]
button = ["Use template", "Added"]

[[scene]]
kind = "end"
beats = 10
bg = ["logo", "end", "end2"]
dots = 0.0
logo_text = "lumen"
tagline = "Write less. Know more."
pill = "Try Lumen free"
