<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fraunces:ital,opsz,wght@1,9..144,400;0,9..144,700&family=Anton&display=swap');
  * { box-sizing: border-box; margin: 0; }
  body { background: transparent; font-family: Inter, sans-serif; display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; width: 1500px; }
  .c { width: 440px; height: 270px; border-radius: 14px; overflow: hidden; position: relative; }
  .t1 { background: linear-gradient(135deg, #0f172a, #312e81); color: #fff; padding: 26px; }
  .t1 h3 { font: 800 30px/1.05 Inter; letter-spacing: -1px; } .t1 p { color: #a5b4fc; margin-top: 8px; font-size: 13px; }
  .t1 .ring { position: absolute; right: 30px; bottom: 26px; width: 110px; height: 110px; border-radius: 50%; border: 14px solid #818cf8; border-right-color: #22d3ee; }
  .t2 { background: #fff7ed; padding: 24px; } .t2 h3 { font: 700 34px/1 Fraunces, serif; color: #7c2d12; } .t2 .blob { position: absolute; right: -30px; top: 40px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fdba74, #ea580c); }
  .t2 .btn { position: absolute; left: 24px; bottom: 24px; background: #7c2d12; color: #fff; font-size: 12px; padding: 8px 14px; border-radius: 20px; }
  .t3 { background: #ecfdf5; padding: 22px; } .t3 h3 { font: 800 26px Inter; color: #064e3b; letter-spacing: -0.5px; }
  .t3 .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; } .t3 .grid i { height: 70px; border-radius: 10px; background: linear-gradient(160deg, #6ee7b7, #059669); display: block; }
  .t4 { background: #fafafa; padding: 22px; } .t4 h3 { font: 800 22px Inter; } .t4 .bars { display: flex; align-items: flex-end; gap: 9px; height: 130px; margin-top: 22px; } .t4 .bars i { flex: 1; border-radius: 5px; background: #111; display: block; }
  .t4 .bars i:nth-child(3n) { background: #f43f5e; }
  .t5 { background: radial-gradient(circle at 70% 30%, #fde047, #f97316 60%, #9a3412); padding: 26px; } .t5 h3 { font: 400 58px/0.92 Anton; color: #1c1917; text-transform: uppercase; }
  .t6 { background: #1e1b4b; padding: 24px; color: #e0e7ff; } .t6 h3 { font: italic 400 34px Fraunces, serif; } .t6 .waves { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: repeating-linear-gradient(170deg, #4f46e5 0 10px, #1e1b4b 10px 22px); opacity: .8; }
  /* centre sequence */
  .k1 { background: #f5f3ff; display: grid; place-items: center; } .k1 h3 { font: 400 66px Anton; letter-spacing: 2px; color: #2e1065; }
  .k2 { background: linear-gradient(135deg, #7c3aed, #db2777); padding: 26px; color: #fff; } .k2 h3 { font: 400 64px/0.9 Anton; text-transform: uppercase; } .k2 .sun { position: absolute; right: 34px; top: 30px; width: 120px; height: 120px; border-radius: 50%; background: #fde047; } .k2 .stripe { position: absolute; right: 0; bottom: 0; width: 210px; height: 90px; background: repeating-linear-gradient(90deg, #111 0 12px, #fff 12px 24px); }
  .k2 p { position: absolute; left: 26px; bottom: 22px; font: 600 12px Inter; letter-spacing: .1em; }
  .k3 { background: #0b1020; color: #fff; padding: 26px; } .k3 h3 { font: 800 40px/1 Inter; letter-spacing: -1.5px; } .k3 h3 span { color: #a78bfa; } .k3 .orb { position: absolute; right: -40px; bottom: -40px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #c4b5fd, #6d28d9 55%, transparent 70%); }
</style></head>
<body>
  <div class="c t1" id="c1"><h3>Ship faster,<br>stress less</h3><p>Sprint planner · 12 templates</p><div class="ring"></div></div>
  <div class="c t2" id="c2"><h3>Morning<br>pages</h3><div class="blob"></div><div class="btn">Start writing</div></div>
  <div class="c t3" id="c3"><h3>Team garden</h3><div class="grid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="c t4" id="c4"><h3>Metrics, weekly</h3><div class="bars"><i style="height:40%"></i><i style="height:65%"></i><i style="height:52%"></i><i style="height:80%"></i><i style="height:60%"></i><i style="height:95%"></i><i style="height:70%"></i></div></div>
  <div class="c t5" id="c5"><h3>Go<br>loud</h3></div>
  <div class="c t6" id="c6"><h3>Quiet hours</h3><div class="waves"></div></div>
  <div class="c k1" id="k1"><h3>NOTEBOOK</h3></div>
  <div class="c k2" id="k2"><h3>Big<br>ideas<br>club</h3><div class="sun"></div><div class="stripe"></div><p>NOV 03 · NOV 10 · NOV 17</p></div>
  <div class="c k3" id="k3"><h3>Your <span>second</span><br>brain.</h3><div class="orb"></div></div>
<script>document.body.dataset.ready = '1'</script>
</body></html>
