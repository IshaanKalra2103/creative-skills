# bolt-weekend: the worked example. A rebuild of bolt.new's "Bolt is free this weekend" promo
# (27.7 s) with the generic scene kinds. Scene starts match the reference's cuts; reference.jpg
# shows frames from the original, render.jpg ours at the same times.
#
#   tools/promo.sh examples/bolt-weekend/video.toml render -o bolt.mp4
#
# audio/bgm.mp3 is an original track from tools/bgm.py (120 bpm, whooshes on the cuts, an impact
# on the end card). To hear it with the promo's own music, put that track in audio/ and name it
# below; with the original video, REF=original.mp4 tools/cmp.sh compares frame by frame.

[video]
title = "Bolt is free this weekend"
audio = { file = "bgm.mp3", gain = 0.0 }   # wav, mp3, flac or ogg (fframes cannot read m4a)
# bpm = 120          # durations in beats + cuts snapped to the grid (or run tools/beats.py)

[palette]
preset = "blue"

[look]
font = "Inter Display"
ui_font = "Inter Text"
weight = 400
dots = 0.035
pace = 1.0

[[scene]]
kind = "title"
dur = 1.88
bg = ["sky", "dawn"]
words = ["Calling", "all", "builders"]
size = 105.5
halftone = true
pill = true
sheet = ["#dcb6f4", "#a8a6f2", "#5a86f0"]
cool = ["#5b8cf2", "#9cc0f6", "#eef5ff"]

[[scene]]
kind = "window"
dur = 2.12
bg = "window"
backtitle = ["Calling", "all", "builders"]
prompt_layer = "window_prompt.png"
prompt_rect = [354, 325, 826, 433]
window_size = [994, 602]
layer_size = [994, 585]
page = "#efecf3"
sheet = ["#e9b4f2", "#a99ef1", "#4f78ef"]
cool = ["#5b8cf2", "#9cc0f6", "#eef5ff"]
tint = ["#3159e8", "#4f78ef"]
layers = [
  { image = "window_hero.png", at = 0.32, fade = 0.2 },
  { image = "window_side.png", at = 0.22, fade = 0.06 },
  { image = "window_nav.png", at = 0.36, fade = 0.1 },
  { image = "window_h1.png", at = 0.46, fade = 0.06, rise = 7 },
  { image = "window_h2.png", at = 0.544, fade = 0.056, rise = 7 },
  { image = "window_sub.png", at = 0.64, fade = 0.064, rise = 7 },
  { image = "window_icons.png", at = 0.568, fade = 0.072, rise = 8, cols = { n = 4, x = 482, w = 54, y = 440, h = 90, step = 0.044 } },
  { image = "window_start.png", at = 0.532, fade = 0.052, rise = 7, wipe = { x = 440, y = 530, w = 360, h = 40, from = 20, dur = 0.1 } },
]

[[scene]]
kind = "tiles"
dur = 1.88
bg = "free"
headline = "Bolt is [free this weekend]"
head = { gaps = [[1, 13.0]] }
dates = { from = "2026-10-14", to = "2026-10-22", on = ["2026-10-17", "2026-10-18"] }

