<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>{{TITLE}}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#film{width:100vw;height:calc(100vw / 1.85);max-height:100vh;max-width:calc(100vh * 1.85);display:block;background:#000}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#efe6d2;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;cursor:pointer;background:rgba(0,0,0,.92);transition:opacity 1.2s}
#ui.hidden{opacity:0;pointer-events:none}
#ui h1{font-weight:400;letter-spacing:.5em;font-size:28px;margin:0 0 6px 0.5em}
#ui h2{font-weight:400;letter-spacing:.3em;font-size:13px;margin:0 0 40px;opacity:.7}
#ui .bar{width:180px;height:1px;background:rgba(255,255,255,.15)}
#ui .bar i{display:block;height:1px;width:0;background:#efe6d2;transition:width .3s}
#ui .go{opacity:0;letter-spacing:.3em;font-size:12px;margin-top:-1px;transition:opacity 1s}
#ui.ready .bar{display:none}
#ui.ready .go{opacity:.8}
#ui.ended h2::after{content:" — click to watch again"}
</style></head><body>
<div id="wrap"><canvas id="film"></canvas></div>
<div id="ui"><h1>{{TITLE_JP}}</h1><h2>{{TITLE_UPPER}}</h2><div class="bar"><i></i></div><div class="go">CLICK TO BEGIN · SPACE TO PAUSE</div></div>
<!--SCRIPTS-->
</body></html>
