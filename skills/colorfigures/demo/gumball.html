<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gumball machine</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0c0d0e; --panel:#141516; --edge:#222426;
    --line:#3d4144; --detail:#2b2e30; --body:#17181a; --deck:#1b1d1f;
    --ink:#868b8f; --ink-hi:#e6e8e9; --live:#f4f5f5;
    --glass:#0f1011; --glass-on:#1a1410; --recess:#0e0f10;
    --accent:#ff9a2e; --accent-hi:#ffc77a; --accent-dim:rgba(255,154,46,.10);
    --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg:#e9eaea; --panel:#f6f6f5; --edge:#d6d8d8;
    --line:#8e9397; --detail:#c3c6c8; --body:#ececeb; --deck:#f3f3f2;
    --ink:#6a6f73; --ink-hi:#16181a; --live:#0c0d0e;
    --glass:#dcdede; --glass-on:#f3e6da; --recess:#e2e4e4;
    --accent:#ff9a2e; --accent-hi:#ffc77a; --accent-dim:rgba(255,154,46,.10);
  } }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:#e9eaea; --panel:#f6f6f5; --edge:#d6d8d8;
    --line:#8e9397; --detail:#c3c6c8; --body:#ececeb; --deck:#f3f3f2;
    --ink:#6a6f73; --ink-hi:#16181a; --live:#0c0d0e;
    --glass:#dcdede; --glass-on:#f3e6da; --recess:#e2e4e4;
    --accent:#ff9a2e; --accent-hi:#ffc77a; --accent-dim:rgba(255,154,46,.10);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:13px; padding:20px 16px 32px; }
  .wrap { max-width:1180px; margin-inline:auto; display:grid; gap:14px; }
  .top { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 18px; text-transform:uppercase; letter-spacing:.14em; padding:0 4px; }
  .top .hi { color:var(--ink-hi); }
  .top .dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); margin-right:10px; vertical-align:1px; }
  .arrows { display:flex; gap:6px; }
  .arrows button, nav button { font:inherit; color:inherit; background:none; border:1px solid var(--edge); border-radius:10px; cursor:pointer; }
  .arrows button { padding:6px 12px; letter-spacing:.14em; text-transform:uppercase; }
  .arrows button:hover { color:var(--ink-hi); border-color:var(--line); }
  .top .hi { margin-right:auto; }
  .swatches { display:flex; align-items:center; gap:4px; padding:4px; border:1px solid var(--edge); border-radius:999px; }
  .swatches button { width:26px; height:26px; border-radius:50%; border:1px solid transparent; background:none; cursor:pointer; display:grid; place-items:center; padding:0; }
  .swatches button i { width:12px; height:12px; border-radius:50%; background:var(--sw); border:1px solid var(--line); box-shadow:0 0 0 0 var(--sw); transition:box-shadow .2s, transform .2s; }
  .swatches button:hover i { transform:scale(1.15); }
  .swatches button[aria-checked="true"] { border-color:var(--line); }
  .swatches button[aria-checked="true"] i { box-shadow:0 0 10px 1px var(--sw); }
  .swatches button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .layout { display:grid; grid-template-columns:230px minmax(0,1fr); grid-template-rows:auto 1fr; grid-template-areas:"nav fig" "credit fig"; gap:14px; align-items:start; }
  .layout > nav { grid-area:nav; } .layout > figure { grid-area:fig; } .layout > .credit { grid-area:credit; }
  .made-with { display:flex; justify-content:flex-end; padding:2px 6px 0; font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
  .made-with a { color:var(--line); text-decoration:none; transition:color .2s; }
  .made-with a:hover { color:var(--ink); }
  .credit { align-self:end; display:grid; gap:3px; padding:0 16px 22px; font-size:12px; line-height:1.5; letter-spacing:.04em; }
  .credit a { color:var(--ink); text-decoration:none; width:fit-content; transition:color .2s; }
  .credit a:hover { color:var(--ink-hi); }
  .credit a:hover .ar { color:var(--accent); }
  .credit .ar { color:var(--line); transition:color .2s; }
  .credit .by { color:var(--line); }
  .credit .nm { color:var(--ink); }
  .credit .cr { color:var(--line); margin-top:8px; font-size:11px; display:grid; gap:1px; }
  .credit .cr .hs { white-space:nowrap; }
  .credit .cr a { color:var(--line); }
  .credit .cr a:hover { color:var(--ink-hi); }
  .credit .soc { display:flex; gap:12px; margin-top:4px; }
  .credit .soc a { display:grid; place-items:center; width:16px; height:16px; }
  .credit .soc svg { width:14px; height:14px; fill:currentColor; transition:fill .2s; }
  .credit .soc a:hover svg { fill:var(--accent); }
  .credit a:focus-visible { outline:1px solid var(--accent); outline-offset:2px; border-radius:3px; }
  nav { display:grid; gap:4px; background:var(--panel); border:1px solid var(--edge); border-radius:22px; padding:14px; }
  nav button { display:flex; gap:12px; align-items:center; text-align:left; padding:9px 12px; border-color:transparent; letter-spacing:.06em; }
  nav button .n { color:var(--line); font-size:12px; transition:color .2s; }
  nav button:hover { color:var(--ink-hi); }
  nav button[aria-current="true"] { color:var(--ink-hi); border-color:var(--edge); background:var(--bg); }
  nav button[aria-current="true"] .n { color:var(--accent); text-shadow:0 0 8px var(--accent); }
  figure { margin:0; background:var(--panel); border:1px solid var(--edge); border-radius:22px; padding:22px 26px; display:grid; gap:6px; min-width:0; }
  .cap { display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 18px; text-transform:uppercase; letter-spacing:.14em; }
  .cap .hi { color:var(--ink-hi); text-transform:none; letter-spacing:.05em; }
  #stageHolder { aspect-ratio:4/3; border-radius:14px; transition:background .5s; background:radial-gradient(ellipse 50% 45% at 50% 52%, transparent, transparent); }
  #stageHolder.glow { background:radial-gradient(ellipse 50% 45% at 50% 52%, var(--accent-dim), transparent 72%); }
  #stage { width:100%; height:100%; display:block; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  #stage:focus { outline:none; }
  #stage:focus-visible { outline:1px dashed var(--line); outline-offset:4px; border-radius:8px; }
  .fx { position:absolute; width:0; height:0; overflow:hidden; }
  @media (max-width: 820px) {
    .layout { grid-template-columns:1fr; grid-template-rows:auto; grid-template-areas:"nav" "fig" "credit"; }
    .credit { padding:4px 8px 0; display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px; }
    .credit .soc { margin-top:0; }
    .credit .cr { margin-top:0; flex-basis:100%; }
    nav { position:relative; top:0; display:flex; overflow-x:auto; border-radius:16px; padding:8px; scrollbar-width:none; }
    nav button { flex:none; padding:8px 10px; }
    figure { padding:16px; }
  }

  /* ---------- shared figure vocabulary ---------- */
  #stage text { font-family:var(--mono); }
  .face { fill:var(--body); stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .face.top { fill:var(--deck); }
  .face.recess { fill:var(--recess); }
  .detail { fill:none; stroke:var(--detail); stroke-width:1; vector-effect:non-scaling-stroke; }
  .label { fill:var(--ink); font-family:var(--mono); }
  .glass { fill:var(--glass); transition:fill .3s, stroke .3s; }
  .glass.hot { fill:var(--glass-on); stroke:var(--accent); }
  .halo { fill:var(--accent); opacity:0; transition:opacity .4s; }
  .halo.hot { opacity:.22; }
  .scr { fill:var(--accent-hi); font-family:var(--mono); }
  .scr-accent { fill:var(--accent); }
  .led { fill:var(--detail); transition:fill .2s; }
  .led.hot { fill:var(--accent); }
  .wire { fill:none; stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linecap:round; stroke-linejoin:round; transition:stroke .4s; }
  .wire.hot { stroke:var(--accent); }
  .wire-under { fill:none; stroke:var(--panel); stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }
  .pulse { fill:none; stroke:var(--accent-hi); stroke-width:2.2; stroke-linecap:round; vector-effect:non-scaling-stroke;
           stroke-dasharray:70 1200; stroke-dashoffset:70; opacity:0; }
  .pulse.go { animation:flow .55s linear; }
  @keyframes flow { 0% { stroke-dashoffset:70; opacity:1; } 90% { opacity:1; } 100% { stroke-dashoffset:-1000; opacity:0; } }
  .press { cursor:pointer; transition:transform 60ms ease-out; }
  .press.down { transform:translateY(3px); }
  .press .face { transition:fill .6s ease-out, stroke .6s ease-out; }
  .press.lit .face, .press.latched .face { fill:var(--accent); stroke:var(--accent-hi); transition:none; }
  .press.lit .face.top, .press.latched .face.top { fill:var(--accent-hi); }
  .press.lit { filter:url(#glow); }
  .press.latched { filter:url(#soft); }
  .press:hover .face.top { stroke:var(--ink); }
  .blink { animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion:reduce) {
    .press, .glass, .halo, .press .face, .wire { transition:none; } .blink { animation:none; } .pulse.go { animation:none; }
  }
</style>

<style>/* ===== Colorfigures 2.0: paper theme, colour per face, 3D props ===== */
  :root[data-theme="light"] {
    --bg:#ece8de; --panel:#f6f3ec; --edge:#ddd6c8; --line:#b3ab9b; --detail:#c9c1b2;
    --ink:#857d6e; --ink-hi:#231e16; --live:#231e16; --glass:#dfe7e9; --recess:#2b2523;
    --inkc:#231e16;                      /* the drawing's ink */
    --c-top:#f6957b; --c-front:#ef6a4c; --c-side:#4a2219; --c-mid:#cf5038;   /* body colour, set by the swatches */
  }
  body { background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .39  0 0 0 0 .33  .14 0 0 0 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"); }
  #stage { overflow:visible; }   /* the hand-drawn filter sits on a group inside the stage (see mount) — iOS-safe */
  /* faces: the x-max face (box SIDE, lower right) is the lit front, the y-max face (box FRONT, lower left) is in shade */
  #stage .face { fill:var(--c-front); stroke:var(--inkc); stroke-width:1; }
  /* ink hierarchy (1.0): each solid's silhouette is drawn heavier by size (stroke-width set inline); edges inside stay thin */
  #stage .sil { fill:none; stroke:var(--inkc); stroke-linejoin:round; stroke-linecap:round; vector-effect:non-scaling-stroke; pointer-events:none; }
  #stage .panel-ink { fill:none; stroke:var(--inkc); stroke-linejoin:round; vector-effect:non-scaling-stroke; pointer-events:none; }
  #stage .face.band { stroke-width:.7; }
  #stage .prod-band { fill:var(--k); stroke:var(--k); stroke-width:.6; vector-effect:non-scaling-stroke; pointer-events:none; }
  #stage .cast { fill:#41538f; pointer-events:none; }      /* 1.0's flat blue cast shadow */
  #stage .face.ff { fill:var(--c-side); }
  #stage .face.top { fill:var(--c-top); }
  /* materials: add to a face or to anything drawn on a face plane */
  #stage .face.metal, #stage .face.top.metal { fill:#d9dddd; } #stage .face.ff.metal { fill:#9ea6a9; }
  #stage .face.cream, #stage .face.top.cream { fill:#fff4d6; } #stage .face.ff.cream { fill:#d9cfae; }
  #stage .face.dark,  #stage .face.top.dark  { fill:#46413c; } #stage .face.ff.dark  { fill:#2a2724; }
  #stage .face.plate, #stage .face.top.plate { fill:#ddd8ca; } #stage .face.ff.plate { fill:#b9b3a4; }
  #stage .face.mid { fill:var(--c-mid); } #stage .face.top.mid { fill:color-mix(in srgb, var(--c-mid) 70%, var(--c-top)); } #stage .face.ff.mid { fill:color-mix(in srgb, var(--c-mid) 45%, var(--c-side)); }
  #stage .face.recess { fill:var(--recess); }
  #stage .face.inner { fill:color-mix(in srgb, var(--c-front) 55%, #fff); }   /* inside of a door or lid */
  #stage .face.win { fill:#e3eaec; }
  #stage .face.decal { fill:color-mix(in srgb, var(--c-side) 78%, #fff); }
  #stage .detail { stroke:var(--inkc); stroke-width:1.2; opacity:.7; }
  #stage .label { fill:var(--inkc); }
  #stage .label.on-side { fill:color-mix(in srgb, var(--c-side) 55%, #000); }
  /* glass over an opening (draw after what is behind it) */
  #stage .glass-tint { fill:#cfe9f0; opacity:.22; pointer-events:none; }
  #stage .streak { fill:#fff; opacity:.38; pointer-events:none; }
  /* 3D props from K.props (colour comes from style="--k:#hex") */
  #stage .prod { fill:var(--k); stroke:var(--inkc); stroke-width:1.1; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
  #stage .prod-sh { fill:#000; opacity:.18; pointer-events:none; }
  #stage .prod-top { fill:color-mix(in srgb, var(--k) 68%, #fff); stroke:var(--inkc); stroke-width:.8; vector-effect:non-scaling-stroke; }
  #stage .prod-hi { stroke:#fff; stroke-width:1.4; opacity:.55; stroke-linecap:round; fill:none; vector-effect:non-scaling-stroke; pointer-events:none; }
  #stage .prod-label { fill:#fbf7ea; stroke:var(--inkc); stroke-width:.6; vector-effect:non-scaling-stroke; }
  #stage .prod-ink { fill:none; stroke:var(--inkc); stroke-width:1.1; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
  /* tube(): a thick line with an ink outline (spouts, handles, hoses, cables, streams); widths are in drawing units */
  #stage .tube-ink { fill:none; stroke:var(--inkc); stroke-linecap:round; stroke-linejoin:round; }
  #stage .tube { fill:none; stroke:var(--k); stroke-linecap:round; stroke-linejoin:round; }
  /* part labels / callouts (the explanation lives in the drawing): a cream pill with ink text; add .on while that part works */
  #stage .tag rect { fill:#fff4d6; stroke:var(--inkc); stroke-width:1; vector-effect:non-scaling-stroke; }
  #stage .tag text { fill:var(--inkc); font-weight:800; }
  #stage .tag.on rect { fill:var(--accent); } #stage .tag.on text { fill:#fff; }
  #stage .tag line, #stage .tag path { stroke:var(--inkc); stroke-width:1; fill:none; vector-effect:non-scaling-stroke; }
  #stage .shelf { fill:#cfd6d8; stroke:var(--inkc); stroke-width:.7; vector-effect:non-scaling-stroke; }
  #stage .shelf-edge { fill:#a9b1b4; stroke:var(--inkc); stroke-width:.9; vector-effect:non-scaling-stroke; }
  /* "how it works" strip: the big idea + numbered steps; api.step(i) lights the current one */
  .explain { display:grid; gap:10px; margin-top:6px; padding-top:14px; border-top:1px solid var(--edge); }
  .explain .steps { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; }
  .explain .step { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; align-items:start; padding:10px 12px; border:1.5px solid var(--edge);
    border-radius:12px; background:var(--bg); font-size:12px; line-height:1.45; letter-spacing:.02em; color:var(--ink); transition:border-color .25s, background .25s, color .25s, box-shadow .25s; }
  .explain .step b { display:grid; place-items:center; width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line); font-size:11px; color:var(--ink); }
  .explain .step.on { border-color:var(--inkc); background:var(--panel); color:var(--ink-hi); box-shadow:3px 3px 0 var(--inkc); }
  .explain .step.on b { background:var(--c-front); border-color:var(--inkc); color:var(--inkc); }
  .explain .idea { font-size:12.5px; color:var(--ink-hi); letter-spacing:.02em; }
  .explain .idea strong { letter-spacing:.1em; text-transform:uppercase; font-size:11px; margin-right:6px; }
  /* embed mode (build.py --embed): just the figure card, no gallery chrome */
  :root[data-embed] .wrap > .top, :root[data-embed] .layout > nav, :root[data-embed] .made-with { display:none; }   /* not #stage .top (box tops)! */
  :root[data-embed] .layout { grid-template-columns:1fr; grid-template-areas:"fig"; }
  :root[data-embed] .wrap { max-width:900px; }
  /* text under the figure is off: the buttons and the motion tell the story (hint, status line, steps, big idea).
     Remove these two rules to bring it back. */
  figure > .cap:has(#hint), #explain { display:none !important; }
  /* ?shot: drawing only (thumbnails, social images) */
  html.shot .acts, html.shot figure > .cap, html.shot .wob, html.shot #explain { display:none !important; }
  /* action buttons: listed in the order you'd use them, top-left over the figure (click any, in any order) */
  .stagewrap { position:relative; }
  .acts { position:absolute; top:4px; left:0; z-index:2; display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
  .acts button { font:inherit; font-size:12.5px; letter-spacing:.02em; color:var(--inkc); background:var(--panel); border:1.5px solid var(--inkc);
    border-radius:999px; padding:5px 14px; cursor:pointer; white-space:nowrap; }
  .acts button:hover { background:color-mix(in srgb, var(--panel) 90%, var(--inkc)); }
  .acts button:active { transform:translateY(1px); }
  @media (max-width:560px) { .acts { position:static; flex-direction:row; flex-wrap:wrap; gap:6px; margin-bottom:8px; } .acts button { font-size:12px; padding:4px 11px; }
    :root[data-embed] body { padding:10px 8px 16px; } :root[data-embed] figure { padding:12px; border-radius:16px; } }
  .wob { display:flex; align-items:center; gap:10px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
  .wob input { accent-color:var(--inkc); width:160px; }
</style>
</head>
<body>
<svg class="fx" aria-hidden="true">
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="hand" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="warp"/>
      <feDisplacementMap id="wob" in="SourceGraphic" in2="warp" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="wb"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="11" result="n1"/>
      <feColorMatrix in="n1" type="matrix" values=".3 0 0 0 .84  .3 0 0 0 .84  .3 0 0 0 .84  0 0 0 0 1" result="grain"/>
      <feBlend in="wb" in2="grain" mode="multiply" result="g1"/><feComposite in="g1" in2="wb" operator="in"/></filter>
    <filter id="bloom" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
</svg>
<div class="wrap">
  <div class="top">
    <span class="hi"><span class="dot"></span>Gumball machine</span>
    <div class="swatches" id="swatches" role="radiogroup" aria-label="Body colour"></div>
    <div class="arrows"><button id="prev" aria-label="Previous figure">← Prev</button><button id="next" aria-label="Next figure">Next →</button></div>
  </div>
  <div class="layout">
    <nav id="nav" aria-label="Figures"></nav>
    <!-- optional: <aside class="credit">Made by … <a href="…">…</a></aside> (styles below) -->
    <figure>
      <div class="cap"><span class="hi" id="fignum">Fig 1</span><span id="figname"></span></div>
      <div class="stagewrap"><div class="acts" id="acts"></div><div id="stageHolder"></div></div>
      <div class="cap"><span id="hint"></span><span class="hi" id="readout"></span></div>
      <label class="wob">hand-drawn wobble <input type="range" min="0" max="7" step="0.1" value="2.4" oninput="document.querySelectorAll('.wobmap').forEach(m => m.setAttribute('scale', (this.value * (window.__wobK || 1)).toFixed(2)))"></label>
      <div class="explain" id="explain" hidden></div>
    </figure>
  </div>
  <!-- Made-with credit: keep by default; delete this footer if you don't want it. -->
  <footer class="made-with"><a href="https://april-zhu.com/colorfigures" target="_blank" rel="noopener">Made with Colorfigures ↗</a></footer>
</div>
<script>
  // Gallery settings: palette 'ember' | 'city' | your own [[name, darkAccent, darkHi, lightAccent, lightHi], ...]
  window.GALLERY = { palette: 'ember', autoDemo: false, storageKey: 'iso-glow-accent' };
  const FIGS = [];
</script>
<!-- FIGURES: one <script> per figure, each calling FIGS.push({...}). Order here = Fig 1, 2, 3 ... -->
<script>
// Colorfigures · Gumball machine. Put a coin in, turn the crank, a gumball rolls out.
// Base: x = depth 70, y = width 84, z = 4..72. Lit front (SIDE) has a peek window onto the mechanism:
// the coin unlocks the gumball wheel, the crank turns the wheel a quarter turn, the pocket over the exit drops a gum.
FIGS.push({
  id: 'gumball', name: 'Gumball machine', palette: 'tomato',
  hint: 'Insert a coin (0) · turn the crank (space) · take the gum (T)',
  aria: 'Isometric gumball machine with a glass globe of gumballs and a see-through mechanism. Insert a coin, turn the crank, and a gumball rolls out into the tray.',
  css: `
    #stage[data-fig="gumball"] .gb-tag { fill:var(--inkc); font-weight:800; letter-spacing:.04em; }
    #stage[data-fig="gumball"] .led { transition:none; }
    #stage[data-fig="gumball"] .gb-tag.on { fill:var(--accent); }
    #stage[data-fig="gumball"] .gb-ink { fill:none; stroke:var(--inkc); stroke-width:1.2; vector-effect:non-scaling-stroke; }
    #stage[data-fig="gumball"] .gb-glass { fill:#e3eef1; opacity:.55; }
    #stage[data-fig="gumball"] .gb-disc { fill:#d9dddd; stroke:var(--inkc); stroke-width:1; vector-effect:non-scaling-stroke; }
    #stage[data-fig="gumball"] .gb-hole { fill:#3a3431; stroke:var(--inkc); stroke-width:.8; vector-effect:non-scaling-stroke; }
    #stage[data-fig="gumball"] .gb-gum { stroke:var(--inkc); stroke-width:.8; vector-effect:non-scaling-stroke; }
    #stage[data-fig="gumball"] .gb-coin { fill:#e8b84a; stroke:var(--inkc); stroke-width:.8; vector-effect:non-scaling-stroke; }`,
  mount(stage, api) {
    const W = 70, D = 84, H = 72;
    const GC = [35, 42, 106], GR = 34;                       // glass globe: centre and radius
    const CR = [24, 25], CRANK_R = 9;                         // crank centre (y, z) on the front
    const K = api.iso.frame([[-6,-6,0],[W+6,-6,0],[-6,D+6,0],[W+6,D+6,0],[W+12,D,0],[W+12,0,40],
      [GC[0]+30,GC[1]-30,GC[2]],[GC[0]-30,GC[1]+30,GC[2]],[GC[0],GC[1],GC[2]+GR+14],[W+16,24,48]]);
    const { P, SIDE, FRONT, box, boxc, props } = K;
    const { ball, cyl, cylX, block, poly, backToFront } = props;
    const F = SIDE(W + .3, D, H);                             // front: local (u,v) -> (W, D-u, H-v)
    const GUM = ['#e2473a','#f2c230','#3e86d9','#38a565','#ef6f9a','#f08a2b','#8c4bd1','#fbf7ea'];
    const f1 = v => v.toFixed(2);

    // gumballs in the globe: a jittered lattice inside the sphere, filled up to a level
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    function fillGlobe(){
      const out = [], r = 4.6, s = 8.6;
      for (let x = -GR; x <= GR; x += s) for (let y = -GR; y <= GR; y += s) for (let z = -GR; z <= 8; z += s * .86){
        const p = [x + (rnd()-.5)*2.2, y + (rnd()-.5)*2.2 + ((Math.round(z/(s*.86)) % 2) ? s/2 : 0), z];
        if (Math.hypot(...p) > GR - r - .6) continue;
        out.push({ at:[GC[0]+p[0], GC[1]+p[1], GC[2]+p[2]], r, col: GUM[Math.floor(rnd()*GUM.length)] });
      }
      return out;
    }

    // ---------- static drawing ----------
    let svg = boxc(-6,-6,0, W+12, D+12, 4, 8, 'plate');
    svg += box(0,0,4, W, D, H-4, 8);
    // shaded side: the three steps, each with a lamp that lights when it is your turn
    svg += `<g transform="${FRONT(0,D,H)}"><rect class="face decal" x="8" y="12" width="54" height="44" rx="6"/>
      ${['INSERT COIN','TURN CRANK','TAKE GUM'].map((t, i) => `<circle class="led" data-step="${i}" cx="15" cy="${22 + i*12}" r="2.6"/>
        <text class="label on-side" x="21" y="${24 + i*12}" font-size="5.2" font-weight="800">${i+1} ${t}</text>`).join('')}</g>`;
    // front: name strip, window frame, coin plate, price, chute opening
    svg += `<g transform="${F}"><rect class="face cream" x="10" y="5" width="64" height="8.5" rx="2.5"/>
      <text class="label" x="42" y="11.6" text-anchor="middle" font-size="6" font-weight="900" letter-spacing="1">GUMBALLS</text>
      <rect class="face metal" x="8" y="15.5" width="38" height="37" rx="3"/>
      <rect class="face win" x="10" y="17.5" width="34" height="33" rx="2"/>
      <g class="press" id="gb-slot"><rect class="face metal" x="51" y="16" width="18" height="15" rx="3"/>
        <rect class="face recess" x="58.5" y="19" width="3" height="9" rx="1"/></g>
      <text class="label" x="60" y="35.5" text-anchor="middle" font-size="3.6" font-weight="800">25 CENTS</text>
      <rect class="face recess" x="16" y="55" width="22" height="12" rx="3"/></g>`;
    svg += `<clipPath id="gb-win"><rect transform="${F}" x="10" y="17.5" width="34" height="33" rx="2"/></clipPath>
      <g clip-path="url(#gb-win)"><g transform="${F}" id="gb-mech"></g></g>
      <g transform="${F}"><rect class="glass-tint" x="10" y="17.5" width="34" height="33" rx="2"/>
        <path class="streak" d="M15 50.5 L27 17.5 L32 17.5 L20 50.5Z"/></g>`;
    // gum rolling out of the chute (clipped to the opening while it is still inside), then the tray in front
    svg += `<clipPath id="gb-chute"><rect transform="${F}" x="16" y="55" width="22" height="12" rx="3"/></clipPath>
      <g clip-path="url(#gb-chute)" id="gb-in"></g>`;
    svg += block(W - 1, 46, 4, W + 11, 68, 7.5, '#d9dddd');
    svg += `<g class="press" id="gb-out"></g>`;
    svg += block(W + 9, 46, 7.5, W + 11, 68, 10, '#d9dddd');          // front lip, in front of the gum
    // crank
    svg += `<g class="press" id="gb-crank"></g>`;
    // coin going into the slot: only the part in front of the face (x > W) shows
    const cut = P(W, CR[0], 0)[0];
    svg += `<clipPath id="gb-coinclip"><rect x="${f1(cut)}" y="-500" width="1000" height="1500"/></clipPath><g clip-path="url(#gb-coinclip)" id="gb-coin"></g>`;
    // neck, globe, cap
    const ring = (z, r, a0, a1, n = 16) => Array.from({length:n+1}, (_, i) => { const a = (a0 + (a1-a0)*i/n)*Math.PI/180; return [GC[0] + r*Math.cos(a), GC[1] + r*Math.sin(a), z]; });
    svg += cyl(GC[0], GC[1], H, 6, 20, 'var(--c-mid)');
    const [gx, gy] = P(...GC), GS = GR * 1.2247;
    svg += `<clipPath id="gb-globe"><circle cx="${f1(gx)}" cy="${f1(gy)}" r="${f1(GS - .4)}"/></clipPath>
      <circle class="gb-glass" cx="${f1(gx)}" cy="${f1(gy)}" r="${f1(GS)}"/>
      <g clip-path="url(#gb-globe)" id="gb-balls"></g>
      <circle class="glass-tint" cx="${f1(gx)}" cy="${f1(gy)}" r="${f1(GS)}"/>
      <path class="streak" d="M${f1(gx - GS*.72)} ${f1(gy - GS*.12)} A${f1(GS*.8)} ${f1(GS*.8)} 0 0 1 ${f1(gx - GS*.1)} ${f1(gy - GS*.78)} L${f1(gx - GS*.06)} ${f1(gy - GS*.66)} A${f1(GS*.68)} ${f1(GS*.68)} 0 0 0 ${f1(gx - GS*.6)} ${f1(gy - GS*.06)}Z"/>
      <circle class="gb-ink" cx="${f1(gx)}" cy="${f1(gy)}" r="${f1(GS)}"/>`;
    // collar: the front half of a band at the neck, over the bottom of the globe
    svg += poly([...ring(H + 6, 20.4, -45, 135), ...ring(H + 11, 20.4, 135, -45)], 'prod', 'var(--c-mid)')
         + `<path class="prod-ink" d="${K.path(ring(H + 11, 20.4, -45, 135))}"/>`;
    svg += cyl(GC[0], GC[1], GC[2] + GR - 6, 7, 15, 'var(--c-mid)') + ball(GC[0], GC[1], GC[2] + GR + 5, 4.2, 'var(--c-mid)');
    stage.setAttribute('viewBox', K.viewBox); stage.innerHTML = svg;

    const $ = s => stage.querySelector(s);
    const mech = $('#gb-mech'), ballsG = $('#gb-balls'), inG = $('#gb-in'), outG = $('#gb-out'), crankG = $('#gb-crank'), coinG = $('#gb-coin');
    const leds = stage.querySelectorAll('.led[data-step]');

    // ---------- state ----------
    // phase: idle -> coin (coin sliding in) -> ready -> turn (crank going round) -> drop (gum falls) -> roll -> tray
    const st = { phase:'idle', t0:0, globe: fillGlobe(), pockets: [null, null, null, null], k: 0, crank: 0, wiggle: 0,
                 falling: null, tray: null, coins: 0, nextCol: null, wigT: -1e9 };
    st.nextCol = st.globe[0].col;
    // pockets are indexed around the wheel; pocket j sits at angle (j + k)*90° from the top, clockwise
    st.pockets[0] = GUM[1]; st.pockets[1] = GUM[2];          // top and right are full, bottom and left empty
    let globeDirty = true;

    const ease = k => k < .5 ? 2*k*k : 1 - (-2*k + 2)**2/2;
    function drawGlobe(){
      ballsG.innerHTML = backToFront(st.globe.map(b => ({ at: b.at, svg: ball(...b.at, b.r, b.col) })));
      globeDirty = false;
    }
    function drawMech(now){
      const el = now - st.t0, cx = 26, cy = 32, R = 9.5;
      const turnK = st.phase === 'turn' ? ease(Math.min(1, el / 1400)) : 0;
      const rot = (st.k + turnK) * 90;
      const tags = { gums: st.phase === 'turn', wheel: st.phase === 'turn', coin: st.phase === 'coin' || st.phase === 'ready' };
      let s = '';
      // feed tube from the globe, with the next gum waiting
      s += `<rect class="face metal" x="22" y="14" width="8" height="9" rx="1"/><circle class="gb-gum" cx="26" cy="19.6" r="2.8" fill="${st.nextCol}"/>`;
      // exit chute below the wheel
      s += `<rect class="face metal" x="22" y="40.5" width="8" height="12"/><rect x="23.5" y="40.5" width="5" height="12" fill="#3a3431"/>`;
      // wheel with four pockets
      s += `<circle class="gb-disc" cx="${cx}" cy="${cy}" r="${R}"/><circle class="gb-hole" cx="${cx}" cy="${cy}" r="1.4"/>`;
      st.pockets.forEach((c, j) => {
        const a = ((j + st.k) * 90 + turnK * 90) * Math.PI / 180, px = cx + 6*Math.sin(a), py = cy - 6*Math.cos(a);
        s += `<circle class="gb-hole" cx="${f1(px)}" cy="${f1(py)}" r="3.3"/>`;
        if (c) s += `<circle class="gb-gum" cx="${f1(px)}" cy="${f1(py)}" r="2.7" fill="${c}"/>`;
      });
      // the gum falling down the exit chute
      if (st.falling) s += `<circle class="gb-gum" cx="26" cy="${f1(st.falling.v)}" r="2.7" fill="${st.falling.col}"/>`;
      // coin box with the coins collected so far
      s += `<rect class="face recess" x="34" y="43.5" width="9.5" height="7"/>`;
      for (let i = 0; i < Math.min(st.coins, 5); i++) s += `<rect class="gb-coin" x="35.2" y="${f1(49.2 - i*1.3)}" width="7" height="1.2" rx=".5"/>`;
      // the coin: slides down the ramp, rests against the wheel (that unlocks it), falls into the box when you turn
      s += `<path d="M44 21 L38.5 26.6" class="gb-ink" style="stroke-width:1"/>`;
      let coin = null;
      if (st.phase === 'coin') { const k = Math.min(1, el / 700); if (k > .45) { const q = (k - .45) / .55; coin = [44 - 5.6*q, 21.5 + 7*q]; } }
      else if (st.phase === 'ready') coin = [38.4, 28.5];
      else if (st.phase === 'turn' && el < 420) { const q = el / 420; coin = [38.4, 28.5 + 19*q*q]; }
      if (coin) s += `<circle class="gb-coin" cx="${f1(coin[0])}" cy="${f1(coin[1])}" r="2.8"/><circle cx="${f1(coin[0])}" cy="${f1(coin[1])}" r="1.6" fill="none" stroke="#a87a1e" stroke-width=".5"/>`;
      // labels: light up while that part is working
      s += `<text class="gb-tag${tags.gums ? ' on' : ''}" x="11.5" y="22" font-size="3.5">GUMS</text>
        <text class="gb-tag${tags.wheel ? ' on' : ''}" x="11.5" y="47.5" font-size="3.5">WHEEL</text>
        <text class="gb-tag${tags.coin ? ' on' : ''}" x="39.2" y="37" text-anchor="middle" font-size="3.5">COIN</text>
`;
      mech.innerHTML = s;
      return rot;
    }
    function drawCrank(rot){
      const a = (rot * 4 + st.wiggle) * Math.PI / 180;          // a quarter turn of the wheel = one full turn of the crank
      const [y0, z0] = CR, du = Math.sin(a), dv = -Math.cos(a), L = 7.5, wdt = 1.6;
      const pt = (t, n) => { const u = t*du + n*(-dv), v = t*dv + n*du; return [W + 3.4, y0 - u, z0 - v]; };
      let s = cylX(W, W + 3, y0, z0, CRANK_R, '#d9dddd');
      s += poly([pt(-2, -wdt), pt(L, -wdt), pt(L, wdt), pt(-2, wdt)], 'prod', 'var(--c-mid)');
      s += cylX(W + 3.4, W + 5, y0, z0, 2.4, '#d9dddd');
      const e = pt(L, 0);
      s += cylX(W + 3.4, W + 10, e[1], e[2], 2.2, '#46413c');
      crankG.innerHTML = s;
    }
    function drawOutside(now){
      const el = now - st.t0;
      // coin outside the slot: a disc in the plane y = 24, sliding in along -x
      if (st.phase === 'coin' && el < 420) {
        const xc = W + 14 - 20 * ease(Math.min(1, el / 420)), zc = 48, r = 4.2;
        const pts = Array.from({length:24}, (_, i) => { const t = i/24*2*Math.PI; return P(xc + r*Math.cos(t), CR[0], zc + r*Math.sin(t)); });
        const inner = Array.from({length:24}, (_, i) => { const t = i/24*2*Math.PI; return P(xc + r*.62*Math.cos(t), CR[0], zc + r*.62*Math.sin(t)); });
        const d = q => 'M' + q.map(p => f1(p[0]) + ' ' + f1(p[1])).join('L') + 'Z';
        coinG.innerHTML = `<path class="prod" style="--k:#e8b84a" d="${d(pts)}"/><path class="prod-ink" style="stroke:#a87a1e;stroke-width:.8" d="${d(inner)}"/>`;
      } else coinG.innerHTML = '';
      // gum rolling out of the chute onto the tray
      let gum = null;
      if (st.phase === 'roll') { const k = ease(Math.min(1, el / 500)); gum = { x: W - 6 + 11*k, col: st.tray }; }
      else if (st.phase === 'tray') gum = { x: W + 5, col: st.tray };
      const b = gum ? ball(gum.x, 57, 12.1, 4.5, gum.col) : '';
      inG.innerHTML = gum && gum.x < W + 1 ? b : '';
      outG.innerHTML = gum && gum.x >= W + 1 ? b : '';
    }
    function render(){
      const now = performance.now();
      if (globeDirty) drawGlobe();
      drawCrank(drawMech(now));
      drawOutside(now);
      const step = st.phase === 'idle' ? 0 : (st.phase === 'tray' ? 2 : 1);
      const blink = st.phase === 'idle' && now - st.wigT < 900 ? Math.floor((now - st.wigT) / 150) % 2 === 0 : true;
      leds.forEach((l, i) => l.classList.toggle('hot', i === step && blink));
      api.power(st.phase !== 'idle');
    }

    // ---------- one timer drives the motion ----------
    api.every(30, () => {
      const now = performance.now(), el = now - st.t0;
      if (st.phase === 'coin' && el >= 700) { st.phase = 'ready'; }
      else if (st.phase === 'turn' && el >= 1400) {
        st.k = (st.k + 1) % 4; st.coins++;
        // the pocket now at the bottom (angle 180°) drops its gum; the one now at the top refills from the globe
        const at = deg => st.pockets.findIndex((_, j) => ((j + st.k) * 90) % 360 === deg);
        const bottom = at(180), top = at(0);
        const col = st.pockets[bottom]; st.pockets[bottom] = null;
        st.pockets[top] = st.nextCol;
        if (st.globe.length) {                               // the level in the globe drops: take a gum off the top
          let best = 0; st.globe.forEach((b, i) => { const s = b.at[2]*3 + b.at[0] + b.at[1], o = st.globe[best]; if (s > o.at[2]*3 + o.at[0] + o.at[1]) best = i; });
          st.globe.splice(best, 1); globeDirty = true;
        }
        st.nextCol = st.globe.length ? st.globe[Math.floor(st.globe.length / 2)].col : null;
        if (col) { st.phase = 'drop'; st.t0 = now; st.falling = { v: 38, col }; st.tray = col; }
        else st.phase = 'idle';
      }
      else if (st.phase === 'drop') { const k = Math.min(1, el / 380); st.falling.v = 38 + 18*k*k; if (k >= 1) { st.falling = null; st.phase = 'roll'; st.t0 = now; } }
      else if (st.phase === 'roll' && el >= 500) st.phase = 'tray';
      if (now - st.wigT < 600) st.wiggle = 14 * Math.sin((now - st.wigT) / 600 * Math.PI * 4) * (1 - (now - st.wigT) / 600);
      else st.wiggle = 0;
      render();
    });

    function coin(){
      api.flash($('#gb-slot'));
      if (st.phase !== 'idle') return;
      st.phase = 'coin'; st.t0 = performance.now(); render();
    }
    function turn(){
      api.flash(crankG);
      if (st.phase === 'ready') { st.phase = 'turn'; st.t0 = performance.now(); return render(); }
      if (st.phase === 'idle' || st.phase === 'tray') st.wigT = performance.now();   // locked: it only wiggles
    }
    function take(){
      if (st.phase !== 'tray') return;
      api.flash(outG); st.tray = null; st.phase = 'idle'; render();
    }
    function refill(){
      if (st.phase !== 'idle' && st.phase !== 'tray') return;
      st.globe = fillGlobe(); globeDirty = true; render();
    }
    $('#gb-slot').addEventListener('click', coin);
    crankG.addEventListener('click', turn);
    outG.addEventListener('click', take);
    render();
    return {
      actions: [ { label:'Insert a coin', run: coin }, { label:'Turn the crank', run: turn },
                 { label:'Take the gumball', run: take }, { label:'Refill the globe', run: refill } ],
      key: e => { const k = e.key.toLowerCase();
        if (k === '0' || k === 'c') return coin(), true;
        if (k === ' ' || k === 'enter') return turn(), true;
        if (k === 't') return take(), true;
        return false; },
      demo: () => { coin(); api.after(900, turn); },
    };
  },
});

<!-- CORE: kernel, api, navigation, palette picker. Keep after the figures. -->
<script>
/* ============================================================
   iso gallery core: kernel, shared api, navigation.
   Figures register with FIGS.push({...}) — see CONTRACT below.
   ============================================================ */
// FIGS is declared inline in the page before the figure scripts

addEventListener('error', e => { document.documentElement.dataset.errors = (document.documentElement.dataset.errors || '') + ' ' + e.message + ';'; });
const ISO = (() => {
  const C = Math.cos(Math.PI / 6), S = Math.sin(Math.PI / 6);
  // Shading and ink shared by every solid (Colorfigures 1.0 rules):
  //  - light comes from the upper front-right: the x-max face is lit, the y-max face is in shade, curved surfaces
  //    between them get a mid band (LIGHT is the 1.0 sun at its default angle);
  //  - every solid draws its own silhouette, heavier the larger it is on screen (a body ~2.8, a knob ~1.2);
  //    edges inside a solid stay thin. Widths are screen px.
  const LIGHT = (() => { const v = [.22, -.82, 1], l = Math.hypot(...v); return v.map(x => x / l); })();
  const lightOf = n => n[0]*LIGHT[0] + n[1]*LIGHT[1] + n[2]*LIGHT[2];
  const MATS = { '':      ['var(--c-top)','var(--c-front)','var(--c-side)'],
                 metal:   ['#e6e9e9','#d9dddd','#9ea6a9'], cream:['#fffaf0','#fff4d6','#d9cfae'],
                 dark:    ['#57514b','#46413c','#2a2724'], plate:['#e6e2d6','#ddd8ca','#b9b3a4'],
                 mid:     ['color-mix(in srgb, var(--c-mid) 70%, var(--c-top))','var(--c-mid)','color-mix(in srgb, var(--c-mid) 45%, var(--c-side))'] };
  const matOf = cls => MATS[(String(cls || '').split(/\s+/).find(c => c in MATS)) || ''];
  const mixC = (a, b, t) => t <= 0 ? b : t >= 1 ? a : `color-mix(in srgb, ${a} ${Math.round(t*100)}%, ${b})`;
  // colour of a surface with outward normal n, for a material [top, lit front, shade]
  function shadeOf(n, m){
    if (n[2] > .92) return m[0];
    const d = lightOf(n);
    let c = d > -.15 ? m[1] : d > -.45 ? mixC(m[1], m[2], .5) : m[2];
    if (n[2] > .2) c = mixC(m[0], c, (n[2] - .2) / .72);        // a rounded edge turning toward the top
    return c;
  }
  const sp = pts => 'M' + pts.map(q => q[0].toFixed(2) + ' ' + q[1].toFixed(2)).join('L') + 'Z';
  function hull2(pts){ pts = pts.slice().sort((a,b) => a[0]-b[0] || a[1]-b[1]);
    const cr = (o,a,b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]), lo = [], up = [];
    for (const p of pts){ while (lo.length > 1 && cr(lo[lo.length-2], lo[lo.length-1], p) <= 0) lo.pop(); lo.push(p); }
    for (const p of pts.reverse()){ while (up.length > 1 && cr(up[up.length-2], up[up.length-1], p) <= 0) up.pop(); up.push(p); }
    lo.pop(); up.pop(); return lo.concat(up); }
  // silhouette weight from on-screen size: SPAN = the frame's width in drawing units
  function silW(pts, SPAN, cls){
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const k = Math.min(1, Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) / (SPAN * .5));
    const w = 1.15 + 1.65 * k;
    return /\bplate\b/.test(cls || '') ? Math.min(w, 1.6) : w;
  }
  const sil = (pts, SPAN, cls) => `<path class="sil" stroke-width="${silW(pts, SPAN, cls).toFixed(2)}" d="${sp(hull2(pts))}"/>`;

  function kernel(OX, OY, SPAN = 300) {
    const P = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];
    const D = (x,y,z) => [(x-y)*C, (x+y)*S - z];
    const plane = (O,U,V) => { const o=P(...O), u=D(...U), v=D(...V);
      return `matrix(${u[0]} ${u[1]} ${v[0]} ${v[1]} ${o[0]} ${o[1]})`; };
    const TOP   = (x,y,z) => plane([x,y,z],[1,0,0],[0,1,0]);
    const FRONT = (x,y,z) => plane([x,y,z],[1,0,0],[0,0,-1]);
    const SIDE  = (x,y,z) => plane([x,y,z],[0,-1,0],[0,0,-1]);
    const rect = (t,w,h,r=0,cls='face') => `<g transform="${t}"><rect class="${cls}" width="${w}" height="${h}" rx="${r}"/></g>`;
    // Rounded box: a rounded top and a wall around the visible side, shaded in bands by which way it faces
    // (lit front → mid → shade, like 1.0's swept bodies). r = 0 keeps the classic three flat faces.
    const rounded = (x,y,z,w,d,h,r,cls) => {
      r = Math.min(r, w/2, d/2);
      const n = 12, z1 = z + h, H = Math.PI/2, m = matOf(cls), c = cls ? ' ' + cls : '';
      const arc = (cx,cy,a0,a1) => { const o = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1-a0)*i/n; o.push([cx + r*Math.cos(a), cy + r*Math.sin(a), a]); } return o; };
      const ring = [...arc(x+w-r,y+r,-H,0), ...arc(x+w-r,y+d-r,0,H), ...arc(x+r,y+d-r,H,2*H), ...arc(x+r,y+r,2*H,3*H)];
      const d3 = pts => 'M' + pts.map(p => P(...p).map(v => v.toFixed(2)).join(' ')).join('L') + 'Z';
      // the visible wall runs from normal angle -45° to 135°; walk it strip by strip and merge strips of one colour
      const vis = ring.filter(p => p[2] >= -Math.PI/4 - 1e-6 && p[2] <= 3*Math.PI/4 + 1e-6);
      let out = '', run = [vis[0]], col = shadeOf([Math.cos(vis[0][2]), Math.sin(vis[0][2]), 0], m);
      const flush = () => { if (run.length < 2) return;
        const v = run.map(([a,b]) => [a,b,z]).concat(run.slice().reverse().map(([a,b]) => [a,b,z1]));
        out += `<path class="face band${c}" style="fill:${col};stroke:${col}" d="${d3(v)}"/>`; };
      for (let i = 1; i < vis.length; i++){
        const am = (vis[i-1][2] + vis[i][2]) / 2, cc = shadeOf([Math.cos(am), Math.sin(am), 0], m);
        if (cc !== col){ flush(); run = [vis[i-1]]; col = cc; }
        run.push(vis[i]);
      }
      flush();
      out += `<path class="face top${c}" d="${d3(ring.map(([a,b]) => [a,b,z1]))}"/>`;
      return out + sil([...ring.map(([a,b]) => P(a,b,z)), ...ring.map(([a,b]) => P(a,b,z1))], SPAN, cls);
    };
    const corners = (x,y,z,w,d,h) => [x,x+w].flatMap(a => [y,y+d].flatMap(b => [z,z+h].map(c => P(a,b,c))));
    const box = (x,y,z,w,d,h,r=0) => r > 0 ? rounded(x,y,z,w,d,h,r,'') :
      rect(SIDE(x+w,y+d,z+h), d,h,0,'face sf') + rect(FRONT(x,y+d,z+h), w,h,0,'face ff') + rect(TOP(x,y,z+h), w,d,0,'face top')
      + sil(corners(x,y,z,w,d,h), SPAN);
    const boxc = (x,y,z,w,d,h,r,cls) => r > 0 ? rounded(x,y,z,w,d,h,r,cls) :
      rect(SIDE(x+w,y+d,z+h), d,h,0,'face sf '+cls) + rect(FRONT(x,y+d,z+h), w,h,0,'face ff '+cls) + rect(TOP(x,y,z+h), w,d,0,'face top '+cls)
      + sil(corners(x,y,z,w,d,h), SPAN, cls);
    // Swept body (1.0's extrude): a profile in the (y, z) plane — e.g. rr(...) for a rounded front outline — swept
    // along x from x0 to x1. The curved strips are shaded in bands; the x1 end is the lit front panel.
    // Draw front-panel details after it in SIDE(x1, …) or with props. cls = material ('metal', 'cream', 'dark'…).
    function extrude(profile, x0, x1, cls = ''){
      const m = matOf(cls), n = profile.length, cy = profile.reduce((s,p) => s + p[0], 0) / n, cz = profile.reduce((s,p) => s + p[1], 0) / n;
      let out = '';
      for (let i = 0; i < n; i++){
        const a = profile[i], b = profile[(i+1) % n];
        let ny = b[1] - a[1], nz = -(b[0] - a[0]); const l = Math.hypot(ny, nz) || 1; ny /= l; nz /= l;
        if (((a[0]+b[0])/2 - cy) * ny + ((a[1]+b[1])/2 - cz) * nz < 0) { ny = -ny; nz = -nz; }
        if (ny + nz <= 1e-6) continue;                                  // faces away from the viewer
        const col = shadeOf([0, ny, nz], m);
        out += `<path class="face band${cls ? ' ' + cls : ''}" style="fill:${col};stroke:${col}" d="${sp([P(x0,a[0],a[1]), P(x1,a[0],a[1]), P(x1,b[0],b[1]), P(x0,b[0],b[1])])}"/>`;
      }
      const cap = profile.map(([u,v]) => P(x1,u,v));
      out += `<path class="face sf${cls ? ' ' + cls : ''}" style="fill:${m[1]}" d="${sp(cap)}"/>`;
      out += `<path class="panel-ink" stroke-width="${(silW(cap, SPAN) * .78).toFixed(2)}" d="${sp(cap)}"/>`;
      return out + sil([...profile.map(([u,v]) => P(x0,u,v)), ...cap], SPAN, cls);
    }
    // rounded-rectangle profile (u = y, v = z) for extrude: corners of radius r
    const rr = (u0,v0,u1,v1,r,k=8) => { r = Math.min(r, (u1-u0)/2, (v1-v0)/2); const o = [];
      for (const [cu,cv,a0] of [[u1-r,v0+r,-90],[u1-r,v1-r,0],[u0+r,v1-r,90],[u0+r,v0+r,180]])
        for (let i = 0; i <= k; i++){ const a = (a0 + 90*i/k) * Math.PI/180; o.push([cu + r*Math.cos(a), cv + r*Math.sin(a)]); }
      return o; };
    // cast shadow (1.0): the outline points of an object pushed along the light onto the ground z = z0. Draw it first.
    const shadow = (pts3, z0 = 0) => `<path class="cast" d="${sp(hull2(pts3.map(([x,y,z]) => P(x - (z - z0)*.22, y + (z - z0)*.82, z0))))}"/>`;
    // 3D polyline -> SVG path "d"
    const path = pts => 'M' + pts.map(p => P(...p).map(n => n.toFixed(2)).join(' ')).join('L');
    // screen point -> the 3D point at height z that projects there (pointer dragging, labels on moved parts)
    const unP = (X, Y, z = 0) => { const a = (X - OX) / C, b = (Y - OY + z) / S; return [(a + b) / 2, (b - a) / 2, z]; };
    // tilt a part about a screen pivot and move it so a point on it (tip, e.g. a spout) lands exactly on target.
    // All screen points. Returns the transform string for the part's <g> and where the tip ends up.
    const aim = (pivot, deg, tip, target) => { const r = deg * Math.PI / 180, dx = tip[0] - pivot[0], dy = tip[1] - pivot[1];
      const t = [pivot[0] + dx*Math.cos(r) - dy*Math.sin(r), pivot[1] + dx*Math.sin(r) + dy*Math.cos(r)];
      const sx = target[0] - t[0], sy = target[1] - t[1];
      return { transform: `translate(${sx.toFixed(2)} ${sy.toFixed(2)}) rotate(${deg} ${pivot[0].toFixed(2)} ${pivot[1].toFixed(2)})`, tip: target.slice() }; };
    return { C, S, P, D, unP, aim, plane, TOP, FRONT, SIDE, rect, box, boxc, extrude, rr, shadow, path, SPAN };
  }

  /* ---------- 3D props (Colorfigures 2.0): round and boxy things that need real depth ----------
     Every helper takes kernel 3D coordinates (x down-right, y down-left, z up) and returns an SVG string.
     Colour: pass a hex; it becomes --k for the .prod classes. Draw props back to front (backToFront). */
  function props(P, SPAN = 300) {
    const f = v => v.toFixed(1), d2 = pts => 'M' + pts.map(q => f(q[0]) + ' ' + f(q[1])).join('L') + 'Z';
    const hull = pts => { pts = pts.slice().sort((a,b) => a[0]-b[0] || a[1]-b[1]);
      const cr = (o,a,b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]), lo = [], up = [];
      for (const p of pts){ while (lo.length > 1 && cr(lo[lo.length-2], lo[lo.length-1], p) <= 0) lo.pop(); lo.push(p); }
      for (const p of pts.reverse()){ while (up.length > 1 && cr(up[up.length-2], up[up.length-1], p) <= 0) up.pop(); up.push(p); }
      lo.pop(); up.pop(); return lo.concat(up); };
    const poly = (pts3, cls = 'prod', col) => `<path class="${cls}"${col ? ` style="--k:${col}"` : ''} d="${d2(pts3.map(p => P(...p)))}"/>`;
    const arcZ = (x,y,z,r,a0,a1,n=12) => Array.from({length:n+1}, (_,i) => { const a = (a0 + (a1-a0)*i/n)*Math.PI/180; return P(x + r*Math.cos(a), y + r*Math.sin(a), z); });
    const ringZ = (x,y,z,r) => arcZ(x,y,z,r,0,360,24);
    // upright cylinder: body, shaded +y half, top cap (lid colour optional), highlight
    // a vertical wall between z0 and z1, radius r0 → r1, shaded in bands like 1.0 (lit front, mid, shade)
    const bands = (x,y,z0,r0,z1,r1,col) => {
      const cuts = [[-45,28,col], [28,59,`color-mix(in srgb, ${col} 80%, #1a1612)`], [59,135,`color-mix(in srgb, ${col} 56%, #1a1612)`]];
      return cuts.map(([a0,a1,c]) => `<path class="prod-band" style="--k:${c}" d="${d2([...arcZ(x,y,z0,r0,a0,a1,6), ...arcZ(x,y,z1,r1,a1,a0,6)])}"/>`).join('');
    };
    const silP = pts => `<path class="sil" stroke-width="${silW(pts, SPAN).toFixed(2)}" d="${d2(hull(pts))}"/>`;
    function cyl(x,y,z,h,r,col,lid){
      const a = ringZ(x,y,z,r), b = ringZ(x,y,z+h,r);
      return `<path class="prod" style="--k:${col}" d="${d2(hull([...a,...b]))}"/>` + bands(x,y,z,r,z+h,r,col)
           + `<path class="prod-top" style="--k:${lid || col}" d="${d2(b)}"/>` + silP([...a,...b])
           + (r > 2.5 ? `<path class="prod-hi" d="M${P(x+r*.95,y-r*.3,z+h*.12).map(f).join(' ')}L${P(x+r*.95,y-r*.3,z+h*.88).map(f).join(' ')}"/>` : '');
    }
    // cylinder lying along x (a knob or dial sticking out of an x-max face, or a pipe): from x0 to x1, centred (y,z)
    function cylX(x0,x1,y,z,r,col){
      const ring = x => Array.from({length:24}, (_,i) => { const a = i/24*2*Math.PI; return P(x, y + r*Math.cos(a), z + r*Math.sin(a)); });
      const A = ring(x0), B = ring(x1);
      return `<path class="prod" style="--k:${col}" d="${d2(hull([...A,...B]))}"/><path class="prod-sh" d="${d2(hull([...A.slice(12),...B.slice(12)]))}"/>`
           + `<path class="prod-top" style="--k:${col}" d="${d2(B)}"/>` + silP([...A,...B]);
    }
    // cylinder lying along y (a can in a tray, a rolled towel): from y0 to y1, centred (x,z); the +y end cap shows
    function cylY(y0,y1,x,z,r,col,cap){
      const ring = y => Array.from({length:24}, (_,i) => { const a = i/24*2*Math.PI; return P(x + r*Math.cos(a), y, z + r*Math.sin(a)); });
      return `<path class="prod" style="--k:${col}" d="${d2(hull([...ring(y0), ...ring(y1)]))}"/><path class="prod-top" style="--k:${cap || col}" d="${d2(ring(y1))}"/>`
           + silP([...ring(y0), ...ring(y1)]);
    }
    // small box with its own colour: +y face (shaded), +x face, top
    function block(x0,y0,z0,x1,y1,z1,col){
      const fy = [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]];
      return poly(fy,'prod',col) + poly(fy,'prod-sh') + poly([[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],'prod',col)
           + poly([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],'prod-top',col)
           + silP([x0,x1].flatMap(a => [y0,y1].flatMap(b => [z0,z1].map(c => P(a,b,c)))));
    }
    const can    = (x,y,z,col) => cyl(x,y,z,21,6,col,'#e3e7e8');
    const bottle = (x,y,z,col) => cyl(x,y,z,15,5.5,col) + cyl(x,y,z+15,6,2.4,'#cfe6ea') + cyl(x,y,z+21,3,2.8,col);
    const pack   = (x,y,z,col) => block(x-3.5,y-7,z,x+3.5,y+7,z+21,col) + poly([[x+3.6,y-5,z+8],[x+3.6,y+5,z+8],[x+3.6,y+5,z+13],[x+3.6,y-5,z+13]],'prod-label');
    // a thick line with an ink outline, through 3D points (smoothed into a curve unless smooth=false).
    // w = width in drawing units. Use it for spouts, handles, hoses, cables, a stream of liquid: a plain prod-ink line
    // keeps a fixed thin screen width, so a thick one loses its outline. Returns { svg, d } (d = the screen path).
    function tube(pts3, w, col, smooth = true){
      const q = pts3.map(p => P(...p)); let d = 'M' + f(q[0][0]) + ' ' + f(q[0][1]);
      if (!smooth || q.length < 3) d += q.slice(1).map(p => 'L' + f(p[0]) + ' ' + f(p[1])).join('');
      else for (let i = 0; i < q.length - 1; i++){        // Catmull-Rom through the points
        const a = q[i-1] || q[i], b = q[i], c = q[i+1], e = q[i+2] || c;
        d += `C${f(b[0]+(c[0]-a[0])/6)} ${f(b[1]+(c[1]-a[1])/6)} ${f(c[0]-(e[0]-b[0])/6)} ${f(c[1]-(e[1]-b[1])/6)} ${f(c[0])} ${f(c[1])}`; }
      return { d, svg: `<path class="tube-ink" stroke-width="${f(w + .9)}" d="${d}"/><path class="tube" style="--k:${col}" stroke-width="${f(w)}" d="${d}"/>` };
    }
    // upright cone or frustum (dripper, funnel, lampshade, flower pot, traffic cone): radius r0 at z0, r1 at z1.
    // Closed: returns one svg string. open = true: returns { back, front, rim } — draw back (the inside seen through the
    // top), then the contents (clip them with <clipPath><path d="${rim}"/></clipPath>), then front (the near wall).
    function cone(x,y,z0,r0,z1,r1,col,open=false){
      const a = ringZ(x,y,z0,r0), b = ringZ(x,y,z1,r1), sh = [...arcZ(x,y,z0,r0,50,135), ...arcZ(x,y,z1,r1,135,50)];
      if (!open) return `<path class="prod" style="--k:${col}" d="${d2(hull([...a,...b]))}"/>` + bands(x,y,z0,r0,z1,r1,col)
        + `<path class="prod-top" style="--k:${col}" d="${d2(b)}"/>` + silP([...a,...b]);
      // the near wall: the front half of the rim (-45°..135° faces the viewer) down to the front half of the base
      const near = [...arcZ(x,y,z1,r1,-45,135,16), ...arcZ(x,y,z0,r0,135,-45,16)];
      const back = `<path class="prod" style="--k:color-mix(in srgb, ${col} 84%, #5a5146)" d="${d2(b)}"/>`;   // the inside, a shade darker
      const front = `<path class="prod" style="--k:${col}" d="${d2(near)}"/>` + bands(x,y,z0,r0,z1,r1,col)
        + `<path class="prod-ink" d="${d2(b).slice(0,-1)}Z"/>` + silP([...a,...b]);
      return { back, front, rim: d2(b) };
    }
    // cup with a handle on the -y side (drawn behind) and an optional liquid level 0..1; r and h set its size
    // (default r 5, h 7 — a small cup; a mug next to a kettle wants r ≈ 7–9, h ≈ 10–12)
    function cup(x,y,z,col='#fbfaf3',level=0,liquid='#4a2b18',r=5,h=7){
      const hw = Math.max(1.2, r*.28), hp = [[x,y-r+.3,z+h*.8],[x,y-r-h*.42,z+h*.74],[x,y-r-h*.46,z+h*.34],[x,y-r+.3,z+h*.26]];
      let s = tube(hp, hw, col).svg;
      s += cyl(x,y,z,h,r,col);
      s += `<path class="prod-top" style="--k:#8a8378" d="${d2(ringZ(x,y,z+h,r-.7))}"/>`;
      if (level > 0) s += `<path class="prod" style="--k:${liquid}" d="${d2(ringZ(x,y,z+h-.6-(1-level)*h*.3,r-.9))}"/>`;
      return s;
    }
    // part label: a cream pill with a leader line to a 3D point. dx, dy = where the pill sits relative to that point, in
    // screen units (so it stays put whatever face the point is on). on = the part is working (pill turns orange).
    // For a label on a part that moves, call tag() again in render() with the part's current position.
    function tag(id, at3, dx, dy, text, on = false, size = 3.6){
      const [X,Y] = at3.length === 2 ? at3 : P(...at3),          // a 3D point, or an [X, Y] screen point
            w = text.length * size * .62 + size * 1.4, h = size * 1.75, cx = X + dx, cy = Y + dy;
      return `<g class="tag${on ? ' on' : ''}" id="${id}"><line x1="${f(X)}" y1="${f(Y)}" x2="${f(cx)}" y2="${f(cy)}"/>`
        + `<circle cx="${f(X)}" cy="${f(Y)}" r=".7" fill="var(--inkc)"/>`
        + `<rect x="${f(cx - w/2)}" y="${f(cy - h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h/2)}"/>`
        + `<text x="${f(cx)}" y="${f(cy + size*.36)}" font-size="${size}" text-anchor="middle">${text}</text></g>`;
    }
    // round knob or button sticking out of an x-max face
    const knob = (x,y,z,r,col='#d9dddd',depth=2.5) => cylX(x, x + depth, y, z, r, col);
    // door on an x-max (front) face, hinged on its RIGHT edge (the low-y side, y = hingeY), closed it spans
    // y = hingeY .. hingeY + width and z = z0 .. z1 in the plane x. angle in degrees: 0 closed, 60–75 reads best
    // (past ~90° it turns edge-on from this viewpoint). Past 45° the inside face shows (class 'face inner').
    // Returns { svg, free:[x,y] } — free is where the free edge is, handy for placing a handle.
    function door(x, hingeY, width, z0, z1, angle, cls = 'face', thick = 2){
      const a = angle*Math.PI/180, fx = x + width*Math.sin(a), fy = hingeY + width*Math.cos(a);
      const outer = [[x,hingeY,z0],[fx,fy,z0],[fx,fy,z1],[x,hingeY,z1]];
      const showsOutside = Math.cos(a) - Math.sin(a) > 0;     // its outward normal (cos a, -sin a) points at the viewer
      const edge = [[fx,fy,z0],[fx - Math.cos(a)*thick, fy + Math.sin(a)*thick, z0],[fx - Math.cos(a)*thick, fy + Math.sin(a)*thick, z1],[fx,fy,z1]];
      let svg = poly(edge, 'face ff ' + cls.replace(/\bface\b/,'').trim());
      svg += poly(outer, showsOutside ? cls : 'face inner');
      return { svg, free:[fx, fy] };
    }
    // sphere: on screen a circle of radius r*sqrt(1.5) at P(x,y,z), shaded lower-left, with a highlight
    function ball(x,y,z,r,col){
      const [X,Y] = P(x,y,z), R = r*1.2247;
      return `<circle class="prod" style="--k:${col}" cx="${f(X)}" cy="${f(Y)}" r="${f(R)}"/>`
           + `<path class="prod-sh" d="M${f(X-R)} ${f(Y)} A${f(R)} ${f(R)} 0 0 0 ${f(X+R)} ${f(Y)} A${f(R)} ${f(R*.55)} 0 0 1 ${f(X-R)} ${f(Y)}Z"/>`
           + `<circle cx="${f(X-R*.35)}" cy="${f(Y-R*.38)}" r="${f(R*.26)}" fill="#fff" opacity=".7" pointer-events="none"/>`
           + (R > SPAN * .03 ? `<circle class="sil" cx="${f(X)}" cy="${f(Y)}" r="${f(R)}" stroke-width="${silW([[X-R,Y-R],[X+R,Y+R]], SPAN).toFixed(2)}"/>` : '');
    }
    // sort parts back to front: [{at:[x,y,z], svg}] -> string (larger x+y+z is nearer the viewer)
    const backToFront = parts => parts.filter(Boolean).sort((a,b) => (a.at[0]+a.at[1]+a.at[2]) - (b.at[0]+b.at[1]+b.at[2])).map(p => p.svg).join('');
    return { hull, poly, cyl, cylX, cylY, block, can, bottle, pack, cup, knob, door, ball, tube, cone, tag, backToFront, ringZ, arcZ, d2 };
  }
  // Frame a scene: pass its extreme 3D corners. Returns kernel + viewBox padded to ~4:3.
  function frame(points, margin = 0.09, aspect = 4 / 3) {
    const d = points.map(([x,y,z]) => [(x-y)*C, (x+y)*S - z]);
    let x0 = Math.min(...d.map(p => p[0])), x1 = Math.max(...d.map(p => p[0]));
    let y0 = Math.min(...d.map(p => p[1])), y1 = Math.max(...d.map(p => p[1]));
    const m = margin * Math.max(x1 - x0, y1 - y0);
    let w = x1 - x0 + 2*m, h = y1 - y0 + 2*m;
    let ox = m - x0, oy = m - y0;
    if (w / h < aspect) { const nw = h * aspect; ox += (nw - w) / 2; w = nw; }
    else { const nh = w / aspect; oy += (nh - h) / 2; h = nh; }
    const k = kernel(ox, oy, w);
    return { ...k, props: props(k.P, w), viewBox: `0 0 ${w.toFixed(1)} ${h.toFixed(1)}`, W: w, H: h };
  }
  // repeated detail lines in a face-local group
  const slits = (a0, a1, step, b0, b1, vertical = true, cls = 'detail') => {
    let s = ''; for (let a = a0; a <= a1 + 1e-6; a += step)
      s += vertical ? `<line class="${cls}" x1="${a}" y1="${b0}" x2="${a}" y2="${b1}"/>` : `<line class="${cls}" x1="${b0}" y1="${a}" x2="${b1}" y2="${a}"/>`;
    return s;
  };
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return { kernel, frame, slits, esc };
})();

/* ---------- shared audio (created on first user gesture) ---------- */
const AUDIO = (() => {
  let ctx = null, out = null, analyser = null;
  return () => {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      out = ctx.createGain(); out.gain.value = 0.5;
      analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
      out.connect(analyser); analyser.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return { ctx, out, analyser };
  };
})();

/* ---------- app ---------- */
(function app() {
  const $ = id => document.getElementById(id);
  const CFG = window.GALLERY || {};
  const holder = $('stageHolder'), readoutEl = $('readout'), hintEl = $('hint'), numEl = $('fignum'), nameEl = $('figname');
  const nav = $('nav');
  let active = null, handle = null, timers = [], frames = [], idx = 0;

  const api = {
    iso: ISO,
    readout: s => { readoutEl.textContent = s; },
    hint: s => { hintEl.textContent = s; },
    audio: AUDIO,
    after: (ms, fn) => { const t = setTimeout(fn, ms); timers.push(t); return t; },
    every: (ms, fn) => { const t = setInterval(fn, ms); timers.push(t); return t; },
    loop: fn => { let alive = true; const f = ts => { if (!alive) return; fn(ts); requestAnimationFrame(f); };
      requestAnimationFrame(f); const stop = () => { alive = false; }; frames.push(stop); return stop; },
    // light a pressable briefly (orange flash + glow, then fade)
    flash: (el, ms = 160) => { if (!el) return; el.classList.add('down', 'lit'); clearTimeout(el._f1); clearTimeout(el._f2);
      el._f1 = setTimeout(() => el.classList.remove('down'), 110); el._f2 = setTimeout(() => el.classList.remove('lit'), ms); },
    // restart a one-shot CSS animation class (e.g. '.pulse' -> 'go')
    replay: (el, cls = 'go') => { if (!el) return; el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); },
    power: on => { holder.classList.toggle('glow', !!on); },
    // light step i of the figure's "how it works" strip (0-based; -1 = none)
    step: i => { document.querySelectorAll('#explain .step').forEach((el, k) => el.classList.toggle('on', k === i)); },
  };

  function mount(i) {
    if (handle && handle.unmount) handle.unmount();
    timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = [];
    frames.forEach(stop => stop()); frames = [];
    idx = (i + FIGS.length) % FIGS.length; active = FIGS[idx];
    setBody(chosen[active.id] || active.palette);
    holder.classList.remove('glow');
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('id', 'stage'); svg.setAttribute('role', 'img'); svg.setAttribute('tabindex', '0');
    svg.setAttribute('aria-label', active.aria || active.name);
    svg.dataset.fig = active.id;
    holder.replaceChildren(svg);
    numEl.textContent = `Fig ${CFG.number || idx + 1}`; nameEl.textContent = active.name;
    hintEl.textContent = active.hint || ''; readoutEl.textContent = '';
    const ex = $('explain'), steps = active.steps || [];
    ex.hidden = !(active.idea || steps.length);
    ex.innerHTML = (steps.length ? `<div class="steps">${steps.map((t, k) => `<div class="step"><b>${k + 1}</b><span>${t}</span></div>`).join('')}</div>` : '')
      + (active.idea ? `<div class="idea"><strong>The big idea</strong>${active.idea}</div>` : '');
    document.title = `Fig ${CFG.number || idx + 1} · ${active.name}`;
    [...nav.querySelectorAll('button[data-i]')].forEach(b => b.setAttribute('aria-current', +b.dataset.i === idx ? 'true' : 'false'));
    const cur = nav.querySelector(`button[data-i="${idx}"]`);
    if (cur && nav.scrollWidth > nav.clientWidth) nav.scrollTo({ left: cur.offsetLeft - nav.clientWidth / 2 + cur.offsetWidth / 2, behavior: 'smooth' });
    try { if (location.hash.slice(1) !== active.id) history.replaceState(null, '', '#' + active.id); } catch (e) {}   // not allowed in srcdoc/sandboxed frames
    if (/[?&]shot\b/.test(location.search)) document.documentElement.classList.add('shot');
    handle = active.mount(svg, api) || {};
    // hand-drawn wobble + grain: wrap the drawing in a group filtered by a filter defined in this same svg, with a tight
    // bounding-box region. (A CSS filter on the outer svg pointing at another svg, with a huge region, renders blank on iOS Safari.)
    const NS = 'http://www.w3.org/2000/svg', wrap = document.createElementNS(NS, 'g'), defs = document.createElementNS(NS, 'defs');
    const wobNow = +((document.querySelector('.wob input') || {}).value || 2.4);
    // grain is generated in drawing units, so scale its frequency with the drawing: a small viewBox blown up to fill the card
    // would otherwise magnify the grain into coarse blotches. Same normalisation as Colorfigures 1.0 (reference width 585).
    // The wobble is normalised the same way (warp frequency /k, displacement *k), so the pen jitter has the same size on
    // screen whatever the figure's viewBox — fixed numbers made small drawings bend in long, lazy waves.
    const vbW = (svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width) || 585, k = vbW / 585, grainF = (0.9 / k).toFixed(4);
    window.__wobK = k;
    // (the heavy outlines are drawn per solid by the kernel — see silW — so the filter only adds wobble and grain)
    defs.innerHTML = `<filter id="hand-in" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feMerge result="body"><feMergeNode in="SourceGraphic"/></feMerge>
      <feTurbulence type="fractalNoise" baseFrequency="${(0.045 / k).toFixed(4)}" numOctaves="2" seed="4" result="warp"/>
      <feDisplacementMap class="wobmap" in="body" in2="warp" scale="${(wobNow * k).toFixed(2)}" xChannelSelector="R" yChannelSelector="G" result="wb"/>
      <feTurbulence type="fractalNoise" baseFrequency="${grainF}" numOctaves="3" seed="11" result="n1"/>
      <feColorMatrix in="n1" type="matrix" values=".3 0 0 0 .84  .3 0 0 0 .84  .3 0 0 0 .84  0 0 0 0 1" result="grain"/>
      <feTurbulence type="fractalNoise" baseFrequency="${(0.012 / k).toFixed(4)}" numOctaves="2" seed="7" result="n2"/>
      <feColorMatrix in="n2" type="matrix" values=".3 0 0 0 .85  .3 0 0 0 .85  .3 0 0 0 .85  0 0 0 0 1" result="blot"/>
      <feBlend in="wb" in2="grain" mode="multiply" result="g1"/><feBlend in="g1" in2="blot" mode="multiply" result="g2"/>
      <feComposite in="g2" in2="wb" operator="in"/></filter>`;
    wrap.setAttribute('filter', 'url(#hand-in)');
    while (svg.firstChild) wrap.appendChild(svg.firstChild);
    svg.appendChild(defs); svg.appendChild(wrap);
    // the figure's actions -> buttons (mount returns { actions:[{label, run}] })
    const acts = $('acts');
    acts.innerHTML = '';
    (handle.actions || []).forEach(a => { const b = document.createElement('button'); b.textContent = a.label;
      b.addEventListener('click', () => { a.run(); svg.focus({ preventScroll: true }); }); acts.appendChild(b); });
    // demo(): with ?demo, or on every arrival when GALLERY.autoDemo is true (?still disables)
    const runDemo = /demo/.test(location.search) || (CFG.autoDemo && !/still/.test(location.search));
    if (runDemo && handle.demo) setTimeout(() => handle.demo(), 120);
    // testing: ?press=Label@ms,Label@ms clicks the buttons whose text starts with Label, at those times after load
    // (any order, repeats allowed). Errors are recorded on <html data-errors="…"> so --dump-dom shows them.
    const pm = location.search.match(/[?&]press=([^&]*)/);
    if (pm) decodeURIComponent(pm[1]).split(',').forEach(item => { const [label, ms] = item.split('@');
      setTimeout(() => { const b = [...acts.children].find(b => b.textContent.toLowerCase().startsWith(label.trim().toLowerCase()));
        if (b) b.click(); else document.documentElement.dataset.errors = (document.documentElement.dataset.errors || '') + ` no button "${label}";`; }, +ms || 0); });
  }

  // ---------- glow colour choice ----------
  const PALETTES = {
    // [name, dark accent, dark hi, light accent, light hi]
    ember: [['Ember','#ff7a1a','#ffb070','#ff7a1a','#ffb070'], ['Cyan','#22d3ee','#9beefa','#22d3ee','#9beefa'], ['Lime','#a3e635','#d6f79f','#a3e635','#d6f79f'],
            ['Violet','#a78bfa','#d6caff','#a78bfa','#d6caff'], ['Rose','#fb7185','#fdb8c2','#fb7185','#fdb8c2'], ['Ice','#dfe9ef','#ffffff','#1f2937','#3b4656']],
    city:  [['Sodium','#ff9a2e','#ffc77a','#ff9a2e','#ffc77a'], ['Tungsten','#ffd166','#ffe7a8','#ffd166','#ffe7a8'], ['Neon','#ff4fa3','#ff9fcb','#ff4fa3','#ff9fcb'],
            ['Signal','#3ee8a0','#a3f5cf','#3ee8a0','#a3f5cf'], ['Dusk','#6f9dff','#b5ccff','#6f9dff','#b5ccff'], ['Moon','#dfe7f5','#ffffff','#273246','#3d4a61']],
  };
  const ACCENTS = Array.isArray(CFG.palette) ? CFG.palette : (PALETTES[CFG.palette] || PALETTES.ember);
  const vars = (a, hi, dark) => `--accent:${a}; --accent-hi:${hi}; --accent-dim:color-mix(in srgb, ${a} 10%, transparent);` +
    ` --glass-on:color-mix(in srgb, ${a} ${dark ? 9 : 12}%, ${dark ? '#101112' : '#eef0f0'});`;
  const accentCss = ACCENTS.map(([n, da, dh, la, lh]) => { const k = n.toLowerCase();
    return `:root[data-accent="${k}"] { ${vars(da, dh, true)} }
@media (prefers-color-scheme: light) { :root[data-accent="${k}"]:not([data-theme="dark"]) { ${vars(la, lh, false)} } }
:root[data-accent="${k}"][data-theme="light"] { ${vars(la, lh, false)} }`; }).join('\n');
  const accentStyle = document.createElement('style'); accentStyle.textContent = accentCss; document.head.appendChild(accentStyle);
  document.documentElement.dataset.accent = ACCENTS[0][0].toLowerCase();
  // body colours: [name, top, front (lit), mid, side (shaded)]
  const BODIES = CFG.bodies || [
    ['Tomato',  '#f6957b','#ef6a4c','#cf5038','#4a2219'], ['Mustard', '#f8cb5e','#f4b829','#d49c1f','#4e4a18'],
    ['Mint',    '#b2e0c6','#93d3b0','#71b693','#1f4034'], ['Cobalt',  '#9ab9ea','#76a0e2','#5a82c6','#1c2948'],
    ['Blush',   '#f7c0cf','#f3a6bb','#d8869c','#4b2430'] ];
  const sw = $('swatches'), chosen = {};
  sw.innerHTML = BODIES.map(([n, , fr]) => `<button role="radio" data-body="${n.toLowerCase()}" aria-label="${n}" title="${n}" style="--sw:${fr}"><i></i></button>`).join('');
  function setBody(k) {
    const b = BODIES.find(x => x[0].toLowerCase() === (k || '').toLowerCase()) || BODIES[0], r = document.documentElement.style;
    r.setProperty('--c-top', b[1]); r.setProperty('--c-front', b[2]); r.setProperty('--c-mid', b[3]); r.setProperty('--c-side', b[4]);
    sw.querySelectorAll('button').forEach(x => x.setAttribute('aria-checked', x.dataset.body === b[0].toLowerCase() ? 'true' : 'false'));
  }
  sw.addEventListener('click', e => { const b = e.target.closest('button[data-body]'); if (!b) return;
    if (active) chosen[active.id] = b.dataset.body; setBody(b.dataset.body); const s = $('stage'); if (s) s.focus({ preventScroll: true }); });

  // per-figure css
  FIGS.forEach(f => { if (f.css) { const st = document.createElement('style'); st.textContent = f.css; document.head.appendChild(st); } });

  // navigation markup
  nav.innerHTML = FIGS.map((f, i) =>
    `<button data-i="${i}"><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${f.name}</span></button>`).join('');
  // after a nav click, hand keyboard focus to the figure so space/enter go to it, not the button
  const focusStage = () => { const s = $('stage'); if (s) s.focus({ preventScroll: true }); };
  nav.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (b) { mount(+b.dataset.i); focusStage(); } });
  $('prev').addEventListener('click', () => { mount(idx - 1); focusStage(); });
  $('next').addEventListener('click', () => { mount(idx + 1); focusStage(); });
  window.addEventListener('hashchange', () => { const i = FIGS.findIndex(f => f.id === location.hash.slice(1)); if (i >= 0 && i !== idx) mount(i); });

  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest && e.target.closest('button') && (e.key === 'Enter' || e.key === ' ')) return;
    if (handle && handle.key && handle.key(e)) { e.preventDefault(); return; }
    if (e.key === 'PageDown') mount(idx + 1);
    if (e.key === 'PageUp') mount(idx - 1);
  });
  window.addEventListener('keyup', e => { if (handle && handle.keyup) handle.keyup(e); });
  window.addEventListener('blur', () => { if (handle && handle.blur) handle.blur(); });

  if (!FIGS.length) {   // nothing registered yet (figures still being built)
    holder.innerHTML = '<p style="display:grid;place-items:center;height:100%;margin:0;letter-spacing:.14em;text-transform:uppercase">No figures yet</p>';
    numEl.textContent = 'Fig —'; return;
  }
  const start = FIGS.findIndex(f => f.id === location.hash.slice(1));
  mount(start >= 0 ? start : 0);
})();

</script>
<style>/* light theme: the same accent as the dark theme, but no ambient glow (halos, bloom, light pools, soft blur) */
  :root[data-theme="light"] .halo { display:none !important; }
  :root[data-theme="light"] .top .dot { box-shadow:none; }
  :root[data-theme="light"] .swatches button[aria-checked="true"] i { box-shadow:0 0 0 2px var(--panel), 0 0 0 3px var(--sw); }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) .halo { display:none !important; }
    :root:not([data-theme="dark"]) .top .dot { box-shadow:none; }
    :root:not([data-theme="dark"]) .swatches button[aria-checked="true"] i { box-shadow:0 0 0 2px var(--panel), 0 0 0 3px var(--sw); }
  }
</style>
<script>/* light theme: the glow filters pass the drawing through unblurred, bloom draws nothing */
(function () {
  var root = document.documentElement, mq = matchMedia('(prefers-color-scheme: light)'), orig = {};
  function apply() {
    var t = root.dataset.theme, light = t === 'light' || (t !== 'dark' && mq.matches);
    ['glow', 'soft', 'bloom'].forEach(function (id) {
      var f = document.getElementById(id); if (!f) return;
      if (!(id in orig)) orig[id] = f.innerHTML;
      f.innerHTML = !light ? orig[id] : id === 'bloom' ? '<feFlood flood-opacity="0"/>' : '<feMerge><feMergeNode in="SourceGraphic"/></feMerge>';
    });
  }
  new MutationObserver(apply).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  if (mq.addEventListener) mq.addEventListener('change', apply);
  apply();
})();
</script>
</body>
</html>
