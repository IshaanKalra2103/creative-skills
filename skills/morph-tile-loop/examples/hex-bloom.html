<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex Bloom</title>
</head>
<body>
<script src="../assets/engine.js"></script>
<script>
// Riso palette on a hex lattice: blue dot → coral hexagon with a six-point
// mint star → zoom out → dots → dive back in. 6-fold shapes, spin 1/6.
const C = { bg: '#f3ede2', coral: '#ff5a4e', blue: '#2a4bd7', mint: '#7fd1b9', ink: '#1b1b3a', sun: '#ffd23f' };

defineLoop({
  loop: 7,
  bg: C.bg,
  lattice: { type: 'hex', spacing: 0.7, radius: 0.22 },
  spin: 1 / 6,
  zoom: { depth: 24, out: [0.9, 6.3], curve: 1.5, back: [6.3, 7], nbrFade: [0.5, 0.9] },
  channels: {
    open:  [[0, 0], [0.2, 0], [0.7, 1], [2.6, 1], [3.1, 0], [3.8, 0], [4.2, 1], [5.6, 1], [6.1, 0]],
    bloom: [[0, 0], [0.5, 0], [1.2, 1], [2.3, 1], [2.9, 0], [4.0, 0], [4.6, 1], [5.4, 1], [5.9, 0]],
  },
  layers: [
    { fill: C.coral, show: c => c.open > 0.001, r: 1, e: c => lerp(1, 0.2, c.bloom), points: 6 },
    { fill: [C.sun, C.coral], tiny: C.coral, show: c => c.open > 0.001,
      r: c => lerp(0.98, 0.95, c.open) * lerp(1, 1.05, c.bloom), e: c => lerp(1, 1.8, c.bloom), points: 6, rot: Math.PI / 6 },
    { fill: C.mint, show: c => c.open > 0.001,
      r: c => lerp(1, lerp(0.72, 0.95, c.bloom), c.open), e: c => lerp(1, 2.2, c.bloom), points: 6, rot: Math.PI / 6 },
    { fill: C.blue, r: c => lerp(1, lerp(0.45, 0.4, c.bloom), c.open), e: c => lerp(1, 0.4, c.bloom), points: 6 },
  ],
  outline: { color: C.ink, width: c => 0.025 * Math.sin(Math.PI * clamp(c.open * 1.6)) * (1 - c.bloom) },
  wobble: c => 0.12 * Math.sin(Math.PI * c.bloom) * Math.sin(c.s * 4),
});
</script>
</body>
</html>
