<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@96,800&family=Caveat:wght@700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#07060b;overflow:hidden;cursor:pointer}
  canvas{display:block;width:100vw;height:100vh}
  #hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;font:12px system-ui;color:#fff3;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">click / space to replay</div>
<script>if (location.search.includes("t=")) document.getElementById("hint").hidden = true</script>
<script>
// ---------- config ----------
const params = new URLSearchParams(location.search);
// Everything here can also be overridden from the URL: ?name=ada&accent=0&yellow=ff5a36&blue=00a37a&speed=0.8
const NAME = (params.get('name') || 'hello').toLowerCase();
const ACCENT = Math.min(+(params.get('accent') ?? 1), NAME.length - 1); // index of the letter in the box
const SPEED = +(params.get('speed') || 1);                             // playback rate
const C = { bg:'#07060b', cream:'#fdfbef', white:'#f4f2ee', ink:'#1b1a20', yellow:'#f7c600', blue:'#3a2bf0', gray:'#55535e' };
for (const k in C) if (/^[0-9a-f]{6}$/i.test(params.get(k) || '')) C[k] = '#' + params.get(k); // hex without '#'
const END = 14.2;

// ---------- setup ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR, S; // S = scale unit (short side)
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; S = Math.min(W, H);
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
}
addEventListener('resize', resize);

// ---------- helpers ----------
const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOutCubic = k => 1 - (1 - k) ** 3;
const eInCubic = k => k ** 3;
const eInOut = k => k < .5 ? 4*k*k*k : 1 - (-2*k + 2) ** 3 / 2;
const eOutBack = k => { const c = 2.2; return 1 + (c+1) * (k-1) ** 3 + c * (k-1) ** 2; };
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;

// film grain: a noise tile redrawn at a random offset each frame
const grain = document.createElement('canvas'); grain.width = grain.height = 256;
{ const g = grain.getContext('2d'), d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4){ const v = Math.random() * 255; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255; }
  g.putImageData(d, 0, 0); }
let grainPat;

// ---------- primitives ----------
function stippleEllipse(cx, cy, rx, ry, rot, n, alpha, size=1.2){
  ctx.fillStyle = `rgba(255,255,255,${alpha})`;
  const cr = Math.cos(rot), sr = Math.sin(rot);
  for (let i = 0; i < n; i++){
    const a = Math.random() * 6.2832, j = 1 + gauss() * 0.025;
    const x = Math.cos(a) * rx * j, y = Math.sin(a) * ry * j;
    ctx.fillRect(cx + x*cr - y*sr, cy + x*sr + y*cr, size, size);
  }
}
function glowStar(cx, cy, R, rot, alpha, spikes=8){
  if (alpha <= 0 || R <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.9);
  g.addColorStop(0, `rgba(255,255,250,${alpha})`); g.addColorStop(.12, `rgba(255,255,240,${alpha*.8})`);
  g.addColorStop(.4, `rgba(255,250,230,${alpha*.18})`); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
  // spikes
  for (let i = 0; i < spikes; i++){
    const a = rot + i / spikes * 6.2832, L = R * (i % 2 ? 1.25 : 1.9), w = R * 0.045;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(a);
    ctx.fillStyle = `rgba(255,255,245,${alpha*.9})`;
    ctx.beginPath(); ctx.moveTo(0, -w); ctx.lineTo(L, 0); ctx.lineTo(0, w); ctx.lineTo(-L*.05, 0); ctx.fill();
    ctx.restore();
  }
  // grainy halo
  ctx.fillStyle = `rgba(255,255,255,${alpha*.55})`;
  for (let i = 0; i < 500; i++){ const a = Math.random()*6.2832, r = Math.abs(gauss()) * R * .55; ctx.fillRect(cx + Math.cos(a)*r, cy + Math.sin(a)*r, 1, 1); }
  ctx.restore();
}
function sparkle(x, y, r, rot, color){ // 4-point star
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = color; ctx.beginPath();
  for (let i = 0; i < 8; i++){ const a = i * Math.PI/4, rr = i % 2 ? r*.28 : r; ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
  ctx.fill(); ctx.restore();
}

// ---------- hyperspace streaks ----------
const streaks = Array.from({length: 520}, () => newStreak(true));
function newStreak(anyZ){
  const r = Math.random();
  return { ang: Math.random()*6.2832, z: anyZ ? Math.random() : Math.random()*.08, sp: .25 + Math.random()*.6,
    w: .6 + Math.random()*2.4, len: .1 + Math.random()*.35,
    col: r < .25 ? C.blue : r < .42 ? C.yellow : r < .62 ? '#ffffff' : C.gray };
}
function drawStreaks(cx, cy, dt, speed, alpha){
  const maxR = Math.hypot(W, H) * .6;
  ctx.save(); ctx.globalAlpha = alpha;
  for (const s of streaks){
    s.z += s.sp * speed * dt;
    if (s.z > 1) Object.assign(s, newStreak(false));
    const r0 = s.z ** 2.2 * maxR, r1 = r0 + s.len * maxR * s.z * (.4 + speed*.25);
    const w = s.w * (0.3 + s.z * 5), ca = Math.cos(s.ang), sa = Math.sin(s.ang), nx = -sa, ny = ca;
    ctx.fillStyle = s.col;
    ctx.globalAlpha = alpha * clamp(s.z * 4) * (s.col === C.gray ? .5 : .9);
    ctx.beginPath();
    ctx.moveTo(cx + ca*r0, cy + sa*r0);
    ctx.lineTo(cx + ca*r1 + nx*w, cy + sa*r1 + ny*w);
    ctx.lineTo(cx + ca*(r1+w*2), cy + sa*(r1+w*2));
    ctx.lineTo(cx + ca*r1 - nx*w*.6, cy + sa*r1 - ny*w*.6);
    ctx.fill();
  }
  ctx.restore();
}

// ---------- text layout ----------
let FS, letters = [], FONT;
function layout(){
  FS = Math.min(W / (NAME.length * .62), S * .22, 170);
  FONT = `800 ${FS}px "Bricolage Grotesque", system-ui, sans-serif`;
  ctx.font = FONT;
  const track = -FS * .02, widths = [...NAME].map(ch => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + track * (NAME.length - 1);
  let x = W/2 - total/2;
  const R = rng(7);
  letters = [...NAME].map((ch, i) => { const o = { ch, x: x + widths[i]/2, w: widths[i], rot0: (R()-.5)*1.4, col: [C.yellow, C.blue, C.white][i%3] }; x += widths[i] + track; return o; });
}

// ---------- doodle particles ----------
let doodles = [];
function spawnDoodles(){
  doodles = [];
  const R = rng(42), cy = H/2;
  letters.forEach((L, i) => {
    const t0 = 6.05 + i * .13, k = R();
    const x = L.x + (R()-.5) * L.w, y = cy - FS*.2 + (R()-.5) * FS * .9;
    const col = R() < .55 ? C.yellow : R() < .5 ? C.blue : C.white;
    const type = k < .3 ? 'burst' : k < .55 ? 'flower' : k < .8 ? 'spark' : 'dots';
    doodles.push({ t0, life: .7 + R()*.3, x, y, col, type, s: FS * (.18 + R()*.18), rot: R()*6 });
  });
}
function drawDoodle(d, t){
  const k = prog(t, d.t0, d.t0 + d.life); if (k <= 0 || k >= 1) return;
  const s = d.s * eOutBack(prog(k, 0, .35)) * (1 - eInCubic(prog(k, .7, 1)));
  ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.rot + k * 1.5);
  ctx.fillStyle = ctx.strokeStyle = d.col; ctx.lineWidth = Math.max(2, FS*.025); ctx.lineCap = 'round';
  if (d.type === 'burst'){ for (let i = 0; i < 7; i++){ const a = i/7*6.28; ctx.beginPath(); ctx.moveTo(Math.cos(a)*s*.35, Math.sin(a)*s*.35); ctx.lineTo(Math.cos(a)*s, Math.sin(a)*s); ctx.stroke(); } }
  else if (d.type === 'flower'){ for (let i = 0; i < 5; i++){ const a = i/5*6.28; ctx.beginPath(); ctx.arc(Math.cos(a)*s*.32, Math.sin(a)*s*.32, s*.22, 0, 7); ctx.fill(); }
    ctx.beginPath(); ctx.moveTo(0, s*.3); ctx.quadraticCurveTo(s*.2, s*.9, -s*.1, s*1.4); ctx.stroke(); }
  else if (d.type === 'spark'){ sparkle(0, 0, s, 0, d.col); sparkle(s*.9, -s*.6, s*.35, 0, d.col); }
  else { for (let i = 0; i < 5; i++){ ctx.beginPath(); ctx.arc(Math.cos(i*1.3)*s*(.3+i*.15), Math.sin(i*1.3)*s*(.3+i*.15), s*(.14-i*.02), 0, 7); ctx.fill(); } }
  ctx.restore();
}

// ---------- scenes ----------
function sceneCosmos(t, dt){
  const cx = W/2, cy = H/2;
  // atom rings (0.15 – 1.6)
  const ringIn = eOutCubic(prog(t, .15, .9)), ringOut = eInCubic(prog(t, .9, 1.6));
  const ringA = ringIn * (1 - ringOut);
  if (ringA > 0){
    const R = S * .22 * ringIn * (1 - ringOut * .85);
    stippleEllipse(cx, cy, R, R, 0, 900, .75 * ringA);
    stippleEllipse(cx, cy, R*.42, R*.42, 0, 400, .6 * ringA);
    for (let i = 0; i < 3; i++) stippleEllipse(cx, cy, R*.3, R*.14, t*2.2 + i*2.09, 180, .5 * ringA, 1);
    // diagonal beam
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(-1.1 + t*.3);
    ctx.fillStyle = `rgba(255,255,255,${.6*ringA})`;
    for (let i = 0; i < 600; i++){ const u = gauss() * R * 1.1, v = gauss() * R * .05; ctx.fillRect(u, v, 1, 1); }
    ctx.restore();
  }
  // streaks (1.0 – 5.2), accelerating
  const warp = prog(t, 1.0, 4.9), speed = .05 + eInCubic(warp) * 4.5;
  const streakA = prog(t, 1.0, 2.2) * (1 - prog(t, 4.95, 5.2));
  if (streakA > 0) drawStreaks(cx, cy, dt, speed, streakA);
  // central star
  const starR = S * (.02 + .06 * eOutCubic(prog(t, .3, 1.5)) + .08 * eInCubic(prog(t, 3.2, 4.8)));
  glowStar(cx, cy, starR, .4 + t * .15, prog(t, .2, .6) * (1 - prog(t, 5, 5.2)));
}

function sceneFlash(t){
  const cx = W/2, cy = H/2;
  const k = eInOut(prog(t, 4.55, 5.05)), R = k * Math.hypot(W, H) * .6;
  if (k > 0){
    ctx.fillStyle = C.cream; ctx.beginPath();
    // noisy edge for a painted look
    for (let i = 0; i <= 90; i++){ const a = i/90*6.2832, r = R * (1 + (Math.random()-.5) * .08 * (1-k)); ctx.lineTo(cx + Math.cos(a)*r, cy + Math.sin(a)*r); }
    ctx.fill();
  }
  // the "m"
  const mk = prog(t, 4.75, 6.0);
  if (mk > 0 && t < 6.0){
    const sc = lerp(.25, 1.35, eOutCubic(mk)), rot = lerp(-.9, -.25, eOutBack(prog(t, 4.75, 5.6)));
    const off = FS * .07 * Math.sin(t * 22) * (1 - prog(t, 5.5, 6));
    ctx.save(); ctx.translate(cx, cy + FS*.3); ctx.rotate(rot); ctx.scale(sc, sc);
    ctx.font = FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    const ch = NAME[0];
    ctx.fillStyle = C.blue;   ctx.fillText(ch, off + FS*.06, -off*.5 - FS*.04);
    ctx.fillStyle = C.yellow; ctx.fillText(ch, -off*.6 + FS*.03, off*.4 - FS*.06);
    ctx.fillStyle = C.ink;    ctx.fillText(ch, 0, 0);
    ctx.restore();
  }
}

function boilRect(w, h, t, seed){ // wobbly hand-drawn quad, re-randomized ~8x/s
  const R = rng(seed + Math.floor(t * 8)), j = () => (R() - .5) * w * .08;
  ctx.beginPath();
  ctx.moveTo(-w/2 + j(), -h/2 + j()); ctx.lineTo(w/2 + j(), -h/2 + j());
  ctx.lineTo(w/2 + j(), h/2 + j()); ctx.lineTo(-w/2 + j(), h/2 + j()); ctx.closePath();
}

function sceneName(t){
  if (t < 6.0 || t > 13.0) return;
  const cy = H/2, base = cy + FS * .34;
  // erase wipe (12.15 – 12.8): everything left of wipeX disappears
  const wk = eInOut(prog(t, 12.15, 12.75));
  const first = letters[0], last = letters[letters.length-1];
  const left = first.x - first.w, right = last.x + last.w;
  const wipeX = lerp(left - FS*.3, right + FS*.3, wk);

  ctx.save();
  if (wk > 0){ ctx.beginPath(); ctx.rect(wipeX, 0, W, H); ctx.clip(); }
  ctx.font = FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  letters.forEach((L, i) => {
    const t0 = 6.0 + i * .13, k = prog(t, t0, t0 + .55);
    if (k <= 0) return;
    const sc = eOutBack(k), rot = L.rot0 * (1 - eOutCubic(k)), dy = -FS * .5 * (1 - eOutCubic(k));
    const settle = prog(t, t0 + .25, t0 + .6);
    ctx.save(); ctx.translate(L.x, base + dy); ctx.rotate(rot); ctx.scale(sc, sc);
    if (settle < 1){ // colored ghost offsets while landing
      const o = FS * .09 * (1 - settle);
      ctx.fillStyle = C.blue; ctx.fillText(L.ch, o, -o*.4);
      ctx.fillStyle = C.yellow; ctx.fillText(L.ch, -o*.7, o*.3);
    }
    if (i === ACCENT) drawAccent(L, t, settle);
    else { ctx.fillStyle = settle < .5 ? L.col : C.white; ctx.fillText(L.ch, 0, 0); }
    ctx.restore();
  });
  ctx.restore();

  // twinkle sparkle above the name
  const tw = prog(t, 7.4, 10.4);
  if (tw > 0 && tw < 1){
    const s = FS * .13 * Math.sin(tw * Math.PI) * (.75 + .25 * Math.sin(t * 9));
    sparkle(letters[Math.min(letters.length-2, ACCENT+3)].x + FS*.1, cy - FS*.55, s, t*.8, C.white);
  }
  // swoosh line flying in, then jagged wipe edge
  const sw = prog(t, 11.85, 12.25);
  if (sw > 0 && sw < 1){
    const x1 = lerp(left - FS*1.2, left, eOutCubic(sw)), x0 = x1 - FS * .8 * (1 - sw);
    ctx.strokeStyle = C.yellow; ctx.lineWidth = FS*.03; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x0, cy); ctx.lineTo(x1, cy); ctx.stroke();
  }
  if (wk > 0 && wk < 1){
    const R = rng(Math.floor(t * 20));
    ctx.save(); ctx.translate(wipeX, cy);
    [[C.yellow, 0], [C.blue, -FS*.25]].forEach(([col, ox]) => {
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(ox - FS*.6, FS*.2);
      for (let i = 0; i < 4; i++) ctx.lineTo(ox - FS*.45 + i*FS*.18, (i % 2 ? .15 : -.35 - R()*.2) * FS);
      ctx.lineTo(ox + FS*.2, FS*.2); ctx.fill();
    });
    ctx.restore();
  }
}

function drawAccent(L, t, settle){
  const w = L.w * 1.15, h = FS * .72, midY = -FS * .34;
  // phase A: yellow boiling box with dark letter (settle → 10.6)
  const boxOut = prog(t, 10.5, 10.8);
  if (boxOut < 1){
    const spin = eInOut(prog(t, 8.5, 8.9)) - eInOut(prog(t, 9.4, 9.8)); // rotate out & back
    const wig = Math.sin(t * 3) * .06;
    ctx.save(); ctx.translate(0, midY); ctx.rotate(-.12 + wig + spin * .9); ctx.scale((1 + spin*.12) * (1 - boxOut), (1 + spin*.12) * (1 - boxOut));
    ctx.fillStyle = C.yellow; boilRect(w, h, t, 3); ctx.fill();
    ctx.fillStyle = settle < .5 ? C.white : C.bg;
    ctx.save(); ctx.rotate(.12 - wig - spin*.9 + Math.sin(t*2)*.05); ctx.font = `800 ${FS*.8}px "Bricolage Grotesque", sans-serif`; ctx.fillText(L.ch, 0, FS*.28); ctx.restore();
    ctx.restore();
  }
  // phase B: yellow outlined letter inside a scribbled loop (10.6 – 11.35)
  const b = prog(t, 10.6, 11.35);
  if (b > 0 && b < 1){
    ctx.fillStyle = C.yellow; ctx.fillText(L.ch, 0, 0);
    ctx.strokeStyle = C.yellow; ctx.lineWidth = FS * .035; ctx.lineCap = 'round';
    const draw = eOutCubic(prog(b, 0, .5)), fade = 1 - prog(b, .8, 1);
    ctx.globalAlpha = fade; ctx.beginPath();
    for (let a = 0; a <= draw * 6.2832 * 1.7; a += .1){ const r = FS * (.42 + a * .012); ctx.lineTo(Math.cos(a - 2)*r*1.1, midY + Math.sin(a - 2)*r*.85); }
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  // phase C: cursive yellow "a" (11.35 – 11.95)
  const c = prog(t, 11.35, 11.95);
  if (c > 0 && c < 1){
    ctx.save(); ctx.fillStyle = C.yellow; ctx.font = `700 ${FS*1.15}px Caveat, cursive`;
    const sc = eOutBack(prog(c, 0, .4)); ctx.scale(sc, sc); ctx.fillText(L.ch, 0, FS*.02); ctx.restore();
  }
  // phase D: plain white (11.95 →)
  if (t >= 11.95){ const s = eOutBack(prog(t, 11.95, 12.2)); ctx.save(); ctx.scale(s, s); ctx.fillStyle = C.white; ctx.fillText(L.ch, 0, 0); ctx.restore(); }
}

function sceneOutro(t){
  const cy = H/2, right = letters[letters.length-1].x + FS*.4;
  // little yellow comma flying out of the wipe
  const f = prog(t, 12.7, 13.05);
  if (f > 0 && f < 1){
    ctx.save(); ctx.translate(lerp(right, W/2 + FS*1.3, eOutCubic(f)), cy + FS*.05); ctx.rotate(f * 4);
    ctx.fillStyle = C.yellow; ctx.beginPath(); ctx.ellipse(0, 0, FS*.03, FS*.07, 0, 0, 7); ctx.fill(); ctx.restore();
  }
  // white 4-point star that pops, spins and pinches out
  const s = prog(t, 13.0, 13.9);
  if (s > 0 && s < 1){
    const r = FS * .22 * eOutBack(prog(s, 0, .3)) * (1 - eInCubic(prog(s, .45, 1)));
    sparkle(W/2 + FS*1.3, cy + FS*.05, r, s * 2.5, C.white);
  }
}

// ---------- main loop ----------
let start = performance.now(), last = start;
function replay(){ start = performance.now(); streaks.forEach(s => Object.assign(s, newStreak(true))); spawnDoodles(); }
addEventListener('click', replay);
addEventListener('keydown', e => { if (e.code === 'Space' || e.key === 'r') replay(); });

function frame(now){
  const dt = Math.min(.05, (now - last) / 1000) * SPEED; last = now;
  let t = (now - start) / 1000 * SPEED;
  if (params.has('t')) t = +params.get('t'); // freeze frame for debugging
  if (t > END + .8) { replay(); t = 0; }

  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  if (t < 5.3) sceneCosmos(t, dt);
  if (t > 4.5 && t < 6.0) sceneFlash(t);
  if (t >= 6.0){
    sceneName(t);
    doodles.forEach(d => drawDoodle(d, t));
    sceneOutro(t);
  }

  // grain overlay (stronger on the cream flash)
  ctx.save();
  ctx.globalAlpha = (t > 4.9 && t < 6.0) ? .05 : .045;
  ctx.globalCompositeOperation = (t > 4.9 && t < 6.0) ? 'multiply' : 'screen';
  ctx.translate(-Math.random()*256, -Math.random()*256);
  ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W + 256, H + 256);
  ctx.restore();

  requestAnimationFrame(frame);
}

document.fonts.load('800 100px "Bricolage Grotesque"').then(() => document.fonts.load('700 100px Caveat')).catch(() => {}).finally(() => {
  grainPat = ctx.createPattern(grain, 'repeat');
  resize(); spawnDoodles(); replay();
  requestAnimationFrame(t => { last = t; start = t; frame(t); });
});
</script>
</body>
</html>
